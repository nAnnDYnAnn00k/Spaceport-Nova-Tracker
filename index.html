  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Three.js & OrbitControls for 3D Topographic Digital Twin -->

  <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

      background-color: #020617;

      padding: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Geographic Coordinates: Launch Complex 1, Canso / Hazel Hill, NS
    const CANSO_PAD = { 
      lat: 45.3056, 
      lng: -60.9814, 
      name: "Spaceport Nova Scotia (LC-1)" 
    };

    // Active Commercial Manifest
    const ROCKET_MANIFEST = [
      {
        id: "barracuda-4",
        name: "Barracuda (Flight 4)",
        operator: "T-Minus Engineering",
        propellantTons: 0.6,
        payloadKg: 15,

        targetDate: "October 2026",
        status: "Pad Readiness Review",
        missionType: "Suborbital"
      },
      {
        id: "aurora-8",
        name: "Aurora-8 (Orbital Demo)",
        operator: "Reaction Dynamics (RDX)",
        propellantTons: 14,
        payloadKg: 200,
        orbit: "SSO / Polar LEO (500 km)",
        targetDate: "Q3 2028",
        status: "Launch Agreement",
        missionType: "Orbital"
      },
      {
        id: "spectrum-1",
        name: "Spectrum (Dedicated Complex)",
        operator: "Isar Aerospace",
        propellantTons: 58,
        payloadKg: 1000,
        orbit: "Polar / SSO Orbit (Up to 98.1°)",
        targetDate: "2028",
        status: "Statement of Work Executed",
        missionType: "Orbital"
      },
      {
        id: "c4m-baseline",

        operator: "Maritime Launch Services",
        propellantTons: 260,
        payloadKg: 5000,
        orbit: "LEO / SSO (87.9° - 98.1°)",
        targetDate: "Baseline Design",

        missionType: "Medium Lift"
      }
    ];

    // Civil Infrastructure Progress
    const SPACEPORT_FACILITIES = [
      { name: "Environmental Assessment & Crown Land Lease (335 Acres)", progress: 100, tag: "Regulatory", desc: "Provincial EA clearance & long-term site lease approved." },
      { name: "Suborbital Launch Pad & Campaign Setup", progress: 100, tag: "Suborbital Ops", desc: "Operational for commercial suborbital hypersonic flight tests." },
      { name: "Leaf Space Ground Tracking Station", progress: 100, tag: "Ground Segment", desc: "Commercial satellite antenna active and communicating on site." },
      { name: "Phase 1 Civil Works (Site Grading & Pad Access Roads)", progress: 90, tag: "Civil Works", desc: "Access corridors between Sable Wind Farm perimeter and pads." },
      { name: "Site Entrance & Primary Security Gatehouse", progress: 60, tag: "Site Control", desc: "Procurement & municipal coordination replacing temporary structures." },
      { name: "Central Utility Hub (Power, Fiber Comms, Water)", progress: 45, tag: "Utilities", desc: "Infrastructure package tendered via Lindsay Construction." },
      { name: "Dedicated Orbital Complex (Isar & RDX Pads)", progress: 25, tag: "Launch Pads", desc: "Multi-pad civil layout accommodating domestic and European vehicles." },
      { name: "Permanent Vehicle Assembly & Integration Facility (HIF)", progress: 20, tag: "Integration", desc: "Hangar engineering advancing toward construction tender." }
    ];

    // Geodesic Haversine Calculation
    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Hopkinson-Cranz Blast Scaling
    function calculateRadii(propellantTons) {
      const cbrt = Math.cbrt(Math.max(propellantTons, 0.2));
      return {
        blastRadius: Number((0.5 * cbrt).toFixed(2)),
        overpressureRadius: Number((1.1 * cbrt).toFixed(2)),
        acousticRadius: Number((1.9 * cbrt).toFixed(2)),
        notmarRadius: Number((3.6 * cbrt).toFixed(2))
      };
    }

    function getSafetyStatus(distanceKm, radii) {
      if (distanceKm < radii.blastRadius) {
        return { 
          level: "LETHAL HAZARD", 
          color: "bg-red-950/80 border-red-500 text-red-200", 
          badge: "bg-red-600", 
          text: "INSIDE PRIMARY BLAST ZONE: Catastrophic deflagration & fragmentation perimeter." 
        };
      }
      if (distanceKm < radii.overpressureRadius) {
        return { 
          level: "HIGH HAZARD", 
          color: "bg-orange-950/80 border-orange-500 text-orange-200", 
          badge: "bg-orange-600", 
          text: "INSIDE OVERPRESSURE RANGE: Risk of blast wave injury and window failure." 
        };
      }
      if (distanceKm < radii.acousticRadius) {
        return { 
          level: "RESTRICTED", 
          color: "bg-yellow-950/80 border-yellow-500 text-yellow-200", 
          badge: "bg-yellow-600", 
          text: "ACOUSTIC WARNING: Sound pressure exceeds 140 dB. Mandatory ear protection." 
        };
      }
      if (distanceKm < radii.notmarRadius) {
        return { 
          level: "CAUTION", 
          color: "bg-blue-950/80 border-blue-500 text-blue-200", 
          badge: "bg-blue-600", 
          text: "INSIDE NOTICE TO MARINERS (NOTMAR) BUFFER: Closed to marine and fishing vessels." 
        };
      }
      return { 
        level: "SAFE OBSERVATION", 
        color: "bg-emerald-950/80 border-emerald-500 text-emerald-200", 
        badge: "bg-emerald-600", 
        text: "You are outside all critical hazard boundaries. Safe public observation sector." 
      };
    }

    // --- OPTIMIZED 3D Digital Twin Component (Three.js) ---
    function ThreeSpaceportViewer({ year, showDomes }) {
      const mountRef = useRef(null);
      const phasesRef = useRef({}); // Stores references to our 3D groups

      // 1. Initialize Scene (Runs ONCE when tab opens)
      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight || 550;

        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b14);
        scene.fog = new THREE.FogExp2(0x050b14, 0.012);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(38, 26, 48);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 140;
        controls.target.set(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.55);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
        sunLight.position.set(45, 60, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        const d = 40;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // Reusable Materials (Optimized)
        const matBldg = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
        const matConcrete = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.7 });
        const matSteel = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.6 });

        // Atlantic Ocean Water Plane
        const waterGeo = new THREE.PlaneGeometry(240, 240);
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x072540, roughness: 0.1, metalness: 0.85, transparent: true, opacity: 0.92 });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.y = -0.6;
        scene.add(water);

        // Topographic Coastal Terrain Mesh
        const terrainGeo = new THREE.PlaneGeometry(65, 65, 64, 64);
        terrainGeo.rotateX(-Math.PI / 2);
        const pos = terrainGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          let elev = Math.sin(x * 0.08) * Math.cos(z * 0.08) * 1.8 + Math.sin(x * 0.18 + z * 0.15) * 0.6;
          if (x > 18) elev -= (x - 18) * 0.28;
          if (z < -18) elev -= (-18 - z) * 0.22;
          pos.setY(i, Math.max(elev, -0.4));
        }
        terrainGeo.computeVertexNormals();
        const terrainMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.88, metalness: 0.12, flatShading: true });
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        terrain.receiveShadow = true;
        scene.add(terrain);

        // --- BUILD ALL PHASES ONCE ---
        const phase1 = new THREE.Group();
        const phase2 = new THREE.Group();
        const phase3 = new THREE.Group();
        const phase4 = new THREE.Group();
        const domeGroup = new THREE.Group();

        // PHASE 1: Survey Stakes
        const stakeGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.2);
        const stakeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        [[-15, -10], [-10, 15], [12, 10], [14, -8]].forEach(([sx, sz]) => {
          const stake = new THREE.Mesh(stakeGeo, stakeMat);
          stake.position.set(sx, 1, sz);
          phase1.add(stake);
        });

        // PHASE 2: Road & Suborbital
        const roadCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-30, 0.25, 10), new THREE.Vector3(-15, 0.35, 6),
          new THREE.Vector3(-2, 0.45, 0), new THREE.Vector3(10, 0.3, -4)
        ]);
        const road = new THREE.Mesh(new THREE.TubeGeometry(roadCurve, 32, 1.1, 6, false), new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.95 }));
        phase2.add(road);
        
        const subPad = new THREE.Mesh(new THREE.BoxGeometry(6, 0.5, 6), matConcrete);
        subPad.position.set(10, 0.3, -4);
        phase2.add(subPad);

        const dishGeo = new THREE.SphereGeometry(1.4, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2.2);
        const dish = new THREE.Mesh(dishGeo, new THREE.MeshStandardMaterial({ color: 0xe2e8f0 }));
        dish.position.set(-2, 2.3, 8);
        dish.rotation.x = Math.PI / 3;
        phase2.add(dish);

        // PHASE 3: Security & Utility
        const gate = new THREE.Mesh(new THREE.BoxGeometry(4, 2.2, 3), matBldg);
        gate.position.set(-24, 1.4, 11);
        phase3.add(gate);
        
        const hub = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 5), matBldg);
        hub.position.set(-6, 1.8, -6);
        phase3.add(hub);

        // PHASE 4: Orbital Complex
        const orbPad = new THREE.Mesh(new THREE.CylinderGeometry(8, 9, 1.4, 32), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
        orbPad.position.set(6, 0.8, 12);
        phase4.add(orbPad);

        const rocket = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 10, 16), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
        rocket.position.set(6, 6.8, 12);
        phase4.add(rocket);

        const hif = new THREE.Mesh(new THREE.BoxGeometry(16, 5, 8), matBldg);
        hif.position.set(-12, 2.8, -12);
        phase4.add(hif);

        // DOMES
        const blastDome = new THREE.Mesh(new THREE.SphereGeometry(7, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xef4444, wireframe: true, transparent: true, opacity: 0.35 }));
        blastDome.position.set(6, 0.8, 12);
        domeGroup.add(blastDome);

        const overDome = new THREE.Mesh(new THREE.SphereGeometry(15, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xf97316, wireframe: true, transparent: true, opacity: 0.18 }));
        overDome.position.set(6, 0.8, 12);
        domeGroup.add(overDome);

        scene.add(phase1, phase2, phase3, phase4, domeGroup);
        
        // Save references to toggle visibility later
        phasesRef.current = { phase1, phase2, phase3, phase4, domeGroup };

        // Animation Loop
        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        // Responsive Resize
        const handleResize = () => {
          if (!container) return;
          camera.aspect = container.clientWidth / (container.clientHeight || 550);
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight || 550);
        };
        window.addEventListener('resize', handleResize);

        // Cleanup on unmount
        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          if (container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
          renderer.dispose();
        };
      }, []); // Empty dependency array ensures this heavy setup runs ONLY once

      // 2. Instantly Toggle Visibility when Slider Moves (GPU Optimized)
      useEffect(() => {
        const phases = phasesRef.current;
        if (!phases.phase1) return; // Wait until loaded

        phases.phase2.visible = year >= 2024;
        phases.phase3.visible = year >= 2026;
        phases.phase4.visible = year >= 2028;
        phases.domeGroup.visible = showDomes && year >= 2026;
      }, [year, showDomes]);

      return <div ref={mountRef} className="w-full h-[520px] rounded-xl overflow-hidden relative cursor-grab active:cursor-grabbing" />;
    }

    // --- Main Application ---
    function SpaceportApp() {
      const [activeTab, setActiveTab] = useState('digital-twin');
      const [selectedRocketId, setSelectedRocketId] = useState('spectrum-1');
      const [distanceKm, setDistanceKm] = useState(4.2);
      const [gpsActive, setGpsActive] = useState(false);
      const [gpsCoords, setGpsCoords] = useState(null);

      // 3D Timeline state
      const [timelineYear, setTimelineYear] = useState(2026);
      const [isPlaying, setIsPlaying] = useState(false);
      const [showSafetyDomes, setShowSafetyDomes] = useState(true);

      const activeRocket = ROCKET_MANIFEST.find(r => r.id === selectedRocketId) || ROCKET_MANIFEST[0];
      const radii = calculateRadii(activeRocket.propellantTons);
      const status = getSafetyStatus(distanceKm, radii);

      const canvasRef = useRef(null);

      // Timeline Auto-Play Timer
      useEffect(() => {
        let interval = null;
        if (isPlaying) {
          interval = setInterval(() => {
            setTimelineYear((prev) => (prev >= 2028 ? 2022 : prev + 1));
          }, 1800);
        }
        return () => clearInterval(interval);
      }, [isPlaying]);

      const requestGPS = () => {
        if (!navigator.geolocation) {
          alert("Geolocation is not supported by your browser.");
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            setGpsCoords({ lat, lng });
            const dist = calculateDistanceKm(lat, lng, CANSO_PAD.lat, CANSO_PAD.lng);
            setDistanceKm(Number(dist.toFixed(2)));
            setGpsActive(true);
          },
          (err) => {
            alert("Could not retrieve GPS: " + err.message);
          }
        );
      };

      // 2D Radar Canvas Loop (Proximity Calculator Tab)
      useEffect(() => {
        if (activeTab !== 'safety') return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        const center = { x: w / 2, y: h / 2 };
        const maxRangeKm = Math.max(radii.notmarRadius * 1.35, distanceKm * 1.25);
        const scale = (w / 2 - 20) / maxRangeKm;

        ctx.clearRect(0, 0, w, h);

        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 4; i++) {
          ctx.beginPath();
          ctx.arc(center.x, center.y, (w / 2 - 20) * (i / 4), 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.fillStyle = 'rgba(59, 130, 246, 0.08)';
        ctx.strokeStyle = 'rgba(59, 130, 246, 0.5)';
        ctx.beginPath();
        ctx.arc(center.x, center.y, radii.notmarRadius * scale, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = 'rgba(234, 179, 8, 0.12)';
        ctx.strokeStyle = 'rgba(234, 179, 8, 0.6)';
        ctx.beginPath();
        ctx.arc(center.x, center.y, radii.acousticRadius * scale, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = 'rgba(249, 115, 22, 0.18)';
        ctx.strokeStyle = 'rgba(249, 115, 22, 0.7)';
        ctx.beginPath();
        ctx.arc(center.x, center.y, radii.overpressureRadius * scale, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
        ctx.strokeStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(center.x, center.y, radii.blastRadius * scale, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(center.x, center.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '10px monospace';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText("PAD (LC-1)", center.x + 8, center.y + 3);

        const obsX = center.x;
        const obsY = center.y - (distanceKm * scale);
        ctx.fillStyle = '#a855f7';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(obsX, obsY, 6, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.font = 'bold 11px monospace';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(`OBSERVER (${distanceKm} km)`, obsX + 10, obsY + 4);
      }, [distanceKm, radii, activeTab]);

      return (
        <div className="min-h-screen flex flex-col max-w-6xl mx-auto px-4 py-6">
          {/* Header & Tab Navigation */}
          <header className="border-b border-slate-800 pb-5 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
                <span className="text-xs uppercase font-mono tracking-widest text-cyan-400 font-semibold">Maritime Launch Services</span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-white mt-1">SPACEPORT NOVA TRACKER</h1>
              <p className="text-xs sm:text-sm text-slate-400">Range Safety Proximity Calculator & 3D Topographic Digital Twin • Canso, Nova Scotia</p>
            </div>

            <div className="flex flex-wrap bg-slate-900 border border-slate-800 rounded-lg p-1 text-xs sm:text-sm font-semibold w-full md:w-auto">
              <button 
                onClick={() => setActiveTab('digital-twin')}
                className={`flex-1 md:flex-none px-3.5 py-2 rounded-md transition ${activeTab === 'digital-twin' ? 'bg-cyan-500 text-slate-950 font-bold' : 'text-slate-300 hover:text-white'}`}>
                3D Digital Twin
              </button>
              <button 
                onClick={() => setActiveTab('safety')}
                className={`flex-1 md:flex-none px-3.5 py-2 rounded-md transition ${activeTab === 'safety' ? 'bg-cyan-500 text-slate-950 font-bold' : 'text-slate-300 hover:text-white'}`}>
                Proximity Calculator
              </button>
              <button 
                onClick={() => setActiveTab('manifest')}
                className={`flex-1 md:flex-none px-3.5 py-2 rounded-md transition ${activeTab === 'manifest' ? 'bg-cyan-500 text-slate-950 font-bold' : 'text-slate-300 hover:text-white'}`}>
                Rocket Manifest
              </button>
              <button 
                onClick={() => setActiveTab('development')}
                className={`flex-1 md:flex-none px-3.5 py-2 rounded-md transition ${activeTab === 'development' ? 'bg-cyan-500 text-slate-950 font-bold' : 'text-slate-300 hover:text-white'}`}>
                Civil Milestones
              </button>
            </div>
          </header>

          {/* TAB 1: 3D DIGITAL TWIN & CONSTRUCTION TIMELINE SLIDER */}
          {activeTab === 'digital-twin' && (
            <div className="space-y-4">
              <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-4 shadow-xl">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-3 border-b border-slate-800">
                  <div>
                    <h2 className="text-sm font-mono uppercase text-cyan-400 font-bold tracking-wider">Canso Peninsula 3D Topographic Model</h2>
                    <p className="text-xs text-slate-400">Left-click + drag to orbit 360° • Right-click to pan • Scroll to zoom</p>
                  </div>
                  <div className="flex items-center gap-3">
                    <label className="flex items-center gap-2 text-xs font-mono text-slate-300 cursor-pointer select-none">
                      <input 
                        type="checkbox" 
                        checked={showSafetyDomes} 
                        onChange={(e) => setShowSafetyDomes(e.target.checked)}
                        className="rounded accent-cyan-400"
                      />
                      Show 3D Blast Domes
                    </label>
                    <button 
                      onClick={() => setIsPlaying(!isPlaying)}
                      className={`px-3 py-1 text-xs font-bold font-mono rounded border transition ${isPlaying ? 'bg-amber-500/20 text-amber-300 border-amber-500' : 'bg-slate-800 text-cyan-300 border-slate-700 hover:bg-slate-700'}`}
                    >
                      {isPlaying ? '⏸ Pause Auto-Play' : '▶ Auto-Play Timeline'}
                    </button>
                  </div>
                </div>

                {/* 3D WebGL Canvas Viewport */}
                <div className="relative mt-4 border border-slate-800 rounded-xl overflow-hidden bg-slate-950">
                  <ThreeSpaceportViewer year={timelineYear} showDomes={showSafetyDomes} />
                  
                  {/* Phase Badge Overlay */}
                  <div className="absolute top-4 left-4 bg-slate-900/90 border border-slate-800 backdrop-blur px-3 py-2 rounded-lg text-xs font-mono pointer-events-none shadow-lg">
                    <div className="text-slate-400 uppercase text-[10px]">Active Era</div>
                    <div className="text-cyan-400 font-black text-sm">
                      {timelineYear <= 2022 && 'Phase 1: Site Clearance & Survey'}
                      {timelineYear > 2022 && timelineYear <= 2024 && 'Phase 2: Suborbital & Leaf Space'}
                      {timelineYear > 2024 && timelineYear <= 2026 && 'Phase 3: Security & Utility Hub'}
                      {timelineYear > 2026 && 'Phase 4: Full Orbital Dual-Pad Complex'}
                    </div>
                  </div>
                </div>

                {/* Timeline Scrubber Controls */}
                <div className="mt-5 p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-3">
                  <div className="flex justify-between items-center text-xs font-mono">
                    <span className="text-slate-400">SCRUB CIVIL BUILD TIMELINE:</span>
                    <span className="text-lg font-bold text-cyan-400 bg-cyan-950/80 border border-cyan-800/80 px-3 py-0.5 rounded">
                      YEAR {timelineYear}
                    </span>
                  </div>

                  <input 
                    type="range" 
                    min="2022" 
                    max="2028" 
                    step="1" 
                    value={timelineYear}
                    onChange={(e) => {
                      setTimelineYear(parseInt(e.target.value));
                      setIsPlaying(false);
                    }}
                    className="w-full accent-cyan-400 h-2.5 bg-slate-800 rounded-lg cursor-pointer"
                  />

                  <div className="grid grid-cols-4 text-center font-mono text-[11px] pt-1 text-slate-400">
                    <div className={timelineYear === 2022 ? 'text-cyan-300 font-bold' : ''}>2022 (Permits)</div>
                    <div className={timelineYear === 2024 ? 'text-cyan-300 font-bold' : ''}>2024 (Suborbital)</div>
                    <div className={timelineYear === 2026 ? 'text-cyan-300 font-bold' : ''}>2026 (Utilities)</div>
                    <div className={timelineYear === 2028 ? 'text-cyan-300 font-bold' : ''}>2028 (Orbital)</div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: PROXIMITY CALCULATOR */}
          {activeTab === 'safety' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-5 space-y-6">
                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-lg">
                  <h2 className="text-xs font-mono uppercase text-cyan-400 mb-3 font-bold tracking-wider">Mission Configuration</h2>
                  <select 
                    value={selectedRocketId}
                    onChange={(e) => setSelectedRocketId(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white font-medium focus:ring-2 focus:ring-cyan-400 focus:outline-none"
                  >
                    {ROCKET_MANIFEST.map(r => (
                      <option key={r.id} value={r.id}>
                        {r.name} • {r.operator} ({r.propellantTons}t Propellant)
                      </option>
                    ))}
                  </select>

                  <div className="mt-4 pt-3 border-t border-slate-800 text-xs text-slate-400 space-y-1 font-mono">
                    <div className="flex justify-between">
                      <span>Propellant Mass:</span>
                      <span className="text-white font-semibold">{activeRocket.propellantTons} Metric Tons</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Payload Mass:</span>
                      <span className="text-white font-semibold">{activeRocket.payloadKg.toLocaleString()} kg</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Target Profile:</span>
                      <span className="text-cyan-400 font-semibold">{activeRocket.orbit}</span>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-lg">
                  <div className="flex justify-between items-center mb-3">
                    <h2 className="text-xs font-mono uppercase text-cyan-400 font-bold tracking-wider">Observer Distance</h2>
                    <button 
                      onClick={requestGPS}
                      className="text-xs bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 px-2.5 py-1 rounded transition flex items-center gap-1 font-medium"
                    >
                      📍 Live GPS
                    </button>
                  </div>

                  <div className="space-y-4">
                    <div>
                      <div className="flex justify-between items-baseline mb-1">
                        <span className="text-xs text-slate-400">Distance to Canso Pad:</span>
                        <span className="text-lg font-mono font-bold text-cyan-400">{distanceKm} km</span>
                      </div>
                      <input 
                        type="range" 
                        min="0.2" 
                        max="25" 
                        step="0.1" 
                        value={distanceKm}
                        onChange={(e) => {
                          setDistanceKm(parseFloat(e.target.value));
                          setGpsActive(false);
                        }}
                        className="w-full accent-cyan-400 h-2 bg-slate-800 rounded-lg cursor-pointer"
                      />
                    </div>

                    {gpsActive && gpsCoords && (
                      <div className="bg-slate-950 p-2.5 rounded border border-slate-800 text-xs font-mono text-slate-300">
                        GPS Active: {gpsCoords.lat.toFixed(4)}°N, {gpsCoords.lng.toFixed(4)}°W
                      </div>
                    )}
                  </div>
                </div>

                <div className={`p-4 rounded-xl border ${status.color} shadow-lg space-y-2`}>
                  <div className="flex items-center gap-2">
                    <span className={`text-[10px] font-black uppercase px-2 py-0.5 rounded text-white ${status.badge}`}>
                      {status.level}
                    </span>
                    <span className="text-xs font-mono font-bold">RANGE: {distanceKm} KM</span>
                  </div>
                  <p className="text-sm font-semibold leading-snug">{status.text}</p>
                </div>
              </div>

              <div className="lg:col-span-7 space-y-6">
                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-lg flex flex-col items-center">
                  <div className="w-full flex justify-between items-center mb-3">
                    <h2 className="text-xs font-mono uppercase text-cyan-400 font-bold tracking-wider">Perimeter Radar Scope</h2>
                    <span className="text-xs font-mono text-slate-400">Yield: {activeRocket.propellantTons}t Propellant</span>
                  </div>
                  <canvas 
                    ref={canvasRef} 
                    width={380} 
                    height={380} 
                    className="w-full max-w-[380px] bg-slate-950 rounded-xl border border-slate-800/80 shadow-inner"
                  />
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 w-full mt-4 text-[11px] font-mono text-center">
                    <div className="p-2 rounded bg-red-950/40 border border-red-900/60 text-red-300">
                      Blast: <strong>{radii.blastRadius} km</strong>
                    </div>
                    <div className="p-2 rounded bg-orange-950/40 border border-orange-900/60 text-orange-300">
                      Overpress: <strong>{radii.overpressureRadius} km</strong>
                    </div>
                    <div className="p-2 rounded bg-yellow-950/40 border border-yellow-900/60 text-yellow-300">
                      Acoustic: <strong>{radii.acousticRadius} km</strong>
                    </div>
                    <div className="p-2 rounded bg-blue-950/40 border border-blue-900/60 text-blue-300">
                      NOTMAR: <strong>{radii.notmarRadius} km</strong>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 3: ROCKET MANIFEST */}
          {activeTab === 'manifest' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {ROCKET_MANIFEST.map((r) => (
                <div key={r.id} className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 flex flex-col justify-between hover:border-slate-700 transition">
                  <div className="space-y-3">
                    <div className="flex justify-between items-start">
                      <span className="text-xs font-mono text-cyan-400 bg-cyan-950/60 border border-cyan-800/50 px-2 py-0.5 rounded">
                        NET {r.targetDate}
                      </span>
                      <span className="text-xs text-emerald-400 font-bold bg-emerald-950/40 px-2 py-0.5 rounded">
                        {r.status}
                      </span>
                    </div>
                    <div>
                      <h3 className="text-lg font-bold text-white leading-tight">{r.name}</h3>
                      <p className="text-xs text-slate-400 font-mono mt-0.5">{r.operator}</p>
                    </div>
                    <div className="space-y-1.5 text-xs text-slate-300 pt-3 border-t border-slate-800 font-mono">
                      <div className="flex justify-between">
                        <span className="text-slate-400">Class:</span>
                        <span className="text-white font-bold">{r.missionType.toUpperCase()}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Propellant Load:</span>
                        <span className="text-white font-bold">{r.propellantTons} Metric Tons</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Payload Capacity:</span>
                        <span className="text-white font-bold">{r.payloadKg.toLocaleString()} kg</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Trajectory Profile:</span>
                        <span className="text-white font-bold">{r.orbit}</span>
                      </div>
                    </div>
                  </div>
                  <button 
                    onClick={() => {
                      setSelectedRocketId(r.id);
                      setActiveTab('safety');
                    }}
                    className="mt-6 w-full py-2 bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 border border-slate-700 text-cyan-300 text-xs font-bold rounded-lg transition"
                  >
                    Select & Calculate Safety →
                  </button>
                </div>
              ))}
            </div>
          )}

          {/* TAB 4: CIVIL MILESTONES */}
          {activeTab === 'development' && (
            <div className="space-y-4">
              <div className="bg-slate-900/60 border border-slate-800 p-4 rounded-xl text-xs text-slate-300 flex flex-col sm:flex-row gap-2 items-start sm:items-center justify-between">
                <span>Site Location: <strong>Guysborough County / Canso, Nova Scotia</strong></span>
                <span className="text-cyan-400 font-mono">Orbital Inclinations: 45.1° (LEO) to 98.1° (SSO)</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {SPACEPORT_FACILITIES.map((f, i) => (
                  <div key={i} className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 space-y-3">
                    <div className="flex justify-between items-center text-xs font-mono">
                      <span className="px-2 py-0.5 rounded bg-slate-800 text-slate-300">{f.tag}</span>
                      <span className="text-cyan-400 font-bold">{f.progress}%</span>
                    </div>
                    <h3 className="text-sm font-bold text-white">{f.name}</h3>
                    <p className="text-xs text-slate-400">{f.desc}</p>
                    <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                      <div 
                        className={`h-full transition-all duration-700 ${f.progress === 100 ? 'bg-emerald-500' : 'bg-cyan-500'}`}
                        style={{ width: `${f.progress}%` }}
                      />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-auto pt-8 border-t border-slate-900 text-center text-xs font-mono text-slate-500">
            Spaceport Nova Scotia Safety Operations • Maritime Launch Services
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SpaceportApp />);
  </script>
</body>
</html>
