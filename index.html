<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spaceport Nova Tracker — Maritime Launch Services</title>
  <meta name="description" content="Range Safety Proximity Calculator and Launch Operations Monitor for Spaceport Nova Scotia in Canso, NS." />

  <!-- Preconnect to CDNs for speed on Vercel Edge -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel for zero-build execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>

  <!-- Three.js & OrbitControls (STABLE r128 VERSION) -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANSO_PAD = { lat: 45.3056, lng: -60.9814, name: "Spaceport Nova Scotia (LC-1)" };

    const ROCKET_MANIFEST = [
      { id: "barracuda-4", name: "Barracuda (Flight 4)", operator: "T-Minus Engineering", propellantTons: 0.6, payloadKg: 15, orbit: "Suborbital Hypersonic (~80-100 km)", targetDate: "October 2026", status: "Pad Readiness Review", missionType: "Suborbital" },
      { id: "aurora-8", name: "Aurora-8 (Orbital Demo)", operator: "Reaction Dynamics (RDX)", propellantTons: 14, payloadKg: 200, orbit: "SSO / Polar LEO (500 km)", targetDate: "Q3 2028", status: "Launch Agreement", missionType: "Orbital" },
      { id: "spectrum-1", name: "Spectrum (Dedicated Complex)", operator: "Isar Aerospace", propellantTons: 58, payloadKg: 1000, orbit: "Polar / SSO Orbit (Up to 98.1°)", targetDate: "2028", status: "Statement of Work Executed", missionType: "Orbital" },
      { id: "c4m-baseline", name: "Cyclone-4M (MLS Standard)", operator: "Maritime Launch Services", propellantTons: 260, payloadKg: 5000, orbit: "LEO / SSO (87.9° - 98.1°)", targetDate: "Baseline Design", status: "Max Hazard Envelope", missionType: "Medium Lift" }
    ];

    const SPACEPORT_FACILITIES = [
      { name: "Environmental Assessment & Crown Land Lease (335 Acres)", progress: 100, tag: "Regulatory", desc: "Provincial EA clearance & long-term site lease approved." },
      { name: "Suborbital Launch Pad & Campaign Setup", progress: 100, tag: "Suborbital Ops", desc: "Operational for commercial suborbital hypersonic flight tests." },
      { name: "Leaf Space Ground Tracking Station", progress: 100, tag: "Ground Segment", desc: "Commercial satellite antenna active and communicating on site." },
      { name: "Phase 1 Civil Works (Site Grading & Pad Access Roads)", progress: 90, tag: "Civil Works", desc: "Access corridors between Sable Wind Farm perimeter and pads." },
      { name: "Site Entrance & Primary Security Gatehouse", progress: 60, tag: "Site Control", desc: "Procurement & municipal coordination replacing temporary structures." },
      { name: "Central Utility Hub (Power, Fiber Comms, Water)", progress: 45, tag: "Utilities", desc: "Infrastructure package tendered via Lindsay Construction." },
      { name: "Dedicated Orbital Complex (Isar & RDX Pads)", progress: 25, tag: "Launch Pads", desc: "Multi-pad civil layout accommodating domestic and European vehicles." },
      { name: "Permanent Vehicle Assembly & Integration Facility (HIF)", progress: 20, tag: "Integration", desc: "Hangar engineering advancing toward construction tender." }
    ];

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function calculateRadii(propellantTons) {
      const cbrt = Math.cbrt(Math.max(propellantTons, 0.2));
      return { blastRadius: Number((0.5 * cbrt).toFixed(2)), overpressureRadius: Number((1.1 * cbrt).toFixed(2)), acousticRadius: Number((1.9 * cbrt).toFixed(2)), notmarRadius: Number((3.6 * cbrt).toFixed(2)) };
    }

    function getSafetyStatus(distanceKm, radii) {
      if (distanceKm < radii.blastRadius) return { level: "LETHAL HAZARD", color: "bg-red-950/80 border-red-500 text-red-200", badge: "bg-red-600", text: "INSIDE PRIMARY BLAST ZONE: Catastrophic deflagration & fragmentation perimeter." };
      if (distanceKm < radii.overpressureRadius) return { level: "HIGH HAZARD", color: "bg-orange-950/80 border-orange-500 text-orange-200", badge: "bg-orange-600", text: "INSIDE OVERPRESSURE RANGE: Risk of blast wave injury and window failure." };
      if (distanceKm < radii.acousticRadius) return { level: "RESTRICTED", color: "bg-yellow-950/80 border-yellow-500 text-yellow-200", badge: "bg-yellow-600", text: "ACOUSTIC WARNING: Sound pressure exceeds 140 dB. Mandatory ear protection." };
      if (distanceKm < radii.notmarRadius) return { level: "CAUTION", color: "bg-blue-950/80 border-blue-500 text-blue-200", badge: "bg-blue-600", text: "INSIDE NOTICE TO MARINERS (NOTMAR) BUFFER: Closed to marine and fishing vessels." };
      return { level: "SAFE OBSERVATION", color: "bg-emerald-950/80 border-emerald-500 text-emerald-200", badge: "bg-emerald-600", text: "You are outside all critical hazard boundaries. Safe public observation sector." };
    }

    // --- HIGH-RES 3D VIEWER ---
    function EnhancedThreeViewer({ year }) {
      const mountRef = useRef(null);
      const phasesRef = useRef({});

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const w = container.clientWidth;
        const h = container.clientHeight || 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020617); 

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
        camera.position.set(45, 30, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        // THIS IS THE RESOLUTION FIX: Scales the canvas to high-DPI Retina/Mobile screens
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.minDistance = 15;
        controls.maxDistance = 150;

        // Enhanced Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.95)); 
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(20, 50, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096; // Crisp high-res shadows
        dirLight.shadow.mapSize.height = 4096;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // High-Quality Materials
        const matConcrete = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9 });
        const matBuilding = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
        const matSteel = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.3 });
        const matRocketBody = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
        const matRocketDark = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.2 });

        // High-Poly Terrain
        const terrainGeo = new THREE.PlaneGeometry(100, 100, 128, 128); // Increased resolution
        terrainGeo.rotateX(-Math.PI / 2);
        const pos = terrainGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          let elev = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 1.5 + Math.sin(x * 0.05 + z * 0.05) * 2;
          if (x > 10) elev -= (x - 10) * 0.4;
          if (z < -10) elev -= (-10 - z) * 0.3;
          pos.setY(i, elev);
        }
        terrainGeo.computeVertexNormals();
        const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.9 }));
        terrain.receiveShadow = true;
        scene.add(terrain);

        const water = new THREE.Mesh(
          new THREE.PlaneGeometry(120, 120),
          new THREE.MeshStandardMaterial({ color: 0x072540, transparent: true, opacity: 0.85, roughness: 0.1, metalness: 0.8 })
        );
        water.rotation.x = -Math.PI / 2;
        water.position.y = -1.5;
        scene.add(water);

        const p2024 = new THREE.Group();
        const p2026 = new THREE.Group();
        const p2028 = new THREE.Group();
        const p2032 = new THREE.Group();
        const p2035 = new THREE.Group();

        // Architectural Helpers
        const getElevation = (x, z) => {
          let elev = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 1.5 + Math.sin(x * 0.05 + z * 0.05) * 2;
          if (x > 10) elev -= (x - 10) * 0.4;
          if (z < -10) elev -= (-10 - z) * 0.3;
          return Math.max(elev, -1);
        };

        const buildHangar = (width, depth) => {
          const group = new THREE.Group();
          const base = new THREE.Mesh(new THREE.BoxGeometry(width, 4, depth), matBuilding);
          base.position.y = 2;
          base.castShadow = true; base.receiveShadow = true;
          // Curved steel roof
          const roof = new THREE.Mesh(new THREE.CylinderGeometry(depth/2, depth/2, width, 32, 1, false, 0, Math.PI), matSteel);
          roof.rotation.z = Math.PI / 2;
          roof.position.y = 4;
          roof.castShadow = true;
          group.add(base, roof);
          return group;
        };

        const buildPad = (x, z, scale, hasTrench = true) => {
          const padGroup = new THREE.Group();
          // Detailed multi-tier base
          const baseLower = new THREE.Mesh(new THREE.BoxGeometry(10 * scale, 0.5, 10 * scale), matConcrete);
          baseLower.position.y = 0.25;
          baseLower.receiveShadow = true;
          const baseUpper = new THREE.Mesh(new THREE.BoxGeometry(8 * scale, 0.5, 8 * scale), matConcrete);
          baseUpper.position.y = 0.75;
          baseUpper.castShadow = true; baseUpper.receiveShadow = true;
          padGroup.add(baseLower, baseUpper);

          if (hasTrench) {
            const trench = new THREE.Mesh(new THREE.BoxGeometry(3 * scale, 1.2, 12 * scale), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
            trench.position.set(0, 0.6, 2 * scale);
            padGroup.add(trench);
          }

          const mastGeo = new THREE.CylinderGeometry(0.1, 0.2, 12 * scale, 16); // Smoother masts
          const offset = 3.5 * scale;
          [[-offset, -offset], [offset, -offset], [-offset, offset], [offset, offset]].forEach(([mx, mz]) => {
            const mast = new THREE.Mesh(mastGeo, matSteel);
            mast.position.set(mx, 6 * scale, mz);
            mast.castShadow = true;
            padGroup.add(mast);
          });

          padGroup.position.set(x, getElevation(x, z), z);
          return padGroup;
        };

        const buildRocket = (scale, type = "medium") => {
          const rGroup = new THREE.Group();
          // High-poly cylinders for crisp curves
          const core = new THREE.Mesh(new THREE.CylinderGeometry(0.8 * scale, 0.8 * scale, 10 * scale, 32), matRocketBody);
          core.position.y = 6 * scale;
          core.castShadow = true;
          rGroup.add(core);

          const nose = new THREE.Mesh(new THREE.ConeGeometry(0.8 * scale, 2.5 * scale, 32), type === "heavy" ? matRocketDark : matRocketBody);
          nose.position.y = 12.25 * scale;
          nose.castShadow = true;
          rGroup.add(nose);

          // Detailed engine bell
          const engine = new THREE.Mesh(new THREE.CylinderGeometry(0.4 * scale, 0.7 * scale, 1 * scale, 32), matSteel);
          engine.position.y = 0.5 * scale;
          engine.castShadow = true;
          rGroup.add(engine);

          return rGroup;
        };

        // --- 2024: Suborbital & Leaf Space ---
        const subPad = new THREE.Mesh(new THREE.BoxGeometry(5, 0.5, 5), matConcrete);
        subPad.position.set(-15, getElevation(-15, -10) + 0.25, -10);
        subPad.receiveShadow = true;
        p2024.add(subPad);

        const dishBase = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 2, 32), matConcrete);
        dishBase.position.set(-15, getElevation(-15, -4) + 1, -4);
        dishBase.castShadow = true;
        const dish = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32, 0, Math.PI*2, 0, Math.PI/2.5), matRocketBody);
        dish.rotation.x = Math.PI / 4;
        dish.position.set(-15, getElevation(-15, -4) + 2.5, -4);
        dish.castShadow = true;
        p2024.add(dishBase, dish);

        // --- 2026: Security & Utilities ---
        const gate = buildHangar(5, 4); // Reused curved building logic
        gate.position.set(-25, getElevation(-25, 15), 15);
        p2026.add(gate);

        const hub = buildHangar(8, 6);
        hub.position.set(-5, getElevation(-5, 12), 12);
        p2026.add(hub);

        // --- 2028: Pad 1 (Isar/RDX) & HIF ---
        const pad1 = buildPad(5, -2, 1);
        const rocket1 = buildRocket(1);
        rocket1.position.set(5, getElevation(5, -2) + 1, -2);
        p2028.add(pad1, rocket1);

        const hif = buildHangar(12, 8);
        hif.position.set(-10, getElevation(-10, 5), 5);
        p2028.add(hif);

        // --- 2032: Pad 2 (Orbital Expansion) ---
        const pad2 = buildPad(15, 8, 1.1);
        const rocket2 = buildRocket(1.1);
        rocket2.position.set(15, getElevation(15, 8) + 1, 8);
        p2032.add(pad2, rocket2);

        const hifExt = buildHangar(10, 8);
        hifExt.position.set(-21, getElevation(-21, 5), 5);
        p2032.add(hifExt);

        // --- 2035: Pad 3 (Heavy) & Pad 4 (Commercial) ---
        const pad3 = buildPad(-5, -18, 1.5);
        const rocket3 = buildRocket(1.5, "heavy");
        rocket3.position.set(-5, getElevation(-5, -18) + 1.5, -18);
        p2035.add(pad3, rocket3);

        const pad4 = buildPad(12, -15, 1);
        p2035.add(pad4);

        scene.add(p2024, p2026, p2028, p2032, p2035);
        phasesRef.current = { p2024, p2026, p2028, p2032, p2035 };

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!container) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          if (container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
          renderer.dispose();
        };
      }, []);

      useEffect(() => {
        const { p2024, p2026, p2028, p2032, p2035 } = phasesRef.current;
        if (p2024) {
          p2024.visible = year >= 2024;
          p2026.visible = year >= 2026;
          p2028.visible = year >= 2028;
          p2032.visible = year >= 2032;
          p2035.visible = year >= 2035;
        }
      }, [year]);

      return <div ref={mountRef} className="w-full h-[500px] rounded-xl overflow-hidden border border-slate-800 cursor-move bg-slate-950 shadow-inner" />;
    }

    function SpaceportApp() {
      const [activeTab, setActiveTab] = useState('3d-build');
      const [selectedRocketId, setSelectedRocketId] = useState('spectrum-1');
      const [distanceKm, setDistanceKm] = useState(4.2);
      const [gpsActive, setGpsActive] = useState(false);
      const [gpsCoords, setGpsCoords] = useState(null);
      const [buildYear, setBuildYear] = useState(2035);

      const activeRocket = ROCKET_MANIFEST.find(r => r.id === selectedRocketId) || ROCKET_MANIFEST[0];
      const radii = calculateRadii(activeRocket.propellantTons);
      const status = getSafetyStatus(distanceKm, radii);
      const canvasRef = useRef(null);

      const requestGPS = () => {
        if (!navigator.geolocation) {
          alert("Geolocation is not supported by your browser.");
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            setGpsCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude });
            const dist = calculateDistanceKm(pos.coords.latitude, pos.coords.longitude, CANSO_PAD.lat, CANSO_PAD.lng);
            setDistanceKm(Number(dist.toFixed(2)));
            setGpsActive(true);
          },
          (err) => {
            alert("Could not retrieve GPS: " + err.message);
          }
        );
      };

      useEffect(() => {
        if (activeTab !== 'safety') return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        const center = { x: w / 2, y: h / 2 };
        const maxRangeKm = Math.max(radii.notmarRadius * 1.35, distanceKm * 1.25);
        const scale = (w / 2 - 20) / maxRangeKm;

        ctx.clearRect(0, 0, w, h);

        ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
        for (let i = 1; i <= 4; i++) {
          ctx.beginPath(); ctx.arc(center.x, center.y, (w / 2 - 20) * (i / 4), 0, Math.PI * 2); ctx.stroke();
        }

        ctx.fillStyle = 'rgba(59, 130, 246, 0.08)'; ctx.strokeStyle = 'rgba(59, 130, 246, 0.5)';
        ctx.beginPath(); ctx.arc(center.x, center.y, radii.notmarRadius * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = 'rgba(234, 179, 8, 0.12)'; ctx.strokeStyle = 'rgba(234, 179, 8, 0.6)';
        ctx.beginPath(); ctx.arc(center.x, center.y, radii.acousticRadius * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = 'rgba(249, 115, 22, 0.18)'; ctx.strokeStyle = 'rgba(249, 115, 22, 0.7)';
        ctx.beginPath(); ctx.arc(center.x, center.y, radii.overpressureRadius * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = 'rgba(239, 68, 68, 0.35)'; ctx.strokeStyle = '#ef4444';
        ctx.beginPath(); ctx.arc(center.x, center.y, radii.blastRadius * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(center.x, center.y, 5, 0, Math.PI * 2); ctx.fill();
        ctx.font = '10px monospace'; ctx.fillStyle = '#94a3b8'; ctx.fillText("PAD (LC-1)", center.x + 8, center.y + 3);

        const obsX = center.x, obsY = center.y - (distanceKm * scale);
        ctx.fillStyle = '#a855f7'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(obsX, obsY, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.font = 'bold 11px monospace'; ctx.fillStyle = '#f8fafc'; ctx.fillText(`OBSERVER (${distanceKm} km)`, obsX + 10, obsY + 4);
      }, [distanceKm, radii, activeTab]);

      return (
        <div className="min-h-screen flex flex-col max-w-6xl mx-auto px-4 py-6">
          <header className="border-b border-slate-800 pb-5 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
                <span className="text-xs uppercase font-mono tracking-widest text-cyan-400 font-semibold">Maritime Launch Services</span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-white mt-1">SPACEPORT NOVA TRACKER</h1>
              <p className="text-xs sm:text-sm text-slate-400">Canso Launch Complex Range Safety Matrix & Site Readiness • Guysborough County, NS</p>
            </div>

            <div className="flex flex-wrap bg-slate-900 border border-slate-800 rounded-lg p-1 text-sm font-semibold w-full md:w-auto">
              <button onClick={() => setActiveTab('3d-build')} className={`flex-1 md:flex-none px-4 py-2 rounded-md transition ${activeTab === '3d-build' ? 'bg-cyan-500 text-slate-950' : 'text-slate-300 hover:text-white'}`}>3D Master Plan</button>
              <button onClick={() => setActiveTab('safety')} className={`flex-1 md:flex-none px-4 py-2 rounded-md transition ${activeTab === 'safety' ? 'bg-cyan-500 text-slate-950' : 'text-slate-300 hover:text-white'}`}>Proximity Calculator</button>
              <button onClick={() => setActiveTab('manifest')} className={`flex-1 md:flex-none px-4 py-2 rounded-md transition ${activeTab === 'manifest' ? 'bg-cyan-500 text-slate-950' : 'text-slate-300 hover:text-white'}`}>Rocket Manifest</button>
              <button onClick={() => setActiveTab('development')} className={`flex-1 md:flex-none px-4 py-2 rounded-md transition ${activeTab === 'development' ? 'bg-cyan-500 text-slate-950' : 'text-slate-300 hover:text-white'}`}>Spaceport Status</button>
            </div>
          </header>

          {activeTab === '3d-build' && (
            <div className="space-y-6">
              <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-lg">
                <h2 className="text-xs font-mono uppercase text-cyan-400 mb-2 font-bold tracking-wider">Canso Site Master Plan (2022 - 2035)</h2>
                <p className="text-sm text-slate-400 mb-4">Topographic expansion mapping 4 commercial launch pads. Click and drag to orbit. Scroll to zoom.</p>
                
                <EnhancedThreeViewer year={buildYear} />

                <div className="mt-6 p-4 bg-slate-950 rounded-lg border border-slate-800">
                  <div className="flex justify-between items-center mb-3">
                    <span className="text-xs font-mono text-slate-400">Scrub Infrastructure Timeline</span>
                    <span className="text-sm font-mono text-cyan-400 font-bold bg-slate-800 border border-slate-700 px-3 py-1 rounded">Year: {buildYear}</span>
                  </div>
                  <input 
                    type="range" 
                    min="2022" 
                    max="2035" 
                    step="1" 
                    value={buildYear}
                    onChange={(e) => setBuildYear(parseInt(e.target.value))}
                    className="w-full accent-cyan-400 h-2 bg-slate-800 rounded-lg cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] sm:text-xs font-mono text-slate-500 mt-3 px-1">
                    <span className={buildYear >= 2024 && buildYear < 2028 ? "text-cyan-400" : ""}>2024 (Suborbital)</span>
                    <span className={buildYear >= 2028 && buildYear < 2032 ? "text-cyan-400" : ""}>2028 (Pad 1)</span>
                    <span className={buildYear >= 2032 && buildYear < 2035 ? "text-cyan-400" : ""}>2032 (Pad 2)</span>
                    <span className={buildYear === 2035 ? "text-cyan-400" : ""}>2035 (4-Pad Complex)</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'safety' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-5 space-y-6">
                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-lg">
                  <h2 className="text-xs font-mono uppercase text-cyan-400 mb-3 font-bold tracking-wider">Mission Configuration</h2>
                  <select value={selectedRocketId} onChange={(e) => setSelectedRocketId(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white font-medium focus:ring-2 focus:ring-cyan-400 focus:outline-none">
                    {ROCKET_MANIFEST.map(r => <option key={r.id} value={r.id}>{r.name} • {r.operator} ({r.propellantTons}t)</option>)}
                  </select>
                  <div className="mt-4 pt-3 border-t border-slate-800 text-xs text-slate-400 space-y-1 font-mono">
                    <div className="flex justify-between"><span>Propellant Mass:</span><span className="text-white font-semibold">{activeRocket.propellantTons} Metric Tons</span></div>
                    <div className="flex justify-between"><span>Payload Mass:</span><span className="text-white font-semibold">{activeRocket.payloadKg.toLocaleString()} kg</span></div>
                    <div className="flex justify-between"><span>Target Profile:</span><span className="text-cyan-400 font-semibold">{activeRocket.orbit}</span></div>
                  </div>
                </div>

                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-lg">
                  <div className="flex justify-between items-center mb-3">
                    <h2 className="text-xs font-mono uppercase text-cyan-400 font-bold tracking-wider">Observer Distance</h2>
                    <button onClick={requestGPS} className="text-xs bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 px-2.5 py-1 rounded transition flex items-center gap-1 font-medium">📍 Live GPS</button>
                  </div>
                  <div className="space-y-4">
                    <div>
                      <div className="flex justify-between items-baseline mb-1">
                        <span className="text-xs text-slate-400">Distance to Canso Pad:</span>
                        <span className="text-lg font-mono font-bold text-cyan-400">{distanceKm} km</span>
                      </div>
                      <input type="range" min="0.2" max="25" step="0.1" value={distanceKm} onChange={(e) => { setDistanceKm(parseFloat(e.target.value)); setGpsActive(false); }} className="w-full accent-cyan-400 h-2 bg-slate-800 rounded-lg cursor-pointer" />
                    </div>
                  </div>
                </div>

                <div className={`p-4 rounded-xl border ${status.color} shadow-lg space-y-2`}>
                  <div className="flex items-center gap-2">
                    <span className={`text-[10px] font-black uppercase px-2 py-0.5 rounded text-white ${status.badge}`}>{status.level}</span>
                    <span className="text-xs font-mono font-bold">RANGE: {distanceKm} KM</span>
                  </div>
                  <p className="text-sm font-semibold leading-snug">{status.text}</p>
                </div>
              </div>

              <div className="lg:col-span-7 space-y-6">
                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-lg flex flex-col items-center">
                  <div className="w-full flex justify-between items-center mb-3">
                    <h2 className="text-xs font-mono uppercase text-cyan-400 font-bold tracking-wider">Perimeter Radar Scope</h2>
                    <span className="text-xs font-mono text-slate-400">Yield: {activeRocket.propellantTons}t Propellant</span>
                  </div>
                  <canvas ref={canvasRef} width={380} height={380} className="w-full max-w-[380px] bg-slate-950 rounded-xl border border-slate-800/80 shadow-inner" />
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 w-full mt-4 text-[11px] font-mono text-center">
                    <div className="p-2 rounded bg-red-950/40 border border-red-900/60 text-red-300">Blast: <strong>{radii.blastRadius} km</strong></div>
                    <div className="p-2 rounded bg-orange-950/40 border border-orange-900/60 text-orange-300">Overpress: <strong>{radii.overpressureRadius} km</strong></div>
                    <div className="p-2 rounded bg-yellow-950/40 border border-yellow-900/60 text-yellow-300">Acoustic: <strong>{radii.acousticRadius} km</strong></div>
                    <div className="p-2 rounded bg-blue-950/40 border border-blue-900/60 text-blue-300">NOTMAR: <strong>{radii.notmarRadius} km</strong></div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'manifest' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {ROCKET_MANIFEST.map((r) => (
                <div key={r.id} className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 flex flex-col justify-between hover:border-slate-700 transition">
                  <div className="space-y-3">
                    <div className="flex justify-between items-start">
                      <span className="text-xs font-mono text-cyan-400 bg-cyan-950/60 border border-cyan-800/50 px-2 py-0.5 rounded">NET {r.targetDate}</span>
                      <span className="text-xs text-emerald-400 font-bold bg-emerald-950/40 px-2 py-0.5 rounded">{r.status}</span>
                    </div>
                    <div>
                      <h3 className="text-lg font-bold text-white leading-tight">{r.name}</h3>
                      <p className="text-xs text-slate-400 font-mono mt-0.5">{r.operator}</p>
                    </div>
                    <div className="space-y-1.5 text-xs text-slate-300 pt-3 border-t border-slate-800 font-mono">
                      <div className="flex justify-between"><span className="text-slate-400">Class:</span><span className="text-white font-bold">{r.missionType.toUpperCase()}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Propellant Load:</span><span className="text-white font-bold">{r.propellantTons} Metric Tons</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Payload Capacity:</span><span className="text-white font-bold">{r.payloadKg.toLocaleString()} kg</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Trajectory Profile:</span><span className="text-white font-bold">{r.orbit}</span></div>
                    </div>
                  </div>
                  <button onClick={() => { setSelectedRocketId(r.id); setActiveTab('safety'); }} className="mt-6 w-full py-2 bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 border border-slate-700 text-cyan-300 text-xs font-bold rounded-lg transition">
                    Select & Calculate Safety →
                  </button>
                </div>
              ))}
            </div>
          )}

          {activeTab === 'development' && (
            <div className="space-y-4">
              <div className="bg-slate-900/60 border border-slate-800 p-4 rounded-xl text-xs text-slate-300 flex flex-col sm:flex-row gap-2 items-start sm:items-center justify-between">
                <span>Site Location: <strong>Guysborough County / Canso, Nova Scotia</strong></span>
                <span className="text-cyan-400 font-mono">Orbital Inclinations: 45.1° (LEO) to 98.1° (SSO)</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {SPACEPORT_FACILITIES.map((f, i) => (
                  <div key={i} className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 space-y-3">
                    <div className="flex justify-between items-center text-xs font-mono">
                      <span className="px-2 py-0.5 rounded bg-slate-800 text-slate-300">{f.tag}</span>
                      <span className="text-cyan-400 font-bold">{f.progress}%</span>
                    </div>
                    <h3 className="text-sm font-bold text-white">{f.name}</h3>
                    <p className="text-xs text-slate-400">{f.desc}</p>
                    <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                      <div className={`h-full transition-all duration-700 ${f.progress === 100 ? 'bg-emerald-500' : 'bg-cyan-500'}`} style={{ width: `${f.progress}%` }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          <footer className="mt-auto pt-8 border-t border-slate-900 text-center text-xs font-mono text-slate-500">
            Spaceport Nova Scotia Safety Operations • Maritime Launch Services
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SpaceportApp />);
  </script>
</body>
</html>
