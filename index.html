<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spaceport Nova Tracker — Maritime Launch Services</title>
  <meta name="description" content="Range Safety Proximity Calculator and Launch Operations Monitor for Spaceport Nova Scotia in Canso, NS." />

  <!-- Preconnect to CDNs for speed on Vercel Edge -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel for zero-build execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>

  <!-- Three.js & OrbitControls (STABLE r128 VERSION) -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    body {
      background-color: #080d16;
      color: #edf4ff;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Native Dialog Backdrop Styling */
    dialog::backdrop {
      background-color: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANSO_PAD = { lat: 45.3056, lng: -60.9814, name: "Spaceport Nova Scotia (LC-1)" };

    const ROCKET_MANIFEST = [
      { id: "barracuda-4", name: "Barracuda (Flight 4)", operator: "T-Minus Engineering", propellantTons: 0.6, payloadKg: 15, orbit: "Suborbital Hypersonic (~80-100 km)", targetDate: "October 2026", status: "Pad Readiness Review", missionType: "Suborbital" },
      { id: "aurora-8", name: "Aurora-8 (Orbital Demo)", operator: "Reaction Dynamics (RDX)", propellantTons: 14, payloadKg: 200, orbit: "SSO / Polar LEO (500 km)", targetDate: "Q3 2028", status: "Launch Agreement", missionType: "Orbital" },
      { id: "spectrum-1", name: "Spectrum (Dedicated Complex)", operator: "Isar Aerospace", propellantTons: 58, payloadKg: 1000, orbit: "Polar / SSO Orbit (Up to 98.1°)", targetDate: "2028", status: "Statement of Work Executed", missionType: "Orbital" },
      { id: "c4m-baseline", name: "Cyclone-4M (MLS Standard)", operator: "Maritime Launch Services", propellantTons: 260, payloadKg: 5000, orbit: "LEO / SSO (87.9° - 98.1°)", targetDate: "Baseline Design", status: "Max Hazard Envelope", missionType: "Medium Lift" }
    ];

    const SPACEPORT_FACILITIES = [
      { name: "Environmental Assessment & Crown Land Lease (335 Acres)", progress: 100, tag: "Regulatory", desc: "Provincial EA clearance & long-term site lease approved." },
      { name: "Suborbital Launch Pad & Campaign Setup", progress: 100, tag: "Suborbital Ops", desc: "Operational for commercial suborbital hypersonic flight tests." },
      { name: "Leaf Space Ground Tracking Station", progress: 100, tag: "Ground Segment", desc: "Commercial satellite antenna active and communicating on site." },
      { name: "Phase 1 Civil Works (Site Grading & Pad Access Roads)", progress: 90, tag: "Civil Works", desc: "Access corridors between Sable Wind Farm perimeter and pads." },
      { name: "Site Entrance & Primary Security Gatehouse", progress: 60, tag: "Site Control", desc: "Procurement & municipal coordination replacing temporary structures." },
      { name: "Central Utility Hub (Power, Fiber Comms, Water)", progress: 45, tag: "Utilities", desc: "Infrastructure package tendered via Lindsay Construction." },
      { name: "Dedicated Orbital Complex (Isar & RDX Pads)", progress: 25, tag: "Launch Pads", desc: "Multi-pad civil layout accommodating domestic and European vehicles." },
      { name: "Permanent Vehicle Assembly & Integration Facility (HIF)", progress: 20, tag: "Integration", desc: "Hangar engineering advancing toward construction tender." }
    ];

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function calculateRadii(propellantTons) {
      const cbrt = Math.cbrt(Math.max(propellantTons, 0.2));
      return { blastRadius: Number((0.5 * cbrt).toFixed(2)), overpressureRadius: Number((1.1 * cbrt).toFixed(2)), acousticRadius: Number((1.9 * cbrt).toFixed(2)), notmarRadius: Number((3.6 * cbrt).toFixed(2)) };
    }

    function getSafetyStatus(distanceKm, radii) {
      if (distanceKm < radii.blastRadius) return { level: "LETHAL HAZARD", color: "bg-red-950/80 border-red-500 text-red-200", badge: "bg-red-600", text: "INSIDE PRIMARY BLAST ZONE: Catastrophic deflagration & fragmentation perimeter." };
      if (distanceKm < radii.overpressureRadius) return { level: "HIGH HAZARD", color: "bg-orange-950/80 border-orange-500 text-orange-200", badge: "bg-orange-600", text: "INSIDE OVERPRESSURE RANGE: Risk of blast wave injury and window failure." };
      if (distanceKm < radii.acousticRadius) return { level: "RESTRICTED", color: "bg-yellow-950/80 border-yellow-500 text-yellow-200", badge: "bg-yellow-600", text: "ACOUSTIC WARNING: Sound pressure exceeds 140 dB. Mandatory ear protection." };
      if (distanceKm < radii.notmarRadius) return { level: "CAUTION", color: "bg-blue-950/80 border-blue-500 text-blue-200", badge: "bg-blue-600", text: "INSIDE NOTICE TO MARINERS (NOTMAR) BUFFER: Closed to marine and fishing vessels." };
      return { level: "SAFE OBSERVATION", color: "bg-emerald-950/80 border-emerald-500 text-emerald-200", badge: "bg-emerald-600", text: "You are outside all critical hazard boundaries. Safe public observation sector." };
    }

    // --- SYNCHRONIZED TRAJECTORY MATH ---
    const getTrajectoryData = (isSuborbital) => {
      const points = isSuborbital ? [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(15, 50, 0),
        new THREE.Vector3(50, 100, 0),
        new THREE.Vector3(85, 50, 0),
        new THREE.Vector3(100, 0, 0)
      ] : [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(20, 150, 0),
        new THREE.Vector3(200, 400, 0),
        new THREE.Vector3(1000, 500, 0),
        new THREE.Vector3(2000, 500, 0)
      ];
      
      const curve = new THREE.CatmullRomCurve3(points);
      
      const findT = (targetY, maxScanT = 1) => {
        let bestT = 0, minDiff = Infinity;
        for (let time = 0; time <= maxScanT; time += 0.005) {
          const y = curve.getPoint(time).y;
          const diff = Math.abs(y - targetY);
          if (diff < minDiff) { minDiff = diff; bestT = time; }
        }
        return bestT;
      };

      return {
        curve,
        tMaxQ: findT(15, 0.4),
        tKarman: isSuborbital ? 0.5 : findT(100, 0.6),
        tMeco: isSuborbital ? 0.5 : findT(150, 0.8)
      };
    };

    // --- HIGH-RES 3D MASTER PLAN VIEWER ---
    function EnhancedThreeViewer({ year }) {
      const mountRef = useRef(null);
      const phasesRef = useRef({});

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;
        const currentContainer = container; 

        const w = currentContainer.clientWidth;
        const h = currentContainer.clientHeight || 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x091321); 

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
        camera.position.set(45, 30, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        currentContainer.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.minDistance = 15;
        controls.maxDistance = 150;

        scene.add(new THREE.AmbientLight(0xffffff, 0.95)); 
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(20, 50, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096; 
        dirLight.shadow.mapSize.height = 4096;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const matConcrete = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9 });
        const matBuilding = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
        const matSteel = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.3 });
        const matRocketBody = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
        const matRocketDark = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.2 });

        const terrainGeo = new THREE.PlaneGeometry(100, 100, 128, 128); 
        terrainGeo.rotateX(-Math.PI / 2);
        const pos = terrainGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          let elev = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 1.5 + Math.sin(x * 0.05 + z * 0.05) * 2;
          if (x > 10) elev -= (x - 10) * 0.4;
          if (z < -10) elev -= (-10 - z) * 0.3;
          pos.setY(i, elev);
        }
        terrainGeo.computeVertexNormals();
        const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.9 }));
        terrain.receiveShadow = true;
        scene.add(terrain);

        const water = new THREE.Mesh(
          new THREE.PlaneGeometry(120, 120),
          new THREE.MeshStandardMaterial({ color: 0x072540, transparent: true, opacity: 0.85, roughness: 0.1, metalness: 0.8 })
        );
        water.rotation.x = -Math.PI / 2;
        water.position.y = -1.5;
        scene.add(water);

        const p2024 = new THREE.Group();
        const p2026 = new THREE.Group();
        const p2028 = new THREE.Group();
        const p2032 = new THREE.Group();
        const p2035 = new THREE.Group();

        const getElevation = (x, z) => {
          let elev = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 1.5 + Math.sin(x * 0.05 + z * 0.05) * 2;
          if (x > 10) elev -= (x - 10) * 0.4;
          if (z < -10) elev -= (-10 - z) * 0.3;
          return Math.max(elev, -1);
        };

        const buildHangar = (width, depth) => {
          const group = new THREE.Group();
          const base = new THREE.Mesh(new THREE.BoxGeometry(width, 4, depth), matBuilding);
          base.position.y = 2;
          base.castShadow = true; base.receiveShadow = true;
          const roof = new THREE.Mesh(new THREE.CylinderGeometry(depth/2, depth/2, width, 32, 1, false, 0, Math.PI), matSteel);
          roof.rotation.z = Math.PI / 2;
          roof.position.y = 4;
          roof.castShadow = true;
          group.add(base, roof);
          return group;
        };

        const buildPad = (x, z, scale, hasTrench = true) => {
          const padGroup = new THREE.Group();
          const baseLower = new THREE.Mesh(new THREE.BoxGeometry(10 * scale, 0.5, 10 * scale), matConcrete);
          baseLower.position.y = 0.25;
          baseLower.receiveShadow = true;
          const baseUpper = new THREE.Mesh(new THREE.BoxGeometry(8 * scale, 0.5, 8 * scale), matConcrete);
          baseUpper.position.y = 0.75;
          baseUpper.castShadow = true; baseUpper.receiveShadow = true;
          padGroup.add(baseLower, baseUpper);

          if (hasTrench) {
            const trench = new THREE.Mesh(new THREE.BoxGeometry(3 * scale, 1.2, 12 * scale), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
            trench.position.set(0, 0.6, 2 * scale);
            padGroup.add(trench);
          }

          const mastGeo = new THREE.CylinderGeometry(0.1, 0.2, 12 * scale, 16); 
          const offset = 3.5 * scale;
          [[-offset, -offset], [offset, -offset], [-offset, offset], [offset, offset]].forEach(([mx, mz]) => {
            const mast = new THREE.Mesh(mastGeo, matSteel);
            mast.position.set(mx, 6 * scale, mz);
            mast.castShadow = true;
            padGroup.add(mast);
          });

          padGroup.position.set(x, getElevation(x, z), z);
          return padGroup;
        };

        const buildRocket = (scale, type = "medium") => {
          const rGroup = new THREE.Group();
          const core = new THREE.Mesh(new THREE.CylinderGeometry(0.8 * scale, 0.8 * scale, 10 * scale, 32), matRocketBody);
          core.position.y = 6 * scale;
          core.castShadow = true;
          rGroup.add(core);

          const nose = new THREE.Mesh(new THREE.ConeGeometry(0.8 * scale, 2.5 * scale, 32), type === "heavy" ? matRocketDark : matRocketBody);
          nose.position.y = 12.25 * scale;
          nose.castShadow = true;
          rGroup.add(nose);

          const engine = new THREE.Mesh(new THREE.CylinderGeometry(0.4 * scale, 0.7 * scale, 1 * scale, 32), matSteel);
          engine.position.y = 0.5 * scale;
          engine.castShadow = true;
          rGroup.add(engine);

          return rGroup;
        };

        const subPad = new THREE.Mesh(new THREE.BoxGeometry(5, 0.5, 5), matConcrete);
        subPad.position.set(-15, getElevation(-15, -10) + 0.25, -10);
        subPad.receiveShadow = true;
        p2024.add(subPad);

        const dishBase = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 2, 32), matConcrete);
        dishBase.position.set(-15, getElevation(-15, -4) + 1, -4);
        dishBase.castShadow = true;
        const dish = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32, 0, Math.PI*2, 0, Math.PI/2.5), matRocketBody);
        dish.rotation.x = Math.PI / 4;
        dish.position.set(-15, getElevation(-15, -4) + 2.5, -4);
        dish.castShadow = true;
        p2024.add(dishBase, dish);

        const gate = buildHangar(5, 4); 
        gate.position.set(-25, getElevation(-25, 15), 15);
        p2026.add(gate);

        const hub = buildHangar(8, 6);
        hub.position.set(-5, getElevation(-5, 12), 12);
        p2026.add(hub);

        const pad1 = buildPad(5, -2, 1);
        const rocket1 = buildRocket(1);
        rocket1.position.set(5, getElevation(5, -2) + 1, -2);
        p2028.add(pad1, rocket1);

        const hif = buildHangar(12, 8);
        hif.position.set(-10, getElevation(-10, 5), 5);
        p2028.add(hif);

        const pad2 = buildPad(15, 8, 1.1);
        const rocket2 = buildRocket(1.1);
        rocket2.position.set(15, getElevation(15, 8) + 1, 8);
        p2032.add(pad2, rocket2);

        const hifExt = buildHangar(10, 8);
        hifExt.position.set(-21, getElevation(-21, 5), 5);
        p2032.add(hifExt);

        const pad3 = buildPad(-5, -18, 1.5);
        const rocket3 = buildRocket(1.5, "heavy");
        rocket3.position.set(-5, getElevation(-5, -18) + 1.5, -18);
        p2035.add(pad3, rocket3);

        const pad4 = buildPad(12, -15, 1);
        p2035.add(pad4);

        scene.add(p2024, p2026, p2028, p2032, p2035);
        phasesRef.current = { p2024, p2026, p2028, p2032, p2035 };

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!currentContainer) return;
          camera.aspect = currentContainer.clientWidth / currentContainer.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(currentContainer.clientWidth, currentContainer.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          if (currentContainer && currentContainer.contains(renderer.domElement)) {
            currentContainer.removeChild(renderer.domElement);
          }
          
          scene.traverse((object) => {
            if (object.geometry) object.geometry.dispose();
            if (object.material) {
              if (object.material.map) object.material.map.dispose();
              if (Array.isArray(object.material)) object.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
              else object.material.dispose();
            }
          });
          
          renderer.dispose();
        };
      }, []);

      useEffect(() => {
        const { p2024, p2026, p2028, p2032, p2035 } = phasesRef.current;
        if (p2024) {
          p2024.visible = year >= 2024;
          p2026.visible = year >= 2026;
          p2028.visible = year >= 2028;
          p2032.visible = year >= 2032;
          p2035.visible = year >= 2035;
        }
      }, [year]);

      return <div ref={mountRef} className="w-full h-[550px]" />;
    }

    // --- 2D TELEMETRY ARC VIEWER (WITH MOBILE SCROLL) ---
    function TelemetryArcViewer2D({ rocket, progress, currentAlt, trajData }) {
      const isSuborbital = rocket.missionType === 'Suborbital';
      const maxX = isSuborbital ? 100 : 2000;
      const maxY = isSuborbital ? 100 : 500;
      
      const scrollRef = useRef(null);

      const mapX = (x) => 50 + (x / maxX) * 850;
      const mapY = (y) => 260 - (y / maxY) * 220; 

      const { curve, tMaxQ, tKarman, tMeco } = trajData;
      const curvePoints = curve.getPoints(100);
      const svgPath = curvePoints.map(p => `${mapX(p.x)},${mapY(p.y)}`).join(' ');

      const milestones = isSuborbital ? [
        { label: "MAX-Q", alt: "15 km", t: tMaxQ, align: "start", dx: 12, dy: 14 },
        { label: "APOGEE", alt: "100 km", t: 0.5, align: "middle", dx: 0, dy: -16 }
      ] : [
        { label: "MAX-Q", alt: "15 km", t: tMaxQ, align: "start", dx: 14, dy: 12 },
        { label: "KARMAN LINE", alt: "100 km", t: tKarman, align: "start", dx: 14, dy: 4 },
        { label: "MECO / SEP", alt: "150 km", t: tMeco, align: "start", dx: 14, dy: -12 },
        { label: "ORBIT", alt: "500 km", t: 1.0, align: "end", dx: -12, dy: -16 }
      ];

      const t = Math.max(0, Math.min(1, progress / 100));
      const currentPoint = curve.getPoint(t);
      const rocketPx = mapX(currentPoint.x);
      const rocketPy = mapY(currentPoint.y);
      
      let rotation = 0;
      if (t < 1) {
        const tangent = curve.getTangent(t).normalize();
        rotation = Math.atan2(-tangent.y, tangent.x) * (180 / Math.PI); 
      }

      useEffect(() => {
        if (scrollRef.current) {
          const containerHalfWidth = scrollRef.current.clientWidth / 2;
          scrollRef.current.scrollLeft = rocketPx - containerHalfWidth;
        }
      }, [rocketPx]);

      return (
        <div ref={scrollRef} className="w-full h-[550px] bg-[#091321] relative overflow-x-auto overflow-y-hidden touch-pan-x flex justify-start md:justify-center no-scrollbar pointer-events-auto">
          <div className="min-w-[850px] w-full h-full relative flex items-center justify-center pointer-events-none">
            <svg viewBox="0 0 950 300" className="w-full h-full">
              <line x1="50" y1="260" x2="900" y2="260" stroke="#1e293b" strokeWidth="2" />
              <line x1="50" y1="40" x2="50" y2="260" stroke="#1e293b" strokeWidth="2" />
              <line x1="50" y1="150" x2="900" y2="150" stroke="#0f172a" strokeWidth="1" />
              
              {maxY >= 100 && (
                <g>
                  <line x1="50" y1={mapY(100)} x2="900" y2={mapY(100)} stroke="#334155" strokeDasharray="4 4" strokeWidth="1" />
                  <text x="900" y={mapY(100) - 6} fill="#64748b" fontSize="12" textAnchor="end" className="font-mono">KARMAN LINE (100km)</text>
                </g>
              )}
              
              <text x="40" y="265" fill="#475569" fontSize="12" textAnchor="end" className="font-mono">0km</text>
              <text x="40" y="45" fill="#475569" fontSize="12" textAnchor="end" className="font-mono">{maxY}km</text>
              <text x="900" y="280" fill="#475569" fontSize="12" textAnchor="end" className="font-mono">Downrange ({maxX}km)</text>

              <polyline points={svgPath} fill="none" stroke="#c026d3" strokeWidth="3" />

              {milestones.map((m, idx) => {
                const pt = curve.getPoint(m.t);
                const px = mapX(pt.x);
                const py = mapY(pt.y);
                return (
                  <g key={idx}>
                    <circle cx={px} cy={py} r="5" fill="#38bdf8" stroke="#091321" strokeWidth="2" />
                    <text 
                      x={px + m.dx} 
                      y={py + m.dy} 
                      fill="#94a3b8" 
                      fontSize="12" 
                      textAnchor={m.align} 
                      className="font-mono font-bold"
                    >
                      {m.label} ({m.alt})
                    </text>
                  </g>
                );
              })}

              <line x1={rocketPx} y1={rocketPy} x2={rocketPx} y2="260" stroke="#38bdf8" strokeDasharray="3 3" opacity="0.5" strokeWidth="1.5" />
              <ellipse cx={rocketPx} cy="260" rx="6" ry="2" fill="#38bdf8" opacity="0.8" />

              <g transform={`translate(${rocketPx}, ${rocketPy - 30})`}>
                <rect x="-32" y="-12" width="64" height="22" rx="4" fill="#091321" stroke="#38bdf8" strokeWidth="1" opacity="0.95" />
                <text x="0" y="4" fill="#38bdf8" fontSize="12" fontWeight="bold" textAnchor="middle" className="font-mono">{currentAlt} km</text>
              </g>
              
              <g transform={`translate(${rocketPx}, ${rocketPy}) rotate(${rotation})`}>
                <polygon points="-10,-6 14,0 -10,6 -5,0" fill="#22d3ee" />
                <circle cx="-10" cy="0" r="6" fill="#c026d3" opacity="0.4" />
              </g>
            </svg>
          </div>
        </div>
      );
    }

    // --- 3D LAUNCH VIEWER ---
    function TelemetryArcViewer3D({ rocket, progress, trajData }) {
      const mountRef = useRef(null);
      const sceneRef = useRef({});

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;
        const currentContainer = container;

        const w = currentContainer.clientWidth;
        const h = currentContainer.clientHeight || 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x091321);

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        currentContainer.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        let camPos = new THREE.Vector3();
        let targetPos = new THREE.Vector3();

        if (rocket.missionType === 'Suborbital') {
          camPos.set(50, 60, 180);
          targetPos.set(50, 50, 0);
        } else {
          camPos.set(1000, 300, 2200);
          targetPos.set(1000, 250, 0);
        }

        camera.position.copy(camPos);
        controls.target.copy(targetPos);
        controls.update();

        const { curve, tMaxQ, tKarman, tMeco } = trajData;
        const curvePoints = curve.getPoints(100);
        const lineGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xc026d3, linewidth: 2 });
        const curveLine = new THREE.Line(lineGeo, lineMat);
        scene.add(curveLine);

        const markerScale = rocket.missionType === 'Suborbital' ? 4 : 40; 
        const markerGeo = new THREE.ConeGeometry(markerScale * 0.4, markerScale, 16);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee }); 
        const marker = new THREE.Mesh(markerGeo, markerMat);
        marker.rotation.x = Math.PI / 2;
        
        const markerGroup = new THREE.Group();
        markerGroup.add(marker);
        scene.add(markerGroup);

        const gridScale = rocket.missionType === 'Suborbital' ? 200 : 4000;
        const grid = new THREE.GridHelper(gridScale, 40, 0x1e293b, 0x0f172a);
        scene.add(grid);

        // Ground Projection Plumb Line & Reticle
        const plumbMat = new THREE.LineDashedMaterial({ color: 0x38bdf8, dashSize: markerScale, gapSize: markerScale, transparent: true, opacity: 0.6 });
        const plumbGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
        const plumbLine = new THREE.Line(plumbGeo, plumbMat);
        scene.add(plumbLine);

        const reticleGeo = new THREE.RingGeometry(markerScale * 0.8, markerScale * 1.2, 32);
        const reticleMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
        const groundReticle = new THREE.Mesh(reticleGeo, reticleMat);
        groundReticle.rotation.x = -Math.PI / 2;
        scene.add(groundReticle);

        const makeTextSprite = (text, color = '#38bdf8') => {
          const canvas = document.createElement('canvas');
          canvas.width = 512; canvas.height = 128;
          const ctx = canvas.getContext('2d');
          
          ctx.fillStyle = 'rgba(9, 19, 33, 0.85)';
          ctx.strokeStyle = '#233247';
          ctx.lineWidth = 4;
          ctx.beginPath();
          const x = 12, y = 12, w = 488, h = 104, r = 20;
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = color;
          ctx.font = 'bold 44px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(text, 256, 64);

          const texture = new THREE.CanvasTexture(canvas);
          const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
          const sprite = new THREE.Sprite(material);
          sprite.scale.set(markerScale * 6.0, markerScale * 1.5, 1);
          return sprite;
        };

        const gateGeo = new THREE.TorusGeometry(markerScale * 1.5, markerScale * 0.08, 12, 32);
        
        // Gate 1: Max-Q (~15km)
        const posMaxQ = curve.getPoint(tMaxQ);
        const tanMaxQ = curve.getTangent(tMaxQ).normalize();
        const gateMaxQ = new THREE.Mesh(gateGeo, new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.35 }));
        gateMaxQ.position.copy(posMaxQ);
        gateMaxQ.lookAt(posMaxQ.clone().add(tanMaxQ));
        scene.add(gateMaxQ);
        const spriteMaxQ = makeTextSprite('MAX-Q: 15 km', '#22d3ee');
        spriteMaxQ.position.copy(posMaxQ.clone().add(new THREE.Vector3(0, markerScale * 2.2, 0)));
        scene.add(spriteMaxQ);

        // Gate 2: Karman Line or Apogee (~100km)
        const posKarman = curve.getPoint(tKarman);
        const tanKarman = curve.getTangent(tKarman).normalize();
        const gateKarman = new THREE.Mesh(gateGeo, new THREE.MeshBasicMaterial({ color: 0xc026d3, transparent: true, opacity: 0.35 }));
        gateKarman.position.copy(posKarman);
        gateKarman.lookAt(posKarman.clone().add(tanKarman));
        scene.add(gateKarman);
        const labelKarman = rocket.missionType === 'Suborbital' ? 'APOGEE: 100 km' : 'KARMAN: 100 km';
        const spriteKarman = makeTextSprite(labelKarman, '#c026d3');
        spriteKarman.position.copy(posKarman.clone().add(new THREE.Vector3(0, markerScale * 2.2, 0)));
        scene.add(spriteKarman);

        // Orbital additional gates: MECO (~150km)
        if (rocket.missionType !== 'Suborbital') {
          const posMeco = curve.getPoint(tMeco);
          const tanMeco = curve.getTangent(tMeco).normalize();
          const gateMeco = new THREE.Mesh(gateGeo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35 }));
          gateMeco.position.copy(posMeco);
          gateMeco.lookAt(posMeco.clone().add(tanMeco));
          scene.add(gateMeco);
          const spriteMeco = makeTextSprite('MECO: 150 km', '#38bdf8');
          spriteMeco.position.copy(posMeco.clone().add(new THREE.Vector3(0, markerScale * 2.2, 0)));
          scene.add(spriteMeco);
        }

        sceneRef.current = { curve, markerGroup, plumbLine, groundReticle };

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!currentContainer) return;
          camera.aspect = currentContainer.clientWidth / currentContainer.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(currentContainer.clientWidth, currentContainer.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          if (currentContainer && currentContainer.contains(renderer.domElement)) {
            currentContainer.removeChild(renderer.domElement);
          }
          
          scene.traverse((object) => {
            if (object.geometry) object.geometry.dispose();
            if (object.material) {
              if (object.material.map) object.material.map.dispose();
              if (Array.isArray(object.material)) object.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
              else object.material.dispose();
            }
          });
          
          renderer.dispose();
        };
      }, [rocket.id]); 

      useEffect(() => {
        const { curve, markerGroup, plumbLine, groundReticle } = sceneRef.current;
        if (curve && markerGroup && plumbLine && groundReticle) {
          const t = Math.max(0, Math.min(1, progress / 100));
          const position = curve.getPoint(t);
          
          const positions = plumbLine.geometry.attributes.position.array;
          positions[0] = position.x; positions[1] = position.y; positions[2] = position.z;
          positions[3] = position.x; positions[4] = 0.1;        positions[5] = position.z;
          plumbLine.geometry.attributes.position.needsUpdate = true;
          plumbLine.computeLineDistances(); 
          
          groundReticle.position.set(position.x, 0.2, position.z);
          
          if (t < 1) {
            const tangent = curve.getTangent(t).normalize();
            markerGroup.position.copy(position);
            const lookAtTarget = position.clone().add(tangent);
            markerGroup.lookAt(lookAtTarget);
          } else {
            markerGroup.position.copy(position);
          }
        }
      }, [progress]);

      return <div ref={mountRef} className="w-full h-[550px]" />;
    }

    // --- NEW: GLOBAL ORBIT 3D VIEWER ---
    function TelemetryOrbitViewer3D({ rocket, progress }) {
      const mountRef = useRef(null);
      const sceneRef = useRef({});

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;
        const currentContainer = container;

        const w = currentContainer.clientWidth;
        const h = currentContainer.clientHeight || 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x091321);

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        currentContainer.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 120;
        controls.maxDistance = 400;

        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        // Solid Earth Core (hides backside lines)
        const earthRadius = 100;
        const coreGeo = new THREE.SphereGeometry(earthRadius, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x07101c });
        earthGroup.add(new THREE.Mesh(coreGeo, coreMat));

        // Earth Wireframe Grid
        const wireMat = new THREE.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.8 });
        const wireGeo = new THREE.EdgesGeometry(new THREE.SphereGeometry(earthRadius, 16, 16));
        earthGroup.add(new THREE.LineSegments(wireGeo, wireMat));

        // Equator Reference
        const eqGeo = new THREE.RingGeometry(earthRadius + 1, earthRadius + 1.5, 64);
        const eqMat = new THREE.MeshBasicMaterial({ color: 0x334155, side: THREE.DoubleSide });
        const equator = new THREE.Mesh(eqGeo, eqMat);
        equator.rotation.x = Math.PI / 2;
        earthGroup.add(equator);

        // Canso Launch Pad Marker
        const latRad = 45.3056 * (Math.PI / 180);
        const lonRad = -60.9814 * (Math.PI / 180);
        const cx = earthRadius * Math.cos(latRad) * Math.sin(lonRad);
        const cy = earthRadius * Math.sin(latRad);
        const cz = earthRadius * Math.cos(latRad) * Math.cos(lonRad);
        const padPos = new THREE.Vector3(cx, cy, cz);
        
        const padMesh = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
        padMesh.position.copy(padPos);
        earthGroup.add(padMesh);

        // Parse Inclination from Manifest (Fallback to 90/Polar)
        let inc = 90;
        if (rocket.orbit.includes('98')) inc = 98.1;
        if (rocket.orbit.includes('87')) inc = 87.9;
        
        const isSub = rocket.missionType === 'Suborbital';
        const orbitRadius = earthRadius + (isSub ? 3 : 12);
        
        // Orbital pivot group anchored at the Earth's core
        const orbitGroup = new THREE.Group();
        // Step 1: Aim the Z-axis of this invisible group directly at the Canso launch pad
        orbitGroup.lookAt(padPos); 
        // Step 2: Spin the group around that Canso anchor point to match the launch azimuth (inclination)
        const azimuthTilt = (inc - 90) * (Math.PI / 180);
        orbitGroup.rotateZ(azimuthTilt);
        earthGroup.add(orbitGroup);

        // Draw Global Orbit Line exactly along the path
        const pathPoints = [];
        const pathExtent = isSub ? 0.15 : Math.PI * 2;
        for (let i = 0; i <= 128; i++) {
          const a = (i / 128) * pathExtent;
          // Curve starts at Z (Canso) and tilts into -Y
          pathPoints.push(new THREE.Vector3(0, -orbitRadius * Math.sin(a), orbitRadius * Math.cos(a)));
        }
        const lineGeo = new THREE.BufferGeometry().setFromPoints(pathPoints);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xc026d3, transparent: true, opacity: 0.4 });
        orbitGroup.add(new THREE.Line(lineGeo, lineMat));

        // Create a dedicated pivot specifically for animating the rocket along the arc
        const rocketPivot = new THREE.Group();
        orbitGroup.add(rocketPivot);

        const rocketGeo = new THREE.ConeGeometry(1.5, 4, 8);
        const rocketMesh = new THREE.Mesh(rocketGeo, new THREE.MeshBasicMaterial({ color: 0x22d3ee }));
        rocketMesh.position.set(0, 0, orbitRadius);
        // Spin the cone 180 degrees so the tip points natively along the velocity vector (-Y direction)
        rocketMesh.rotation.x = Math.PI; 
        rocketPivot.add(rocketMesh);

        // Initial Camera Setup looking at Nova Scotia
        camera.position.set(cx * 2.5, cy * 2.5, cz * 2.5);
        controls.target.set(0, 0, 0);

        sceneRef.current = { rocketPivot, isSub, pathExtent };

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          controls.update();
          earthGroup.rotation.y += 0.0005; // Gentle cinematic global spin
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!currentContainer) return;
          camera.aspect = currentContainer.clientWidth / currentContainer.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(currentContainer.clientWidth, currentContainer.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          if (currentContainer && currentContainer.contains(renderer.domElement)) {
            currentContainer.removeChild(renderer.domElement);
          }
          
          scene.traverse((object) => {
            if (object.geometry) object.geometry.dispose();
            if (object.material) {
              if (object.material.map) object.material.map.dispose();
              if (Array.isArray(object.material)) object.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
              else object.material.dispose();
            }
          });
          
          renderer.dispose();
        };
      }, [rocket.id]); 

      useEffect(() => {
        const { rocketPivot, isSub, pathExtent } = sceneRef.current;
        if (rocketPivot) {
          const t = Math.max(0, Math.min(1, progress / 100));
          // Rotate the rocket's pivot around the X-axis. 
          // This perfectly traces the curve without needing any complex coordinate mapping.
          rocketPivot.rotation.x = t * pathExtent;
        }
      }, [progress]);

      return <div ref={mountRef} className="w-full h-[550px]" />;
    }

      const trajData = useMemo(() => getTrajectoryData(isSuborbital), [isSuborbital]);

      const t = Math.max(0, Math.min(1, flightProgress / 100));
      const currentPoint = trajData.curve.getPoint(t);

        ? Math.round(Math.abs(Math.cos(t * Math.PI)) * 6000)

                      <div className="flex justify-between items-center mb-4">
                        <button 
                          onClick={() => {

                          className={`px-5 py-2 text-xs font-bold font-mono rounded-lg border transition shadow-lg ${isFlightPlaying ? 'bg-slate-800 text-fuchsia-300 border-slate-700' : 'bg-fuchsia-500 text-white border-fuchsia-400 hover:bg-fuchsia-600'}`}
                        >
                          {isFlightPlaying ? '⏸ PAUSE' : '▶ PLAY LAUNCH'}
                        </button>
                        <span className="text-sm font-mono text-fuchsia-400 font-bold bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg">T+ {flightProgress.toFixed(1)}%</span>
                      </div>
                      
                      <input 
                        type="range" 
                        min="0" 
                        max="100" 
                        step="0.5" 
                        value={flightProgress}
                        onChange={(e) => {
                          setIsFlightPlaying(false);
                          setFlightProgress(parseFloat(e.target.value));
                        }}
                        className="w-full accent-fuchsia-500 h-2 bg-slate-800 rounded-lg cursor-pointer relative z-10"
                      />
                      
                      {/* DYNAMIC POSITIONED MILESTONE LABELS */}
                      <div className="relative w-full h-4 text-[10px] sm:text-xs font-mono text-slate-400 mt-4 px-1">
                        <span 
                          className={`absolute top-0 -translate-x-1/2 whitespace-nowrap ${flightProgress >= (trajData.tMaxQ * 100) ? "text-fuchsia-400 font-bold" : ""}`}
                          style={{ left: `${trajData.tMaxQ * 100}%` }}
                        >
                          MAX-Q (15km)
                        </span>
                        <span 
                          className={`absolute top-0 -translate-x-1/2 whitespace-nowrap ${flightProgress >= (trajData.tMeco * 100) ? "text-fuchsia-400 font-bold" : ""}`}
                          style={{ left: `${trajData.tMeco * 100}%` }}
                        >
                          {isSuborbital ? 'APOGEE (100km)' : 'MECO (150km)'}
                        </span>
                        <span className={`absolute right-0 top-0 ${flightProgress === 100 ? "text-fuchsia-400 font-bold" : ""}`}>

            {activeTab === 'safety' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-5 space-y-6">
                  <div className="bg-[#111a28] border border-[#233247] rounded-2xl p-6 shadow-xl">
                    <h2 className="text-xs font-mono uppercase text-cyan-400 mb-4 font-bold tracking-wider">Mission Configuration</h2>
                    <select value={selectedRocketId} onChange={(e) => setSelectedRocketId(e.target.value)} className="w-full bg-slate-900 border border-[#233247] rounded-xl p-3 text-sm text-white font-medium focus:ring-2 focus:ring-cyan-400 focus:outline-none">
                      {ROCKET_MANIFEST.map(r => <option key={r.id} value={r.id}>{r.name} • {r.operator} ({r.propellantTons}t)</option>)}
                    </select>
                    <div className="mt-5 pt-4 border-t border-[#233247] text-xs text-slate-400 space-y-2 font-mono">
                      <div className="flex justify-between"><span>Propellant Mass:</span><span className="text-white font-semibold">{activeRocket.propellantTons} Metric Tons</span></div>
                      <div className="flex justify-between"><span>Payload Mass:</span><span className="text-white font-semibold">{activeRocket.payloadKg.toLocaleString()} kg</span></div>
                      <div className="flex justify-between"><span>Target Profile:</span><span className="text-cyan-400 font-semibold">{activeRocket.orbit}</span></div>
                    </div>
                  </div>

                  <div className="bg-[#111a28] border border-[#233247] rounded-2xl p-6 shadow-xl">
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="text-xs font-mono uppercase text-cyan-400 font-bold tracking-wider">Observer Distance</h2>
                      <button onClick={requestGPS} className="text-xs bg-cyan-400/10 hover:bg-cyan-400/20 text-cyan-400 border border-cyan-400/30 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 font-bold">📍 Live GPS</button>
                    </div>
                    <div className="space-y-4">
                      <div>
                        <div className="flex justify-between items-baseline mb-2">
                          <span className="text-xs text-slate-400">Distance to Canso Pad:</span>
                          <span className="text-xl font-mono font-bold text-cyan-400">{distanceKm} km</span>
                        </div>
                        <input type="range" min="0.2" max="25" step="0.1" value={distanceKm} onChange={(e) => { setDistanceKm(parseFloat(e.target.value)); setGpsActive(false); }} className="w-full accent-cyan-400 h-2 bg-slate-800 rounded-lg cursor-pointer" />
                      </div>
                    </div>
                  </div>

                  <div className={`p-5 rounded-2xl border ${status.color.replace('950/80', '900/40')} shadow-xl space-y-3`}>
                    <div className="flex items-center gap-3">
                      <span className={`text-[10px] font-black uppercase px-2.5 py-1 rounded-md text-white ${status.badge}`}>{status.level}</span>
                      <span className="text-sm font-mono font-bold">RANGE: {distanceKm} KM</span>
                    </div>
                    <p className="text-sm font-semibold leading-relaxed">{status.text}</p>
                  </div>
                </div>

                <div className="lg:col-span-7 space-y-6">
                  <div className="bg-[#111a28] border border-[#233247] rounded-2xl p-6 shadow-xl flex flex-col items-center">
                    <div className="w-full flex justify-between items-center mb-4">
                      <h2 className="text-xs font-mono uppercase text-cyan-400 font-bold tracking-wider">Perimeter Radar Scope</h2>
                      <span className="text-xs font-mono text-slate-400 bg-slate-900 px-2 py-1 rounded-md">Yield: {activeRocket.propellantTons}t Propellant</span>
                    </div>
                    <canvas ref={canvasRef} width={400} height={400} className="w-full max-w-[400px] bg-[#091321] rounded-full border border-[#233247] shadow-inner" />
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full mt-6 text-[10px] font-mono text-center">
                      <div className="p-3 rounded-xl bg-red-950/20 border border-red-900/40 text-red-400">Blast<br/><strong className="text-sm mt-1 block">{radii.blastRadius} km</strong></div>
                      <div className="p-3 rounded-xl bg-orange-950/20 border border-orange-900/40 text-orange-400">Overpress<br/><strong className="text-sm mt-1 block">{radii.overpressureRadius} km</strong></div>
                      <div className="p-3 rounded-xl bg-yellow-950/20 border border-yellow-900/40 text-yellow-400">Acoustic<br/><strong className="text-sm mt-1 block">{radii.acousticRadius} km</strong></div>
                      <div className="p-3 rounded-xl bg-blue-950/20 border border-blue-900/40 text-blue-400">NOTMAR<br/><strong className="text-sm mt-1 block">{radii.notmarRadius} km</strong></div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'manifest' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {ROCKET_MANIFEST.map((r) => (
                  <div key={r.id} className="bg-[#111a28] border border-[#233247] rounded-2xl p-6 flex flex-col justify-between hover:border-slate-600 transition shadow-xl">
                    <div className="space-y-4">
                      <div className="flex justify-between items-start">
                        <span className="text-[10px] font-mono font-bold text-cyan-400 bg-cyan-400/10 border border-cyan-400/20 px-2 py-1 rounded-md">NET {r.targetDate}</span>
                        <span className="text-[10px] text-emerald-400 font-bold bg-emerald-400/10 px-2 py-1 rounded-md uppercase">{r.status}</span>
                      </div>
                      <div>
                        <h3 className="text-xl font-bold text-white leading-tight">{r.name}</h3>
                        <p className="text-sm text-slate-400 font-mono mt-1">{r.operator}</p>
                      </div>
                      <div className="space-y-2 text-xs text-slate-400 pt-4 border-t border-[#233247] font-mono">

                        <div className="flex justify-between"><span>Propellant Load:</span><span className="text-slate-200 font-bold">{r.propellantTons} Metric Tons</span></div>

                    </div>
                    <div className="mt-8 flex flex-col sm:flex-row gap-3">

                        <IconRadar /> Safety Matrix
                      </button>
                      <button onClick={() => { setSelectedRocketId(r.id); setFlightProgress(0); setIsFlightPlaying(false); setActiveTab('telemetry'); }} className="flex-1 py-2.5 bg-slate-800 hover:bg-fuchsia-500 hover:text-white border border-slate-700 text-fuchsia-400 text-xs font-bold rounded-xl transition shadow-lg flex justify-center items-center gap-2">
                        <IconActivity /> Track Arc

                  </div>

                  <span>Site Location: <strong className="text-white">Guysborough County / Canso, Nova Scotia</strong></span>
                  <span className="text-cyan-400 font-mono font-bold">Orbital Inclinations: 45.1° (LEO) to 98.1° (SSO)</span>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  {SPACEPORT_FACILITIES.map((f, i) => (
                    <div key={i} className="bg-[#111a28] border border-[#233247] rounded-2xl p-6 space-y-4 shadow-xl">
                      <div className="flex justify-between items-center text-[10px] font-mono font-bold uppercase">
                        <span className="px-2.5 py-1 rounded-md bg-slate-800 text-slate-300">{f.tag}</span>
                        <span className="text-cyan-400">{f.progress}%</span>
                      </div>
                      <h3 className="text-sm font-bold text-white leading-snug">{f.name}</h3>
                      <p className="text-xs text-slate-400 leading-relaxed">{f.desc}</p>
                      <div className="w-full bg-[#080d16] h-2.5 rounded-full overflow-hidden border border-slate-800">
                        <div className={`h-full transition-all duration-1000 ${f.progress === 100 ? 'bg-emerald-400' : 'bg-cyan-400'}`} style={{ width: `${f.progress}%` }} />
                      </div>
                    </div>
                  ))}

              </div>

              <button 
                onClick={() => aboutModalRef.current.showModal()}
                className="hover:text-cyan-400 transition underline underline-offset-4 flex items-center gap-2"

                <IconInfo /> Data & Models Disclaimer
              </button>
            </footer>

            <dialog 
              ref={aboutModalRef} 
              onClick={(e) => { if (e.target === aboutModalRef.current) aboutModalRef.current.close(); }}

            >
              <div className="p-5 border-b border-[#233247] flex justify-between items-center sticky top-0 bg-[#111a28] z-10">
                <h2 className="text-lg font-bold text-white flex items-center gap-2">
                  <IconInfo /> About Data & Models
                </h2>
                <button 
                  onClick={() => aboutModalRef.current.close()}
                  className="text-slate-500 hover:text-cyan-400 transition p-1 bg-slate-900 rounded-md border border-[#233247]"
                  title="Close"
                >
                  <IconX />
                </button>
              </div>
              <div className="p-6 text-sm text-slate-400 space-y-6 overflow-y-auto max-h-[70vh] no-scrollbar">
                <p>
                  This independent reference explorer is designed to visualize the Canso launch complex operations. It is not an official feed operated by Maritime Launch Services.
                </p>
                
                <div>
                  <h3 className="text-white font-bold mb-2">Proximity Safety Model</h3>
                  <p className="leading-relaxed">
                    The four hazard rings (Blast, Overpressure, Acoustic, NOTMAR) are generated using Hopkinson-Cranz cube-root scaling laws. The formula calculates safe scaling distances based on the TNT-equivalent yield of the propellant load in metric tons.
                  </p>
                  <p className="mt-2 text-xs text-slate-500 font-mono">
                    d = Z &times; &#8731;W <br/>
                    (where Z is the scaled distance factor and W is propellant mass)
                  </p>
                  <p className="mt-3 leading-relaxed text-amber-500/80">
                    Warning: These calculations do not model terrain, specific propellant chemistry, localized weather patterns, or official marine exclusion zones. Always adhere to official NOTMAR/NOTAM broadcast closures during launch campaigns.
                  </p>
                </div>

                <div>
                  <h3 className="text-white font-bold mb-2">Flight Simulation</h3>
                  <p className="leading-relaxed">
                    The 3D telemetry arcs utilize a Catmull-Rom spline approximation (Three.js CatmullRomCurve3) to interpolate trajectory profiles based on standard suborbital and polar low-earth orbit (LEO) pitch-over parameters. Progress speed, altitude, and velocity readouts are kinematic estimations and do not represent live telemetry data.
                  </p>
                </div>

                <div>
                  <h3 className="text-white font-bold mb-2">Location Privacy</h3>
                  <p className="leading-relaxed">
                    When you select "Live GPS" to calculate proximity to Launch Complex 1, your latitude and longitude coordinates are processed entirely locally within your browser using JavaScript's Haversine formula. Your location data is never logged, stored, or transmitted to any external server.
                  </p>
                </div>
              </div>
            </dialog>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SpaceportApp />);
  </script>
</body>
