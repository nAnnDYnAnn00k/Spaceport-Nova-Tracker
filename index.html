  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANSO_PAD = { lat: 45.3056, lng: -60.9814, name: "Spaceport Nova Scotia (LC-1)" };

    const ROCKET_MANIFEST = [
      { id: "barracuda-4", name: "Barracuda (Flight 4)", operator: "T-Minus Engineering", propellantTons: 0.6, payloadKg: 15, orbit: "Suborbital Hypersonic (~80-100 km)", targetDate: "October 2026", status: "Pad Readiness Review", missionType: "Suborbital", baseCost: 150000, pricePerKg: 20000 },
      { id: "aurora-8", name: "Aurora-8 (Orbital Demo)", operator: "Reaction Dynamics (RDX)", propellantTons: 14, payloadKg: 200, orbit: "SSO / Polar LEO (500 km)", targetDate: "Q3 2028", status: "Launch Agreement", missionType: "Orbital", baseCost: 4500000, pricePerKg: 25000 },
      { id: "spectrum-1", name: "Spectrum (Dedicated Complex)", operator: "Isar Aerospace", propellantTons: 58, payloadKg: 1000, orbit: "Polar / SSO Orbit (Up to 98.1°)", targetDate: "2028", status: "Statement of Work Executed", missionType: "Orbital", baseCost: 15000000, pricePerKg: 25000 },

    ];

    const SPACEPORT_FACILITIES = [
      { name: "Environmental Assessment & Crown Land Lease (335 Acres)", progress: 100, tag: "Regulatory", desc: "Provincial EA clearance & long-term site lease approved." },
      { name: "Suborbital Launch Pad & Campaign Setup", progress: 100, tag: "Suborbital Ops", desc: "Operational for commercial suborbital hypersonic flight tests." },
      { name: "Leaf Space Ground Tracking Station", progress: 100, tag: "Ground Segment", desc: "Commercial satellite antenna active and communicating on site." },
      { name: "Phase 1 Civil Works (Site Grading & Pad Access Roads)", progress: 90, tag: "Civil Works", desc: "Access corridors between Sable Wind Farm perimeter and pads." },
      { name: "Site Entrance & Primary Security Gatehouse", progress: 60, tag: "Site Control", desc: "Procurement & municipal coordination replacing temporary structures." },
      { name: "Central Utility Hub (Power, Fiber Comms, Water)", progress: 45, tag: "Utilities", desc: "Infrastructure package tendered via Lindsay Construction." },
      { name: "Dedicated Orbital Complex (Isar & RDX Pads)", progress: 25, tag: "Launch Pads", desc: "Multi-pad civil layout accommodating domestic and European vehicles." },
      { name: "Permanent Vehicle Assembly & Integration Facility (HIF)", progress: 20, tag: "Integration", desc: "Hangar engineering advancing toward construction tender." }
    ];

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function calculateRadii(propellantTons) {
      const cbrt = Math.cbrt(Math.max(propellantTons, 0.2));
      return { blastRadius: Number((0.5 * cbrt).toFixed(2)), overpressureRadius: Number((1.1 * cbrt).toFixed(2)), acousticRadius: Number((1.9 * cbrt).toFixed(2)), notmarRadius: Number((3.6 * cbrt).toFixed(2)) };
    }

    function getSafetyStatus(distanceKm, radii) {
      if (distanceKm < radii.blastRadius) return { level: "LETHAL HAZARD", color: "bg-red-950/80 border-red-500 text-red-200", badge: "bg-red-600", text: "INSIDE PRIMARY BLAST ZONE: Catastrophic deflagration & fragmentation perimeter." };
      if (distanceKm < radii.overpressureRadius) return { level: "HIGH HAZARD", color: "bg-orange-950/80 border-orange-500 text-orange-200", badge: "bg-orange-600", text: "INSIDE OVERPRESSURE RANGE: Risk of blast wave injury and window failure." };
      if (distanceKm < radii.acousticRadius) return { level: "RESTRICTED", color: "bg-yellow-950/80 border-yellow-500 text-yellow-200", badge: "bg-yellow-600", text: "ACOUSTIC WARNING: Sound pressure exceeds 140 dB. Mandatory ear protection." };
      if (distanceKm < radii.notmarRadius) return { level: "CAUTION", color: "bg-blue-950/80 border-blue-500 text-blue-200", badge: "bg-blue-600", text: "INSIDE NOTICE TO MARINERS (NOTMAR) BUFFER: Closed to marine and fishing vessels." };
      return { level: "SAFE OBSERVATION", color: "bg-emerald-950/80 border-emerald-500 text-emerald-200", badge: "bg-emerald-600", text: "You are outside all critical hazard boundaries. Safe public observation sector." };
    }

    const getTrajectoryData = (isSuborbital) => {
      const points = isSuborbital ? [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(15, 50, 0),
        new THREE.Vector3(50, 100, 0),
        new THREE.Vector3(85, 50, 0),
        new THREE.Vector3(100, 0, 0)
      ] : [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(20, 150, 0),
        new THREE.Vector3(200, 400, 0),
        new THREE.Vector3(1000, 500, 0),
        new THREE.Vector3(2000, 500, 0)
      ];
      
      const curve = new THREE.CatmullRomCurve3(points);
      
      const findT = (targetY, maxScanT = 1) => {
        let bestT = 0, minDiff = Infinity;
        for (let time = 0; time <= maxScanT; time += 0.005) {
          const y = curve.getPoint(time).y;
          const diff = Math.abs(y - targetY);
          if (diff < minDiff) { minDiff = diff; bestT = time; }
        }
        return bestT;
      };

      return {
        curve,
        tMaxQ: findT(15, 0.4),
        tKarman: isSuborbital ? 0.5 : findT(100, 0.6),
        tMeco: isSuborbital ? 0.5 : findT(150, 0.8)
      };
    };

    const createTelemetryRocket = (scale, type) => {
      const group = new THREE.Group();
      
      const matBody = new THREE.MeshBasicMaterial({ color: 0xf8fafc });
      const matDark = new THREE.MeshBasicMaterial({ color: 0x1e293b });
      const matSteel = new THREE.MeshBasicMaterial({ color: 0x94a3b8 });
      
      const stage2 = new THREE.Group();
      const nose = new THREE.Mesh(new THREE.ConeGeometry(1.5 * scale, 2.5 * scale, 16), type === 'heavy' ? matDark : matBody);
      nose.position.y = 2.75 * scale; 
      stage2.add(nose);
      
      const stage1 = new THREE.Group();
      const core = new THREE.Mesh(new THREE.CylinderGeometry(1.5 * scale, 1.5 * scale, 8 * scale, 16), matBody);
      core.position.y = -2.5 * scale;
      
      const engine = new THREE.Mesh(new THREE.CylinderGeometry(0.8 * scale, 1.2 * scale, 1 * scale, 16), matSteel);
      engine.position.y = -7 * scale;
      
      const plumeMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
      const plume = new THREE.Mesh(new THREE.ConeGeometry(1.2 * scale, 5 * scale, 16), plumeMat);
      plume.rotation.x = Math.PI; 
      plume.position.y = -10 * scale;
      
      stage1.add(core, engine, plume);
      group.add(stage1, stage2);
      
      return { group, stage1, stage2, plume };
    };

    function EnhancedThreeViewer({ year, setBuildYear, orbitalRockets, onHandoff }) {
      const mountRef = useRef(null);
      const phasesRef = useRef({});
      const sceneRocketsRef = useRef({});
      const launchStateRef = useRef({ active: false, time: 0, rocketId: null });
      const cameraLerpRef = useRef(null);
      const onHandoffRef = useRef(onHandoff);

      const [isLoading, setIsLoading] = useState(true);
      const [selectedMission, setSelectedMission] = useState(orbitalRockets[0].id);

      useEffect(() => { onHandoffRef.current = onHandoff; }, [onHandoff]);

      useEffect(() => {
        if (sceneRocketsRef.current && sceneRocketsRef.current[selectedMission]) {
          cameraLerpRef.current = sceneRocketsRef.current[selectedMission].position.clone();
        }
      }, [selectedMission]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;
        const currentContainer = container; 

        const w = currentContainer.clientWidth;
        const h = currentContainer.clientHeight || 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x091321); 

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
        camera.position.set(55, 45, 55);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        currentContainer.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.minDistance = 15;
        controls.maxDistance = 180;

        scene.add(new THREE.AmbientLight(0xffffff, 0.95)); 
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(30, 60, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096; 
        dirLight.shadow.mapSize.height = 4096;
        dirLight.shadow.camera.left = -60;
        dirLight.shadow.camera.right = 60;
        dirLight.shadow.camera.top = 60;
        dirLight.shadow.camera.bottom = -60;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const matConcrete = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.9 });
        const matBuilding = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 });
        const matSteel = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.8, roughness: 0.3 });
        const matRocketBody = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
        const matRocketDark = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.2 });

        const mapUrl = "https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/export?bbox=-61.01,45.29,-60.95,45.32&bboxSR=4326&imageSR=102100&size=1024,1024&format=jpg&f=image";
        const texLoader = new THREE.TextureLoader();
        texLoader.crossOrigin = 'anonymous';
        
        const terrainTex = texLoader.load(
          mapUrl,
          () => { setIsLoading(false); }, 
          undefined,                      
          () => { setIsLoading(false); }  
        );
        terrainTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const terrainGeo = new THREE.PlaneGeometry(160, 160, 128, 128); 
        terrainGeo.rotateX(-Math.PI / 2);
        const pos = terrainGeo.attributes.position;
        
        const getElevation = (x, z) => {
          let elev = (Math.sin(x * 0.05) * Math.cos(z * 0.05) * 2);
          if (x > 15) elev -= (x - 15) * 0.15;
          if (z < -15) elev -= (-15 - z) * 0.1;
          return elev;
        };

        for (let i = 0; i < pos.count; i++) {
          pos.setY(i, getElevation(pos.getX(i), pos.getZ(i)));
        }
        terrainGeo.computeVertexNormals();
        
        const terrainMat = new THREE.MeshStandardMaterial({ 
          color: 0xcccccc, 
          map: terrainTex, 
          roughness: 0.8,
          metalness: 0.1 
        });
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        terrain.receiveShadow = true;
        scene.add(terrain);

        const perimeterCoords = [
          [-45, 55], [15, 55], [28, 25], [30, 5], [26, -15],
          [10, -25], [-10, -28], [-25, -20], [-40, -5], [-45, 55]
        ];
        const perimeterPts = perimeterCoords.map(([px, pz]) => new THREE.Vector3(px, getElevation(px, pz) + 0.3, pz));
        
        const perimeterGeo = new THREE.BufferGeometry().setFromPoints(perimeterPts);
        const perimeterMat = new THREE.LineDashedMaterial({ color: 0xfacc15, dashSize: 3, gapSize: 3, linewidth: 2 });
        const perimeterLine = new THREE.Line(perimeterGeo, perimeterMat);
        perimeterLine.computeLineDistances();
        scene.add(perimeterLine);

        const makeBoundaryLabel = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 512; canvas.height = 128;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#facc15';
          ctx.font = 'bold 32px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('355 ACRE LEASE BOUNDARY', 256, 64);
          const texture = new THREE.CanvasTexture(canvas);
          const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
          const sprite = new THREE.Sprite(material);
          sprite.scale.set(40, 10, 1);
          return sprite;
        };
        const boundaryLabel = makeBoundaryLabel();
        boundaryLabel.position.set(-25, 10, 45); 
        scene.add(boundaryLabel);

        const water = new THREE.Mesh(
          new THREE.PlaneGeometry(300, 300),
          new THREE.MeshStandardMaterial({ color: 0x072540, transparent: true, opacity: 0.85, roughness: 0.1, metalness: 0.8 })
        );
        water.rotation.x = -Math.PI / 2;
        water.position.y = -2.5;
        scene.add(water);

        const p2024 = new THREE.Group();
        const p2026 = new THREE.Group();
        const p2028 = new THREE.Group();
        const p2030 = new THREE.Group();
        const p2032 = new THREE.Group();

        const buildHIF = (width, depth) => {
          const group = new THREE.Group();
          const base = new THREE.Mesh(new THREE.BoxGeometry(width, 6, depth), matBuilding);
          base.position.y = 3;
          base.castShadow = true; base.receiveShadow = true;
          const roof = new THREE.Mesh(new THREE.CylinderGeometry(depth/2, depth/2, width, 32, 1, false, 0, Math.PI), matSteel);
          roof.rotation.z = Math.PI / 2;
          roof.position.y = 6;
          roof.castShadow = true;
          const apron = new THREE.Mesh(new THREE.BoxGeometry(width, 0.2, depth + 10), matConcrete);
          apron.position.set(0, 0.1, 5);
          apron.receiveShadow = true;
          group.add(base, roof, apron);
          group.scale.set(0.25, 0.25, 0.25);
          return group;
        };

        const buildPadComplex = (x, z, scale, hasTrench = true, type = "medium") => {
          const padGroup = new THREE.Group();
          
          const deck = new THREE.Mesh(new THREE.BoxGeometry(14 * scale, 1, 14 * scale), matConcrete);
          deck.position.y = 0.5;
          deck.receiveShadow = true; deck.castShadow = true;
          padGroup.add(deck);

          if (hasTrench) {
            const trenchGroup = new THREE.Group();
            const trenchWall1 = new THREE.Mesh(new THREE.BoxGeometry(1 * scale, 1.5, 16 * scale), matConcrete);
            trenchWall1.position.set(-2.5 * scale, 0.75, 6 * scale);
            const trenchWall2 = new THREE.Mesh(new THREE.BoxGeometry(1 * scale, 1.5, 16 * scale), matConcrete);
            trenchWall2.position.set(2.5 * scale, 0.75, 6 * scale);
            const trenchFloor = new THREE.Mesh(new THREE.BoxGeometry(4 * scale, 0.2, 16 * scale), new THREE.MeshStandardMaterial({ color: 0x0a0a0a }));
            trenchFloor.position.set(0, 0.1, 6 * scale);
            trenchGroup.add(trenchWall1, trenchWall2, trenchFloor);
            padGroup.add(trenchGroup);
          }

          const strongback = new THREE.Mesh(new THREE.BoxGeometry(1.5 * scale, 16 * scale, 1.5 * scale), matSteel);
          strongback.position.set(2.5 * scale, 8 * scale, -2 * scale);
          strongback.castShadow = true;
          padGroup.add(strongback);

          const tankGeo = new THREE.CylinderGeometry(1.5 * scale, 1.5 * scale, 7 * scale, 16);
          const tankMat1 = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 }); 
          const tankMat2 = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 }); 
          
          const tank1 = new THREE.Mesh(tankGeo, tankMat1);
          tank1.rotation.z = Math.PI / 2;
          tank1.position.set(-9 * scale, 1.5 * scale, -2 * scale);
          tank1.castShadow = true;
          
          const tank2 = new THREE.Mesh(tankGeo, tankMat2);
          tank2.rotation.z = Math.PI / 2;
          tank2.position.set(-9 * scale, 1.5 * scale, 3 * scale);
          tank2.castShadow = true;
          
          padGroup.add(tank1, tank2);

          const mastGeo = new THREE.CylinderGeometry(0.1, 0.3, 22 * scale, 8); 
          const offset = 6.5 * scale;
          [[-offset, -offset], [offset, -offset], [-offset, offset], [offset, offset]].forEach(([mx, mz]) => {
            const mast = new THREE.Mesh(mastGeo, matSteel);
            mast.position.set(mx, 11 * scale, mz);
            mast.castShadow = true;
            padGroup.add(mast);
          });

          padGroup.scale.set(0.25, 0.25, 0.25);
          padGroup.position.set(x, getElevation(x, z), z);
          return padGroup;
        };

        const buildMapRocket = (scale, type = "medium", rocketId = null) => {
          const rGroup = new THREE.Group();
          const core = new THREE.Mesh(new THREE.CylinderGeometry(0.8 * scale, 0.8 * scale, 10 * scale, 32), matRocketBody);
          core.position.y = 6 * scale;
          core.castShadow = true;
          rGroup.add(core);

          const nose = new THREE.Mesh(new THREE.ConeGeometry(0.8 * scale, 2.5 * scale, 32), type === "heavy" ? matRocketDark : matRocketBody);
          nose.position.y = 12.25 * scale;
          nose.castShadow = true;
          rGroup.add(nose);

          const engine = new THREE.Mesh(new THREE.CylinderGeometry(0.4 * scale, 0.7 * scale, 1 * scale, 32), matSteel);
          engine.position.y = 0.5 * scale;
          engine.castShadow = true;
          rGroup.add(engine);

          const plumeMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
          const plume = new THREE.Mesh(new THREE.ConeGeometry(1.2 * scale, 4 * scale, 16), plumeMat);
          plume.rotation.x = Math.PI; 
          plume.position.y = -1 * scale;
          plume.visible = false;
          rGroup.add(plume);

          rGroup.scale.set(0.25, 0.25, 0.25);

          if (rocketId) {
            rGroup.userData = { id: rocketId, plume: plume, initialY: 0 };
          }
          return rGroup;
        };

        const subPad = buildPadComplex(-35, 10, 0.6, false, "small");
        p2024.add(subPad);
        const dishBase = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 2, 16), matConcrete);
        dishBase.scale.set(0.25, 0.25, 0.25);
        dishBase.position.set(-40, getElevation(-40, 16) + 0.25, 16);
        const dish = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16, 0, Math.PI*2, 0, Math.PI/2.5), matRocketBody);
        dish.scale.set(0.25, 0.25, 0.25);
        dish.rotation.x = Math.PI / 4;
        dish.position.set(-40, getElevation(-40, 16) + 0.625, 16);
        p2024.add(dishBase, dish);

        const gate = buildHIF(8, 6); 
        gate.position.set(-40, getElevation(-40, 45), 45);
        gate.rotation.y = Math.PI / 4;
        p2026.add(gate);
        const hub = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 15), matBuilding);
        hub.scale.set(0.25, 0.25, 0.25);
        hub.position.set(-30, getElevation(-30, 40) + 0.5, 40);
        hub.castShadow = true; hub.receiveShadow = true;
        p2026.add(hub);

        const pad1 = buildPadComplex(-5, 15, 1);
        const rocket1 = buildMapRocket(1, "medium", "spectrum-1");
        rocket1.position.set(-5, getElevation(-5, 15) + 0.25, 15);
        rocket1.userData.initialY = rocket1.position.y;
        p2028.add(pad1, rocket1);
        
        const hif1 = buildHIF(15, 12);
        hif1.position.set(-20, getElevation(-20, 25), 25);
        p2028.add(hif1);

        const pad2 = buildPadComplex(5, 35, 1.2); 
        const rocket2 = buildMapRocket(1.2, "medium", "aurora-8");
        rocket2.position.set(5, getElevation(5, 35) + 0.25, 35);
        rocket2.userData.initialY = rocket2.position.y;
        p2030.add(pad2, rocket2);
        
        const hifExt = buildHIF(12, 10);
        hifExt.position.set(-36, getElevation(-36, 25), 25);
        p2030.add(hifExt);

        const pad3 = buildPadComplex(-20, 0, 1.5); 
        const rocket3 = buildMapRocket(1.5, "heavy", "c4m-baseline");
        rocket3.position.set(-20, getElevation(-20, 0) + 0.25, 0);
        rocket3.userData.initialY = rocket3.position.y;
        p2032.add(pad3, rocket3);
        
        const pad4 = buildPadComplex(0, 5, 1.1);
        p2032.add(pad4);

        scene.add(p2024, p2026, p2028, p2030, p2032);
        phasesRef.current = { p2024, p2026, p2028, p2030, p2032 };
        
        sceneRocketsRef.current = {
          'spectrum-1': rocket1,
          'aurora-8': rocket2,
          'c4m-baseline': rocket3
        };

        const breakLerp = () => { cameraLerpRef.current = null; };
        renderer.domElement.addEventListener('pointerdown', breakLerp);
        renderer.domElement.addEventListener('wheel', breakLerp, { passive: true });
        renderer.domElement.addEventListener('touchstart', breakLerp, { passive: true });

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          controls.update();

          const ls = launchStateRef.current;
          if (ls.active && sceneRocketsRef.current) {
            const r = sceneRocketsRef.current[ls.rocketId];
            if (r) {
              ls.time += 0.015;
              const accel = ls.time * ls.time * 30; 
              r.position.y = r.userData.initialY + accel;
              r.userData.plume.visible = true;
              r.userData.plume.scale.setScalar(0.8 + Math.sin(Date.now() * 0.03) * 0.3);
              
              controls.target.lerp(r.position, 0.08);

              if (r.position.y > r.userData.initialY + 120) {
                 ls.active = false;
                 r.position.y = r.userData.initialY;
                 r.userData.plume.visible = false;

                 controls.target.set(0, 0, 0);
                 camera.position.set(55, 45, 55);

                 onHandoffRef.current(ls.rocketId);
              }
            }
          } else if (cameraLerpRef.current) {
            controls.target.lerp(cameraLerpRef.current, 0.05);
            if (controls.target.distanceTo(cameraLerpRef.current) < 0.1) {
               cameraLerpRef.current = null;
            }
          }

          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!currentContainer) return;
          camera.aspect = currentContainer.clientWidth / currentContainer.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(currentContainer.clientWidth, currentContainer.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          renderer.domElement.removeEventListener('pointerdown', breakLerp);
          renderer.domElement.removeEventListener('wheel', breakLerp);
          renderer.domElement.removeEventListener('touchstart', breakLerp);
          
          if (currentContainer && currentContainer.contains(renderer.domElement)) {
            currentContainer.removeChild(renderer.domElement);
          }
          
          scene.traverse((object) => {
            if (object.geometry) object.geometry.dispose();
            if (object.material) {
              if (object.material.map) object.material.map.dispose();
              if (Array.isArray(object.material)) object.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
              else object.material.dispose();
            }
          });
          
          renderer.dispose();
        };
      }, []);

      useEffect(() => {
        const { p2024, p2026, p2028, p2030, p2032 } = phasesRef.current;
        if (p2024) {
          p2024.visible = year >= 2024;
          p2026.visible = year >= 2026;
          p2028.visible = year >= 2028;
          p2030.visible = year >= 2030;
          p2032.visible = year >= 2032;
        }
      }, [year]);

      return (
        <div className="relative w-full h-[550px]">
          {isLoading && (
            <div className="absolute inset-0 z-30 flex flex-col items-center justify-center bg-[#091321] rounded-xl pointer-events-none">

              <div className="w-48 h-1 bg-slate-800 rounded-full overflow-hidden">
                <div className="w-full h-full bg-cyan-400 rounded-full animate-pulse"></div>
              </div>
            </div>
          )}

          <div className="absolute top-4 left-4 p-4 bg-[#091321]/80 backdrop-blur-md rounded-xl border border-slate-600/30 shadow-2xl z-20 flex flex-col gap-3 min-w-[200px]">

            <select

              onChange={(e) => {
                const rid = e.target.value;
                setSelectedMission(rid);
                if (rid === 'spectrum-1' && year < 2028) setBuildYear(2028);
                if (rid === 'aurora-8' && year < 2030) setBuildYear(2030);

    function TelemetryArcViewer2D({ rocket, progress, currentAlt, trajData }) {
      const isSuborbital = rocket.missionType === 'Suborbital';
      const maxX = isSuborbital ? 100 : 2000;
      const maxY = isSuborbital ? 100 : 500;
      
      const scrollRef = useRef(null);

      const mapX = (x) => 50 + (x / maxX) * 850;
      const mapY = (y) => 260 - (y / maxY) * 220; 

      const { curve, tMaxQ, tKarman, tMeco } = trajData;
      const curvePoints = curve.getPoints(100);
      const svgPath = curvePoints.map(p => `${mapX(p.x)},${mapY(p.y)}`).join(' ');

      const milestones = isSuborbital ? [
        { label: "MAX-Q", alt: "15 km", t: tMaxQ, align: "start", dx: 12, dy: 14 },
        { label: "APOGEE", alt: "100 km", t: 0.5, align: "middle", dx: 0, dy: -16 }
      ] : [
        { label: "MAX-Q", alt: "15 km", t: tMaxQ, align: "start", dx: 14, dy: 12 },
        { label: "KARMAN LINE", alt: "100 km", t: tKarman, align: "start", dx: 14, dy: 4 },
        { label: "MECO / SEP", alt: "150 km", t: tMeco, align: "start", dx: 14, dy: -12 },
        { label: "ORBIT", alt: "500 km", t: 1.0, align: "end", dx: -12, dy: -16 }
      ];

      const t = Math.max(0, Math.min(1, progress / 100));
      const currentPoint = curve.getPoint(t);
      const rocketPx = mapX(currentPoint.x);
      const rocketPy = mapY(currentPoint.y);
      
      let rotation = 0;
      if (t < 1) {
        const tangent = curve.getTangent(t).normalize();
        rotation = Math.atan2(-tangent.y, tangent.x) * (180 / Math.PI); 
      }

      const isMeco = t >= trajData.tMeco;
      const dt = isMeco ? t - trajData.tMeco : 0;
      const driftX = isMeco ? dt * 250 : 0;
      const driftY = isMeco ? dt * dt * 2000 : 0; 
      const boosterVisible = dt < 0.15; 
      const plumePulse = isMeco ? 0 : 0.8 + Math.sin(progress * 0.5) * 0.4;

      useEffect(() => {
        if (scrollRef.current) {
          const containerHalfWidth = scrollRef.current.clientWidth / 2;
          scrollRef.current.scrollLeft = rocketPx - containerHalfWidth;
        }
      }, [rocketPx]);

      return (
        <div ref={scrollRef} className="w-full h-[550px] bg-[#091321] relative overflow-x-auto overflow-y-hidden touch-pan-x flex justify-start md:justify-center no-scrollbar pointer-events-auto">
          <div className="min-w-[850px] w-full h-full relative flex items-center justify-center pointer-events-none">

              <line x1="50" y1="260" x2="900" y2="260" stroke="#1e293b" strokeWidth="2" />
              <line x1="50" y1="40" x2="50" y2="260" stroke="#1e293b" strokeWidth="2" />
              <line x1="50" y1="150" x2="900" y2="150" stroke="#0f172a" strokeWidth="1" />
              
              {maxY >= 100 && (
                <g>
                  <line x1="50" y1={mapY(100)} x2="900" y2={mapY(100)} stroke="#334155" strokeDasharray="4 4" strokeWidth="1" />
                  <text x="900" y={mapY(100) - 6} fill="#64748b" fontSize="12" textAnchor="end" className="font-mono">KARMAN LINE (100km)</text>
                </g>
              )}
              
              <text x="40" y="265" fill="#475569" fontSize="12" textAnchor="end" className="font-mono">0km</text>
              <text x="40" y="45" fill="#475569" fontSize="12" textAnchor="end" className="font-mono">{maxY}km</text>
              <text x="900" y="280" fill="#475569" fontSize="12" textAnchor="end" className="font-mono">Downrange ({maxX}km)</text>

              <polyline points={svgPath} fill="none" stroke="#c026d3" strokeWidth="3" />

              {milestones.map((m, idx) => {
                const pt = curve.getPoint(m.t);
                const px = mapX(pt.x);
                const py = mapY(pt.y);
                return (
                  <g key={idx}>
                    <circle cx={px} cy={py} r="5" fill="#38bdf8" stroke="#091321" strokeWidth="2" />
                    <text 
                      x={px + m.dx} 
                      y={py + m.dy} 
                      fill="#94a3b8" 
                      fontSize="12" 
                      textAnchor={m.align} 
                      className="font-mono font-bold"
                    >
                      {m.label} ({m.alt})
                    </text>
                  </g>
                );
              })}

              <line x1={rocketPx} y1={rocketPy} x2={rocketPx} y2="260" stroke="#38bdf8" strokeDasharray="3 3" opacity="0.5" strokeWidth="1.5" />
              <ellipse cx={rocketPx} cy="260" rx="6" ry="2" fill="#38bdf8" opacity="0.8" />

              <g transform={`translate(${rocketPx}, ${rocketPy - 30})`}>
                <rect x="-32" y="-12" width="64" height="22" rx="4" fill="#091321" stroke="#38bdf8" strokeWidth="1" opacity="0.95" />
                <text x="0" y="4" fill="#38bdf8" fontSize="12" fontWeight="bold" textAnchor="middle" className="font-mono">{currentAlt} km</text>
              </g>
              
              <g transform={`translate(${rocketPx}, ${rocketPy}) rotate(${rotation})`}>
                <polygon points="5,-4 16,0 5,4" fill="#f8fafc" />
                {boosterVisible && (
                  <g transform={`translate(${-driftX}, ${driftY})`}>
                    <polygon points="-8,-4 5,-4 5,4 -8,4" fill="#94a3b8" />
                    <rect x="-11" y="-2" width="3" height="4" fill="#cbd5e1" />
                    {!isMeco && <polygon points="-11,-3 -20,0 -11,3" fill="#c026d3" opacity={0.6 * plumePulse} />}
                  </g>
                )}
              </g>
            </svg>
          </div>
        </div>
      );
    }

    function TelemetryArcViewer3D({ rocket, progress, trajData }) {
      const mountRef = useRef(null);
      const sceneRef = useRef({});

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;
        const currentContainer = container;

        const w = currentContainer.clientWidth;
        const h = currentContainer.clientHeight || 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x091321);

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        currentContainer.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        let camPos = new THREE.Vector3();
        let targetPos = new THREE.Vector3();

        if (rocket.missionType === 'Suborbital') {
          camPos.set(50, 60, 180);
          targetPos.set(50, 50, 0);
        } else {
          camPos.set(1000, 300, 2200);
          targetPos.set(1000, 250, 0);
        }

        camera.position.copy(camPos);
        controls.target.copy(targetPos);
        controls.update();

        const { curve, tMaxQ, tKarman, tMeco } = trajData;
        const curvePoints = curve.getPoints(100);
        const lineGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xc026d3, linewidth: 2 });
        const curveLine = new THREE.Line(lineGeo, lineMat);
        scene.add(curveLine);

        const markerScale = rocket.missionType === 'Suborbital' ? 4 : 40; 
        const { group: markerMesh, stage1, plume } = createTelemetryRocket(markerScale * 0.15, rocket.missionType === 'heavy' ? 'heavy' : 'medium');
        markerMesh.rotation.x = Math.PI / 2;
        
        const markerGroup = new THREE.Group();
        markerGroup.add(markerMesh);
        scene.add(markerGroup);

        const gridScale = rocket.missionType === 'Suborbital' ? 200 : 4000;
        const grid = new THREE.GridHelper(gridScale, 40, 0x1e293b, 0x0f172a);
        scene.add(grid);

        const plumbMat = new THREE.LineDashedMaterial({ color: 0x38bdf8, dashSize: markerScale, gapSize: markerScale, transparent: true, opacity: 0.6 });
        const plumbGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
        const plumbLine = new THREE.Line(plumbGeo, plumbMat);
        scene.add(plumbLine);

        const reticleGeo = new THREE.RingGeometry(markerScale * 0.8, markerScale * 1.2, 32);
        const reticleMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
        const groundReticle = new THREE.Mesh(reticleGeo, reticleMat);
        groundReticle.rotation.x = -Math.PI / 2;
        scene.add(groundReticle);

        const makeTextSprite = (text, color = '#38bdf8') => {
          const canvas = document.createElement('canvas');
          canvas.width = 512; canvas.height = 128;
          const ctx = canvas.getContext('2d');
          
          ctx.fillStyle = 'rgba(9, 19, 33, 0.85)';
          ctx.strokeStyle = '#233247';
          ctx.lineWidth = 4;
          ctx.beginPath();
          const x = 12, y = 12, w = 488, h = 104, r = 20;
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = color;
          ctx.font = 'bold 44px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(text, 256, 64);

          const texture = new THREE.CanvasTexture(canvas);
          const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
          const sprite = new THREE.Sprite(material);
          sprite.scale.set(markerScale * 6.0, markerScale * 1.5, 1);
          return sprite;
        };

        const gateGeo = new THREE.TorusGeometry(markerScale * 1.5, markerScale * 0.08, 12, 32);
        
        const posMaxQ = curve.getPoint(tMaxQ);
        const tanMaxQ = curve.getTangent(tMaxQ).normalize();
        const gateMaxQ = new THREE.Mesh(gateGeo, new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.35 }));
        gateMaxQ.position.copy(posMaxQ);
        gateMaxQ.lookAt(posMaxQ.clone().add(tanMaxQ));
        scene.add(gateMaxQ);
        const spriteMaxQ = makeTextSprite('MAX-Q: 15 km', '#22d3ee');
        spriteMaxQ.position.copy(posMaxQ.clone().add(new THREE.Vector3(0, markerScale * 2.2, 0)));
        scene.add(spriteMaxQ);

        const posKarman = curve.getPoint(tKarman);
        const tanKarman = curve.getTangent(tKarman).normalize();
        const gateKarman = new THREE.Mesh(gateGeo, new THREE.MeshBasicMaterial({ color: 0xc026d3, transparent: true, opacity: 0.35 }));
        gateKarman.position.copy(posKarman);
        gateKarman.lookAt(posKarman.clone().add(tanKarman));
        scene.add(gateKarman);
        const labelKarman = rocket.missionType === 'Suborbital' ? 'APOGEE: 100 km' : 'KARMAN: 100 km';
        const spriteKarman = makeTextSprite(labelKarman, '#c026d3');
        spriteKarman.position.copy(posKarman.clone().add(new THREE.Vector3(0, markerScale * 2.2, 0)));
        scene.add(spriteKarman);

        if (rocket.missionType !== 'Suborbital') {
          const posMeco = curve.getPoint(tMeco);
          const tanMeco = curve.getTangent(tMeco).normalize();
          const gateMeco = new THREE.Mesh(gateGeo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35 }));
          gateMeco.position.copy(posMeco);
          gateMeco.lookAt(posMeco.clone().add(tanMeco));
          scene.add(gateMeco);
          const spriteMeco = makeTextSprite('MECO: 150 km', '#38bdf8');
          spriteMeco.position.copy(posMeco.clone().add(new THREE.Vector3(0, markerScale * 2.2, 0)));
          scene.add(spriteMeco);
        }

        sceneRef.current = { curve, markerGroup, plumbLine, groundReticle, stage1, plume, tMeco, lastT: 0 };

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          controls.update();

          if (sceneRef.current.plume) {
            const { plume, stage1, tMeco, lastT } = sceneRef.current;
            if (lastT >= tMeco) {
              const dt = lastT - tMeco;
              plume.scale.setScalar(0.001); 
              
              stage1.position.y = -dt * (rocket.missionType === 'Suborbital' ? 80 : 300); 
              stage1.position.z = dt * dt * (rocket.missionType === 'Suborbital' ? 400 : 1500); 
              stage1.visible = dt < 0.15; 
            } else {
              const p = 0.8 + Math.sin(Date.now() * 0.015) * 0.3; 
              plume.scale.setScalar(p);
              stage1.position.set(0, 0, 0);
              stage1.visible = true;
            }
          }

          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!currentContainer) return;
          camera.aspect = currentContainer.clientWidth / currentContainer.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(currentContainer.clientWidth, currentContainer.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          if (currentContainer && currentContainer.contains(renderer.domElement)) {
            currentContainer.removeChild(renderer.domElement);
          }
          
          scene.traverse((object) => {
            if (object.geometry) object.geometry.dispose();
            if (object.material) {
              if (object.material.map) object.material.map.dispose();
              if (Array.isArray(object.material)) object.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
              else object.material.dispose();
            }
          });
          
          renderer.dispose();
        };
      }, [rocket.id]); 

      useEffect(() => {
        const { curve, markerGroup, plumbLine, groundReticle } = sceneRef.current;
        if (curve && markerGroup && plumbLine && groundReticle) {
          const t = Math.max(0, Math.min(1, progress / 100));
          sceneRef.current.lastT = t; 

          const position = curve.getPoint(t);
          
          const positions = plumbLine.geometry.attributes.position.array;
          positions[0] = position.x; positions[1] = position.y; positions[2] = position.z;
          positions[3] = position.x; positions[4] = 0.1;        positions[5] = position.z;
          plumbLine.geometry.attributes.position.needsUpdate = true;
          plumbLine.computeLineDistances(); 
          
          groundReticle.position.set(position.x, 0.2, position.z);
          
          if (t < 1) {
            const tangent = curve.getTangent(t).normalize();
            markerGroup.position.copy(position);
            const lookAtTarget = position.clone().add(tangent);
            markerGroup.lookAt(lookAtTarget);
          } else {
            markerGroup.position.copy(position);
          }
        }
      }, [progress]);

      return <div ref={mountRef} className="w-full h-[550px]" />;
    }

    function TelemetryOrbitViewer3D({ rocket, progress, isFlightPlaying }) {
      const mountRef = useRef(null);
      const sceneRef = useRef({});
      const progressRef = useRef(progress);

      useEffect(() => { progressRef.current = progress; }, [progress]);
      useEffect(() => { sceneRef.current.isFlightPlaying = isFlightPlaying; }, [isFlightPlaying]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;
        const currentContainer = container;

        const w = currentContainer.clientWidth;
        const h = currentContainer.clientHeight || 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x091321);

        // 1. REAL CAMERA (Used for rendering)
        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.domElement.style.touchAction = 'none';
        currentContainer.appendChild(renderer.domElement);

        // 2. EARTH CONTROLS (Used only during Ascent & Idle for standard dragging)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.enableRotate = true; 
        controls.enableZoom = true;
        controls.minDistance = 2; 
        controls.maxDistance = 250; 

        // 3. PROXY ORBIT CONTROLS (Used to track user dragging without fighting orbital physics)
        const dummyCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 10000);
        dummyCamera.position.set(0, 40, 0); 
        const dummyControls = new THREE.OrbitControls(dummyCamera, renderer.domElement);
        dummyControls.enableDamping = true;
        dummyControls.enablePan = false;
        dummyControls.minDistance = 2; 
        dummyControls.maxDistance = 250; 
        dummyControls.maxPolarAngle = Math.PI / 4; 

        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        const earthRadius = 25;
        const coreGeo = new THREE.SphereGeometry(earthRadius, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x07101c });
        earthGroup.add(new THREE.Mesh(coreGeo, coreMat));

        const wireMat = new THREE.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.8 });
        const wireGeo = new THREE.EdgesGeometry(new THREE.SphereGeometry(earthRadius, 16, 16));
        earthGroup.add(new THREE.LineSegments(wireGeo, wireMat));

        const texLoader = new THREE.TextureLoader();
        texLoader.crossOrigin = 'anonymous';
        texLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png', (texture) => {
          const mapMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, color: 0x38bdf8 });
          const mapMesh = new THREE.Mesh(new THREE.SphereGeometry(earthRadius + 0.02, 32, 32), mapMat);
          mapMesh.rotation.y = -Math.PI / 2; 
          earthGroup.add(mapMesh);
        });

        const eqGeo = new THREE.RingGeometry(earthRadius + 0.25, earthRadius + 0.5, 64);
        const eqMat = new THREE.MeshBasicMaterial({ color: 0x334155, side: THREE.DoubleSide });
        const equator = new THREE.Mesh(eqGeo, eqMat);
        equator.rotation.x = Math.PI / 2;
        earthGroup.add(equator);

        const latRad = 45.3056 * (Math.PI / 180);
        const lonRad = -60.9814 * (Math.PI / 180);
        const cx = earthRadius * Math.cos(latRad) * Math.sin(lonRad);
        const cy = earthRadius * Math.sin(latRad);
        const cz = earthRadius * Math.cos(latRad) * Math.cos(lonRad);
        const padPos = new THREE.Vector3(cx, cy, cz);
        
        const padMesh = new THREE.Mesh(new THREE.SphereGeometry(0.375, 8, 8), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
        padMesh.position.copy(padPos);
        earthGroup.add(padMesh);

        let inc = 90;
        if (rocket.orbit.includes('98')) inc = 98.1;
        if (rocket.orbit.includes('87')) inc = 87.9;
        
        const orbitRadius = earthRadius + 3; 
        
        const orbitGroup = new THREE.Group();
        orbitGroup.lookAt(padPos);
        const azimuthTilt = (inc - 90) * (Math.PI / 180);
        orbitGroup.rotateZ(azimuthTilt);
        earthGroup.add(orbitGroup);

        const insertionAngle = 0.25;

        const ascentPoints = [];
        for (let i = 0; i <= 64; i++) {
          const t_val = i / 64;
          const alt = earthRadius + Math.sin(t_val * Math.PI / 2) * 3;
          const a = t_val * insertionAngle;
          ascentPoints.push(new THREE.Vector3(0, -alt * Math.sin(a), alt * Math.cos(a)));
        }
        const ascentGeo = new THREE.BufferGeometry().setFromPoints(ascentPoints);
        const ascentMat = new THREE.LineDashedMaterial({ color: 0x22d3ee, dashSize: 0.2, gapSize: 0.2, transparent: true, opacity: 0.7 });
        const ascentLine = new THREE.Line(ascentGeo, ascentMat);
        ascentLine.computeLineDistances();
        orbitGroup.add(ascentLine);

        const pathPoints = [];
        for (let i = 0; i <= 128; i++) {
          const a = (i / 128) * Math.PI * 2;
          pathPoints.push(new THREE.Vector3(0, -orbitRadius * Math.sin(a), orbitRadius * Math.cos(a)));
        }
        const lineGeo = new THREE.BufferGeometry().setFromPoints(pathPoints);
        const lineMat = new THREE.LineDashedMaterial({ color: 0xc026d3, transparent: true, opacity: 0.4, dashSize: 0.5, gapSize: 0.5 });
        const orbitLine = new THREE.Line(lineGeo, lineMat);
        orbitLine.computeLineDistances();
        orbitGroup.add(orbitLine);

        const rocketPivot = new THREE.Group();
        orbitGroup.add(rocketPivot);

        const { group: rocketMesh, stage1, plume } = createTelemetryRocket(0.25, rocket.missionType === 'heavy' ? 'heavy' : 'medium');
        rocketPivot.add(rocketMesh);

        const shadowGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const shadowMat = new THREE.MeshBasicMaterial({ color: 0xf472b6 }); 
        const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
        shadowMesh.position.set(0, 0, earthRadius + 0.05); 
        rocketPivot.add(shadowMesh);

        camera.position.set(-50, 45, 35);
        controls.target.set(0, 0, 0);

        const tMeco = rocket.missionType === 'Suborbital' ? 0.5 : getTrajectoryData(false).tMeco;

        sceneRef.current = { 
          rocketPivot, 
          rocketMesh, 
          stage1, 
          plume, 
          tMeco,
          insertionAngle, 
          autoOrbitAngle: insertionAngle, 
          earthRadius,
          padPos,
          lastT: 0,
          isTransitioning: false,
          isFlightPlaying: isFlightPlaying
        };

        const breakTransition = () => { if (sceneRef.current) sceneRef.current.isTransitioning = false; };
        renderer.domElement.addEventListener('pointerdown', breakTransition);
        renderer.domElement.addEventListener('wheel', breakTransition, { passive: true });
        renderer.domElement.addEventListener('touchstart', breakTransition, { passive: true });

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          earthGroup.rotation.y += 0.0005; 
          
          if (sceneRef.current.rocketPivot) {
             const t = Math.max(0, Math.min(1, progressRef.current / 100));
             const { rocketPivot, rocketMesh, insertionAngle, earthRadius, padPos, plume, stage1, tMeco, lastT } = sceneRef.current;
             
             if (lastT >= tMeco) {
               const dt = lastT - tMeco;
               plume.scale.setScalar(0.001);
               stage1.position.y = -dt * 15; 
               stage1.position.z = -dt * dt * 100; 
               stage1.visible = dt < 0.12; 
             } else {
               const p = 0.8 + Math.sin(Date.now() * 0.015) * 0.3;
               plume.scale.setScalar(p);
               stage1.position.set(0, 0, 0);
               stage1.visible = true;
             }

             if (t < 1) {
               rocketPivot.rotation.x = t * insertionAngle;
               const alt = earthRadius + Math.sin(t * Math.PI / 2) * 3;
               rocketMesh.position.set(0, 0, alt);
               rocketMesh.rotation.x = (Math.PI / 2) + (t * (Math.PI / 2));
               sceneRef.current.autoOrbitAngle = insertionAngle;
             } else {
               if (sceneRef.current.isFlightPlaying) {
                   sceneRef.current.autoOrbitAngle += 0.0025; 
               }
               rocketPivot.rotation.x = sceneRef.current.autoOrbitAngle;
               rocketMesh.position.set(0, 0, orbitRadius);
               rocketMesh.rotation.x = Math.PI; 
             }

             rocketPivot.updateMatrixWorld(true);
             rocketMesh.updateMatrixWorld(true);
             const currentRocketPos = new THREE.Vector3();
             rocketMesh.getWorldPosition(currentRocketPos);

             if (sceneRef.current.lastT < 1 && t >= 1) sceneRef.current.isTransitioning = true;
             if (sceneRef.current.lastT >= 1 && t < 1) sceneRef.current.isTransitioning = true;
             if (t === 0 && sceneRef.current.lastT > 0) sceneRef.current.isTransitioning = true;

             if (t < 1) {
                 controls.enabled = true;
                 dummyControls.enabled = false;
                 
                 camera.up.lerp(new THREE.Vector3(0, 1, 0), 0.1);
                 controls.maxPolarAngle = Math.PI / 2 - 0.05;

                 if (sceneRef.current.isTransitioning) {
                     const relativeOffset = new THREE.Vector3(-50, 45, 35).sub(padPos);
                     relativeOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), earthGroup.rotation.y);
                     
                     camera.position.lerp(padPos.clone().add(relativeOffset), 0.05);
                     controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.05);
                     camera.lookAt(controls.target);
                     
                     if (controls.target.distanceTo(new THREE.Vector3(0, 0, 0)) < 0.5) sceneRef.current.isTransitioning = false;
                 } else {
                     controls.update(); 
                 }
             } else {
                 controls.enabled = false;
                 dummyControls.enabled = true;
                 dummyControls.update(); 
                 
                 const dummyPos = dummyCamera.position;
                 const localOffset = new THREE.Vector3(dummyPos.x, -dummyPos.z, dummyPos.y);
                 const targetCamWorld = rocketPivot.localToWorld(localOffset);
                 
                 const upVector = rocketPivot.localToWorld(new THREE.Vector3(0,0,1)).sub(rocketPivot.getWorldPosition(new THREE.Vector3())).normalize();

                 if (sceneRef.current.isTransitioning) {
                     camera.position.lerp(targetCamWorld, 0.05);
                     camera.up.lerp(upVector, 0.05);
                     
                     const lookTarget = controls.target.clone().lerp(currentRocketPos, 0.05);
                     controls.target.copy(lookTarget);
                     camera.lookAt(lookTarget);
                     
                     if (camera.position.distanceTo(targetCamWorld) < 1.0) sceneRef.current.isTransitioning = false;
                 } else {
                     camera.position.copy(targetCamWorld);
                     camera.up.copy(upVector);
                     controls.target.copy(currentRocketPos);
                     camera.lookAt(currentRocketPos);
                 }
             }
             sceneRef.current.lastT = t;
          }
          
          const minCamRadius = 25.5; 
          if (camera.position.length() < minCamRadius) {
              camera.position.copy(camera.position.clone().normalize().multiplyScalar(minCamRadius));
          }

          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!currentContainer) return;
          camera.aspect = currentContainer.clientWidth / currentContainer.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(currentContainer.clientWidth, currentContainer.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          renderer.domElement.removeEventListener('pointerdown', breakTransition);
          renderer.domElement.removeEventListener('wheel', breakTransition);
          renderer.domElement.removeEventListener('touchstart', breakTransition);

          if (currentContainer && currentContainer.contains(renderer.domElement)) {
            currentContainer.removeChild(renderer.domElement);
          }
          
          scene.traverse((object) => {
            if (object.geometry) object.geometry.dispose();
            if (object.material) {
              if (object.material.map) object.material.map.dispose();
              if (Array.isArray(object.material)) object.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
              else object.material.dispose();
            }
          });
          
          renderer.dispose();
        };
      }, [rocket.id]); 

      return <div ref={mountRef} className="w-full h-[550px]" />;
    }

                    <div className="space-y-4">
                      <div className="flex justify-between items-start">
                        <span className="text-[10px] font-mono font-bold text-cyan-400 bg-cyan-400/10 border border-cyan-400/20 px-2 py-1 rounded-md">NET {r.targetDate}</span>
                        <span className="text-[10px] text-emerald-400 font-bold bg-emerald-400/10 px-2 py-1 rounded-md uppercase">{r.status}</span>
                      </div>
                      <div>
                        <h3 className="text-xl font-bold text-white leading-tight">{r.name}</h3>
                        <p className="text-sm text-slate-400 font-mono mt-1">{r.operator}</p>
                      </div>
                      <div className="space-y-2 text-xs text-slate-400 pt-4 border-t border-[#233247] font-mono">
                        <div className="flex justify-between"><span>Class:</span><span className="text-slate-200 font-bold">{r.missionType.toUpperCase()}</span></div>
                        <div className="flex justify-between"><span>Propellant Load:</span><span className="text-slate-200 font-bold">{r.propellantTons} Metric Tons</span></div>
                        <div className="flex justify-between"><span>Payload Capacity:</span><span className="text-slate-200 font-bold">{r.payloadKg.toLocaleString()} kg</span></div>
                        <div className="flex justify-between"><span>Trajectory Profile:</span><span className="text-slate-200 font-bold">{r.orbit}</span></div>
                      </div>
                    </div>
                    <div className="mt-8 flex flex-col sm:flex-row gap-3">
                      <button onClick={() => { setSelectedRocketId(r.id); setActiveTab('safety'); }} className="flex-1 py-2.5 bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 border border-slate-700 text-cyan-400 text-xs font-bold rounded-xl transition shadow-lg flex justify-center items-center gap-2">
                        <IconRadar /> Safety Matrix
                      </button>
                      <button onClick={() => { setSelectedRocketId(r.id); setFlightProgress(0); setIsFlightPlaying(false); setActiveTab('telemetry'); }} className="flex-1 py-2.5 bg-slate-800 hover:bg-fuchsia-500 hover:text-white border border-slate-700 text-fuchsia-400 text-xs font-bold rounded-xl transition shadow-lg flex justify-center items-center gap-2">
                        <IconActivity /> Track Arc
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'development' && (
              <div className="space-y-6">
                <div className="bg-cyan-400/10 border border-cyan-400/20 p-5 rounded-2xl text-xs text-slate-300 flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between shadow-lg">
                  <span>Site Location: <strong className="text-white">Guysborough County / Canso, Nova Scotia</strong></span>
                  <span className="text-cyan-400 font-mono font-bold">Orbital Inclinations: 45.1° (LEO) to 98.1° (SSO)</span>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  {SPACEPORT_FACILITIES.map((f, i) => (
                    <div key={i} className="bg-[#111a28] border border-[#233247] rounded-2xl p-6 space-y-4 shadow-xl">
                      <div className="flex justify-between items-center text-[10px] font-mono font-bold uppercase">
                        <span className="px-2.5 py-1 rounded-md bg-slate-800 text-slate-300">{f.tag}</span>
                        <span className="text-cyan-400">{f.progress}%</span>
                      </div>
                      <h3 className="text-sm font-bold text-white leading-snug">{f.name}</h3>
                      <p className="text-xs text-slate-400 leading-relaxed">{f.desc}</p>
                      <div className="w-full bg-[#080d16] h-2.5 rounded-full overflow-hidden border border-slate-800">
                        <div className={`h-full transition-all duration-1000 ${f.progress === 100 ? 'bg-emerald-400' : 'bg-cyan-400'}`} style={{ width: `${f.progress}%` }} />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <footer className="mt-12 pt-8 border-t border-[#233247] flex flex-col md:flex-row justify-between items-center gap-4 text-xs font-mono text-slate-500">
              <span>Spaceport Nova Scotia Safety Operations • Maritime Launch Services</span>
              <button 
                onClick={() => aboutModalRef.current.showModal()}
                className="hover:text-cyan-400 transition underline underline-offset-4 flex items-center gap-2"
              >
                <IconInfo /> Data & Models Disclaimer
              </button>
            </footer>

            <dialog 
              ref={aboutModalRef} 
              onClick={(e) => { if (e.target === aboutModalRef.current) aboutModalRef.current.close(); }}
              className="bg-[#111a28] border border-[#233247] rounded-2xl shadow-2xl p-0 w-11/12 max-w-2xl text-slate-300 m-auto backdrop:bg-[#020617]/80 backdrop:backdrop-blur-sm"
            >
              <div className="p-5 border-b border-[#233247] flex justify-between items-center sticky top-0 bg-[#111a28] z-10">
                <h2 className="text-lg font-bold text-white flex items-center gap-2">
                  <IconInfo /> About Data & Models
                </h2>
                <button 
                  onClick={() => aboutModalRef.current.close()}
                  className="text-slate-500 hover:text-cyan-400 transition p-1 bg-slate-900 rounded-md border border-[#233247]"
                  title="Close"
                >
                  <IconX />
                </button>
              </div>
              <div className="p-6 text-sm text-slate-400 space-y-6 overflow-y-auto max-h-[70vh] no-scrollbar">
                <p>
                  This independent reference explorer is designed to visualize the Canso launch complex operations. It is not an official feed operated by Maritime Launch Services.
                </p>
                
                <div>
                  <h3 className="text-white font-bold mb-2">Proximity Safety Model</h3>
                  <p className="leading-relaxed">
                    The four hazard rings (Blast, Overpressure, Acoustic, NOTMAR) are generated using Hopkinson-Cranz cube-root scaling laws. The formula calculates safe scaling distances based on the TNT-equivalent yield of the propellant load in metric tons.
                  </p>
                  <p className="mt-2 text-xs text-slate-500 font-mono">
                    d = Z &times; &#8731;W <br/>
                    (where Z is the scaled distance factor and W is propellant mass)
                  </p>
                  <p className="mt-3 leading-relaxed text-amber-500/80">
                    Warning: These calculations do not model terrain, specific propellant chemistry, localized weather patterns, or official marine exclusion zones. Always adhere to official NOTMAR/NOTAM broadcast closures during launch campaigns.
                  </p>
                </div>

                <div>
                  <h3 className="text-white font-bold mb-2">Flight Simulation</h3>
                  <p className="leading-relaxed">
                    The 3D telemetry arcs utilize a Catmull-Rom spline approximation (Three.js CatmullRomCurve3) to interpolate trajectory profiles based on standard suborbital and polar low-earth orbit (LEO) pitch-over parameters. Progress speed, altitude, and velocity readouts are kinematic estimations and do not represent live telemetry data.
                  </p>
                </div>

                <div>
                  <h3 className="text-white font-bold mb-2">Location Privacy</h3>
                  <p className="leading-relaxed">
                    When you select "Live GPS" to calculate proximity to Launch Complex 1, your latitude and longitude coordinates are processed entirely locally within your browser using JavaScript's Haversine formula. Your location data is never logged, stored, or transmitted to any external server.
                  </p>
                </div>
              </div>
            </dialog>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SpaceportApp />);
  </script>
</body>
</html>
