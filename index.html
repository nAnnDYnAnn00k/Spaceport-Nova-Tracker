    const { useState, useEffect, useRef, useMemo } = React;

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function calculateRadii(propellantTons) {
      const cbrt = Math.cbrt(Math.max(propellantTons, 0.2));
      return { blastRadius: Number((0.5 * cbrt).toFixed(2)), overpressureRadius: Number((1.1 * cbrt).toFixed(2)), acousticRadius: Number((1.9 * cbrt).toFixed(2)), notmarRadius: Number((3.6 * cbrt).toFixed(2)) };
    }

    function getSafetyStatus(distanceKm, radii) {
      if (distanceKm < radii.blastRadius) return { level: "LETHAL HAZARD", color: "bg-red-950/80 border-red-500 text-red-200", badge: "bg-red-600", text: "INSIDE PRIMARY BLAST ZONE: Catastrophic deflagration & fragmentation perimeter." };
      if (distanceKm < radii.overpressureRadius) return { level: "HIGH HAZARD", color: "bg-orange-950/80 border-orange-500 text-orange-200", badge: "bg-orange-600", text: "INSIDE OVERPRESSURE RANGE: Risk of blast wave injury and window failure." };
      if (distanceKm < radii.acousticRadius) return { level: "RESTRICTED", color: "bg-yellow-950/80 border-yellow-500 text-yellow-200", badge: "bg-yellow-600", text: "ACOUSTIC WARNING: Sound pressure exceeds 140 dB. Mandatory ear protection." };
      if (distanceKm < radii.notmarRadius) return { level: "CAUTION", color: "bg-blue-950/80 border-blue-500 text-blue-200", badge: "bg-blue-600", text: "INSIDE NOTICE TO MARINERS (NOTMAR) BUFFER: Closed to marine and fishing vessels." };
      return { level: "SAFE OBSERVATION", color: "bg-emerald-950/80 border-emerald-500 text-emerald-200", badge: "bg-emerald-600", text: "You are outside all critical hazard boundaries. Safe public observation sector." };
    }

    const getTrajectoryData = (isSuborbital) => {
      const points = isSuborbital ? [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(15, 50, 0),
        new THREE.Vector3(50, 100, 0),
        new THREE.Vector3(85, 50, 0),
        new THREE.Vector3(100, 0, 0)
      ] : [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(20, 150, 0),
        new THREE.Vector3(200, 400, 0),
        new THREE.Vector3(1000, 500, 0),
        new THREE.Vector3(2000, 500, 0)
      ];
      
      const curve = new THREE.CatmullRomCurve3(points);
      
      const findT = (targetY, maxScanT = 1) => {
        let bestT = 0, minDiff = Infinity;
        for (let time = 0; time <= maxScanT; time += 0.005) {
          const y = curve.getPoint(time).y;
          const diff = Math.abs(y - targetY);
          if (diff < minDiff) { minDiff = diff; bestT = time; }
        }
        return bestT;
      };

      return {
        curve,
        tMaxQ: findT(15, 0.4),
        tKarman: isSuborbital ? 0.5 : findT(100, 0.6),
        tMeco: isSuborbital ? 0.5 : findT(150, 0.8)
      };
    };

    const createTelemetryRocket = (scale, type) => {
      const group = new THREE.Group();
      
      const matBody = new THREE.MeshBasicMaterial({ color: 0xf8fafc });
      const matDark = new THREE.MeshBasicMaterial({ color: 0x1e293b });
      const matAccent = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const matSteel = new THREE.MeshBasicMaterial({ color: 0x94a3b8 });
      
      const stage2 = new THREE.Group();
      const s2Body = new THREE.Mesh(new THREE.CylinderGeometry(1.4 * scale, 1.4 * scale, 2.4 * scale, 20), matBody);
      s2Body.position.y = 0.8 * scale;
      const fairingBase = new THREE.Mesh(new THREE.CylinderGeometry(1.55 * scale, 1.4 * scale, 0.8 * scale, 20), matAccent);
      fairingBase.position.y = 2.4 * scale;
      const nose = new THREE.Mesh(new THREE.ConeGeometry(1.55 * scale, 3.2 * scale, 20), type === 'heavy' ? matDark : matBody);
      nose.position.y = 4.4 * scale; 
      const s2Nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.4 * scale, 0.85 * scale, 0.9 * scale, 16), matSteel);
      s2Nozzle.position.y = -0.6 * scale;
      
      const s2PlumeGroup = new THREE.Group();
      const s2OuterMat = new THREE.MeshBasicMaterial({ color: 0xc026d3, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false });
      const s2InnerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
      const s2Outer = new THREE.Mesh(new THREE.ConeGeometry(1.4 * scale, 4.5 * scale, 16), s2OuterMat);
      s2Outer.rotation.x = Math.PI;
      s2Outer.position.y = -2.8 * scale;
      const s2Inner = new THREE.Mesh(new THREE.ConeGeometry(0.6 * scale, 2.5 * scale, 16), s2InnerMat);
      s2Inner.rotation.x = Math.PI;
      s2Inner.position.y = -1.8 * scale;
      s2PlumeGroup.add(s2Outer, s2Inner);
      s2PlumeGroup.visible = false;

      stage2.add(s2Body, fairingBase, nose, s2Nozzle, s2PlumeGroup);
      
      const stage1 = new THREE.Group();
      const interstage = new THREE.Mesh(new THREE.CylinderGeometry(1.42 * scale, 1.42 * scale, 1.0 * scale, 20), matDark);
      interstage.position.y = -0.9 * scale;
      const core = new THREE.Mesh(new THREE.CylinderGeometry(1.4 * scale, 1.4 * scale, 7.5 * scale, 20), matBody);
      core.position.y = -5.15 * scale;
      const stripe = new THREE.Mesh(new THREE.CylinderGeometry(1.43 * scale, 1.43 * scale, 0.6 * scale, 20), matAccent);
      stripe.position.y = -3.0 * scale;
      
      const skirt = new THREE.Mesh(new THREE.CylinderGeometry(1.4 * scale, 1.55 * scale, 1.0 * scale, 20), matDark);
      skirt.position.y = -9.4 * scale;

      const engineCluster = new THREE.Group();
      engineCluster.position.y = -10.2 * scale;
      const centerNozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.45 * scale, 0.75 * scale, 0.9 * scale, 16), matSteel);
      engineCluster.add(centerNozzle);
      for (let i = 0; i < 4; i++) {
        const ang = (i / 4) * Math.PI * 2;
        const noz = new THREE.Mesh(new THREE.CylinderGeometry(0.3 * scale, 0.5 * scale, 0.8 * scale, 12), matSteel);
        noz.position.set(Math.cos(ang) * 0.75 * scale, 0, Math.sin(ang) * 0.75 * scale);
        engineCluster.add(noz);
      }
      
      const plume = new THREE.Group();
      const plumeOuterMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false });
      const plumeInnerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
      const plumeOuter = new THREE.Mesh(new THREE.ConeGeometry(1.5 * scale, 6.5 * scale, 16), plumeOuterMat);
      plumeOuter.rotation.x = Math.PI;
      plumeOuter.position.y = -3.25 * scale;
      const plumeInner = new THREE.Mesh(new THREE.ConeGeometry(0.75 * scale, 3.8 * scale, 16), plumeInnerMat);
      plumeInner.rotation.x = Math.PI;
      plumeInner.position.y = -1.9 * scale;
      plume.add(plumeOuter, plumeInner);
      plume.position.y = -10.5 * scale;
      
      stage1.add(interstage, core, stripe, skirt, engineCluster, plume);
      group.add(stage1, stage2);
      
      return { group, stage1, stage2, plume, s2Plume: s2PlumeGroup };
    };

    function EnhancedThreeViewer({ year, setBuildYear, orbitalRockets, onHandoff }) {
      const mountRef = useRef(null);
      const phasesRef = useRef({});
      const sceneRocketsRef = useRef({});
      const launchStateRef = useRef({ active: false, time: 0, rocketId: null });
      const cameraLerpRef = useRef(null);
      const camPosLerpRef = useRef(null);
      const onHandoffRef = useRef(onHandoff);
      const yearRef = useRef(year);

      const [isLoading, setIsLoading] = useState(true);
      const [selectedMission, setSelectedMission] = useState(orbitalRockets[0].id);
      const [hoveredFacility, setHoveredFacility] = useState(null);
      const [activePreset, setActivePreset] = useState('overview');
      const [autoOrbit, setAutoOrbit] = useState(false);
      const autoOrbitRef = useRef(false);

      useEffect(() => { onHandoffRef.current = onHandoff; }, [onHandoff]);
      useEffect(() => { yearRef.current = year; }, [year]);
      useEffect(() => { autoOrbitRef.current = autoOrbit; }, [autoOrbit]);

      const focusRocket = (rid, presetName = 'pad') => {
        if (sceneRocketsRef.current && sceneRocketsRef.current[rid]) {
          const rPos = sceneRocketsRef.current[rid].position.clone();
          cameraLerpRef.current = rPos;
          camPosLerpRef.current = rPos.clone().add(new THREE.Vector3(20, 14, 20));
          setActivePreset(presetName);
        }
      };

      const applyCameraPreset = (preset) => {
        setActivePreset(preset);
        if (preset === 'overview') {
          cameraLerpRef.current = new THREE.Vector3(-10, 0, 15);
          camPosLerpRef.current = new THREE.Vector3(55, 45, 60);
        } else if (preset === 'pad') {
          focusRocket(selectedMission, 'pad');
        } else if (preset === 'top') {
          cameraLerpRef.current = new THREE.Vector3(-12, 0, 18);
          camPosLerpRef.current = new THREE.Vector3(-12, 115, 22);
        }
      };

      useEffect(() => {
        if (sceneRocketsRef.current && sceneRocketsRef.current[selectedMission]) {
          const rPos = sceneRocketsRef.current[selectedMission].position.clone();
          cameraLerpRef.current = rPos;
          camPosLerpRef.current = rPos.clone().add(new THREE.Vector3(22, 15, 22));
          setActivePreset('pad');
        }
      }, [selectedMission]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;
        const currentContainer = container; 

        const w = currentContainer.clientWidth;
        const h = currentContainer.clientHeight || 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x091321); 
        scene.fog = new THREE.FogExp2(0x091321, 0.0042);

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
        camera.position.set(55, 45, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.outputEncoding = THREE.sRGBEncoding;
        currentContainer.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI / 2 - 0.03;
        controls.minDistance = 8;
        controls.maxDistance = 180;
        controls.target.set(-10, 0, 15);

        const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x0f172a, 0.75);
        scene.add(hemiLight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.45)); 

        const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.65);
        dirLight.position.set(40, 70, 30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; 
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -65;
        dirLight.shadow.camera.right = 65;
        dirLight.shadow.camera.top = 65;
        dirLight.shadow.camera.bottom = -65;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const launchPointLight = new THREE.PointLight(0x22d3ee, 0, 35);
        scene.add(launchPointLight);

        const matConcrete = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.85, metalness: 0.05 });
        const matRoad = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -1 });
        const matBuilding = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.7, metalness: 0.2 });
        const matSteel = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.8, roughness: 0.25 });
        const matDarkSteel = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.6, roughness: 0.4 });
        const matRocketBody = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2, metalness: 0.1 });
        const matRocketDark = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.25, metalness: 0.3 });
        const matCyanAccent = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.35, roughness: 0.2 });

        const mapUrl = "https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/export?bbox=-61.01,45.29,-60.95,45.32&bboxSR=4326&imageSR=102100&size=1024,1024&format=jpg&f=image";
        const texLoader = new THREE.TextureLoader();
        texLoader.crossOrigin = 'anonymous';
        
        const terrainTex = texLoader.load(
          mapUrl,
          (tex) => { tex.encoding = THREE.sRGBEncoding; setIsLoading(false); }, 
          undefined,                      
          () => { setIsLoading(false); }  
        );
        terrainTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const terrainGeo = new THREE.PlaneGeometry(180, 180, 128, 128); 
        terrainGeo.rotateX(-Math.PI / 2);
        const pos = terrainGeo.attributes.position;
        
        const getElevation = (x, z) => {
          let elev = (Math.sin(x * 0.05) * Math.cos(z * 0.05) * 2);
          if (x > 15) elev -= (x - 15) * 0.15;
          if (z < -15) elev -= (-15 - z) * 0.1;
          return elev;
        };

        for (let i = 0; i < pos.count; i++) {
          pos.setY(i, getElevation(pos.getX(i), pos.getZ(i)));
        }
        terrainGeo.computeVertexNormals();
        
        const terrainMat = new THREE.MeshStandardMaterial({ 
          color: 0xdbeafe, 
          map: terrainTex, 
          roughness: 0.85,
          metalness: 0.05 
        });
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        terrain.receiveShadow = true;
        scene.add(terrain);

        const perimeterCoords = [
          [-45, 55], [15, 55], [28, 25], [30, 5], [26, -15],
          [10, -25], [-10, -28], [-25, -20], [-40, -5], [-45, 55]
        ];
        const perimeterPts = perimeterCoords.map(([px, pz]) => new THREE.Vector3(px, getElevation(px, pz) + 0.35, pz));
        
        const perimeterGeo = new THREE.BufferGeometry().setFromPoints(perimeterPts);
        const perimeterMat = new THREE.LineDashedMaterial({ color: 0xfacc15, dashSize: 2.5, gapSize: 2, linewidth: 2 });
        const perimeterLine = new THREE.Line(perimeterGeo, perimeterMat);
        perimeterLine.computeLineDistances();
        scene.add(perimeterLine);

        const makeFloatingTag = (title, subtitle, accent = '#38bdf8') => {
          const canvas = document.createElement('canvas');
          canvas.width = 512; canvas.height = 140;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = 'rgba(9, 19, 33, 0.88)';
          ctx.strokeStyle = accent;
          ctx.lineWidth = 4;
          ctx.beginPath();
          const x = 10, y = 10, w = 492, h = 120, r = 18;
          ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
          ctx.fill(); ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 30px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(title, 256, 56);

          ctx.fillStyle = accent;
          ctx.font = 'bold 22px monospace';
          ctx.fillText(subtitle, 256, 96);

          const texture = new THREE.CanvasTexture(canvas);
          const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
          const sprite = new THREE.Sprite(material);
          sprite.scale.set(11, 3, 1);
          return sprite;
        };

        const boundaryLabel = makeFloatingTag('335 ACRE CROWN LEASE', 'CANSO SPACEPORT PERIMETER', '#facc15');
        boundaryLabel.scale.set(18, 4.8, 1);
        boundaryLabel.position.set(-22, 9, 48); 
        scene.add(boundaryLabel);

        const water = new THREE.Mesh(
          new THREE.PlaneGeometry(450, 450),
          new THREE.MeshStandardMaterial({ color: 0x06213a, transparent: true, opacity: 0.9, roughness: 0.12, metalness: 0.85 })
        );
        water.rotation.x = -Math.PI / 2;
        water.position.y = -2.4;
        scene.add(water);

        const buildRoadCorridor = (x1, z1, x2, z2, width = 1.4) => {
          const p1 = new THREE.Vector3(x1, getElevation(x1, z1) + 0.08, z1);
          const p2 = new THREE.Vector3(x2, getElevation(x2, z2) + 0.08, z2);
          const dist = p1.distanceTo(p2);
          const mid = p1.clone().add(p2).multiplyScalar(0.5);
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, 0.12, dist), matRoad);
          mesh.position.copy(mid);
          mesh.lookAt(p2);
          mesh.receiveShadow = true;
          return mesh;
        };

        const p2024 = new THREE.Group();
        const p2026 = new THREE.Group();
        const p2028 = new THREE.Group();
        const p2030 = new THREE.Group();
        const p2032 = new THREE.Group();

        const interactables = [];

        const buildHIF = (width, depth, meta) => {
          const group = new THREE.Group();
          const base = new THREE.Mesh(new THREE.BoxGeometry(width, 6.5, depth), matBuilding);
          base.position.y = 3.25;
          base.castShadow = true; base.receiveShadow = true;

          const roof = new THREE.Mesh(new THREE.CylinderGeometry(depth/2, depth/2, width + 0.4, 24, 1, false, 0, Math.PI), matSteel);
          roof.rotation.z = Math.PI / 2;
          roof.position.y = 6.5;
          roof.castShadow = true;

          const door = new THREE.Mesh(new THREE.BoxGeometry(width * 0.5, 4.8, depth + 0.3), matDarkSteel);
          door.position.y = 2.4;

          const accentStripe = new THREE.Mesh(new THREE.BoxGeometry(width + 0.2, 0.4, depth + 0.2), matCyanAccent);
          accentStripe.position.y = 5.6;

          const apron = new THREE.Mesh(new THREE.BoxGeometry(width + 4, 0.2, depth + 12), matConcrete);
          apron.position.set(0, 0.1, 4);
          apron.receiveShadow = true;

          group.add(base, roof, door, accentStripe, apron);
          group.scale.set(0.25, 0.25, 0.25);

          if (meta) {
            base.userData = meta;
            roof.userData = meta;
            interactables.push(base, roof);
          }
          return group;
        };

        const buildPadComplex = (x, z, scale, hasTrench = true, meta = null) => {
          const padGroup = new THREE.Group();
          
          const deck = new THREE.Mesh(new THREE.BoxGeometry(15 * scale, 1.2, 15 * scale), matConcrete);
          deck.position.y = 0.6;
          deck.receiveShadow = true; deck.castShadow = true;
          padGroup.add(deck);

          const padRing = new THREE.Mesh(
            new THREE.RingGeometry(4.2 * scale, 4.8 * scale, 32),
            new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.45 })
          );
          padRing.rotation.x = -Math.PI / 2;
          padRing.position.y = 1.25;
          padGroup.add(padRing);

          if (hasTrench) {
            const trenchGroup = new THREE.Group();
            const trenchWall1 = new THREE.Mesh(new THREE.BoxGeometry(1.2 * scale, 1.6, 17 * scale), matConcrete);
            trenchWall1.position.set(-2.6 * scale, 0.8, 6 * scale);
            const trenchWall2 = new THREE.Mesh(new THREE.BoxGeometry(1.2 * scale, 1.6, 17 * scale), matConcrete);
            trenchWall2.position.set(2.6 * scale, 0.8, 6 * scale);
            const trenchFloor = new THREE.Mesh(new THREE.BoxGeometry(4 * scale, 0.25, 17 * scale), matDarkSteel);
            trenchFloor.position.set(0, 0.12, 6 * scale);
            trenchGroup.add(trenchWall1, trenchWall2, trenchFloor);
            padGroup.add(trenchGroup);
          }

          // Detailed Truss Strongback Tower
          const towerX = 2.6 * scale, towerZ = -2 * scale, towerH = 16.5 * scale;
          const strongbackCore = new THREE.Mesh(new THREE.BoxGeometry(1.2 * scale, towerH, 1.2 * scale), matDarkSteel);
          strongbackCore.position.set(towerX, towerH / 2, towerZ);
          strongbackCore.castShadow = true;
          padGroup.add(strongbackCore);

          const trussCage = new THREE.Mesh(
            new THREE.BoxGeometry(1.7 * scale, towerH, 1.7 * scale, 1, 8, 1),
            new THREE.MeshBasicMaterial({ color: 0xcbd5e1, wireframe: true })
          );
          trussCage.position.set(towerX, towerH / 2, towerZ);
          padGroup.add(trussCage);

          // Umbilical Swing Arms
          [0.45, 0.72, 0.9].forEach((pct) => {
            const arm = new THREE.Mesh(new THREE.BoxGeometry(2.8 * scale, 0.35 * scale, 0.45 * scale), matSteel);
            arm.position.set(towerX - 1.3 * scale, towerH * pct, towerZ + 1.0 * scale);
            padGroup.add(arm);
          });

          // Propellant Farm & Piping
          const tankGeo = new THREE.CylinderGeometry(1.4 * scale, 1.4 * scale, 7.5 * scale, 20);
          const tankMat1 = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.25 }); 
          const tankMat2 = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.45 }); 
          
          const tank1 = new THREE.Mesh(tankGeo, tankMat1);
          tank1.rotation.z = Math.PI / 2;
          tank1.position.set(-10 * scale, 1.8 * scale, -2.5 * scale);
          tank1.castShadow = true;
          
          const tank2 = new THREE.Mesh(tankGeo, tankMat2);
          tank2.rotation.z = Math.PI / 2;
          tank2.position.set(-10 * scale, 1.8 * scale, 2.5 * scale);
          tank2.castShadow = true;

          const pipeRun = new THREE.Mesh(new THREE.CylinderGeometry(0.25 * scale, 0.25 * scale, 9 * scale, 8), matSteel);
          pipeRun.rotation.z = Math.PI / 2;
          pipeRun.position.set(-5 * scale, 1.0 * scale, 0);
          
          padGroup.add(tank1, tank2, pipeRun);

          // Lightning Protection Masts
          const mastGeo = new THREE.CylinderGeometry(0.08, 0.32, 23 * scale, 8); 
          const offset = 6.8 * scale;
          [[-offset, -offset], [offset, -offset], [-offset, offset], [offset, offset]].forEach(([mx, mz]) => {
            const mast = new THREE.Mesh(mastGeo, matSteel);
            mast.position.set(mx, 11.5 * scale, mz);
            mast.castShadow = true;
            padGroup.add(mast);
          });

          padGroup.scale.set(0.25, 0.25, 0.25);
          padGroup.position.set(x, getElevation(x, z), z);

          if (meta) {
            const hitBox = new THREE.Mesh(
              new THREE.BoxGeometry(20 * scale, 24 * scale, 20 * scale),
              new THREE.MeshBasicMaterial({ visible: false })
            );
            hitBox.position.y = 10 * scale;
            hitBox.userData = { ...meta, worldPos: padGroup.position.clone() };
            padGroup.add(hitBox);
            interactables.push(hitBox);

            const tag = makeFloatingTag(meta.shortTitle, meta.subLabel, meta.accent || '#38bdf8');
            tag.position.set(0, 27 * scale, 0);
            padGroup.add(tag);
          }

          return padGroup;
        };

        const buildMapRocket = (scale, type = "medium", rocketId = null) => {
          const rGroup = new THREE.Group();
          const core = new THREE.Mesh(new THREE.CylinderGeometry(0.8 * scale, 0.8 * scale, 8.5 * scale, 24), matRocketBody);
          core.position.y = 5.25 * scale;
          core.castShadow = true;
          rGroup.add(core);

          const interstage = new THREE.Mesh(new THREE.CylinderGeometry(0.82 * scale, 0.82 * scale, 1.2 * scale, 24), matRocketDark);
          interstage.position.y = 9.8 * scale;
          rGroup.add(interstage);

          const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.8 * scale, 0.8 * scale, 2.2 * scale, 24), matRocketBody);
          upper.position.y = 11.5 * scale;
          rGroup.add(upper);

          const nose = new THREE.Mesh(new THREE.ConeGeometry(0.85 * scale, 2.8 * scale, 24), type === "heavy" ? matRocketDark : matRocketBody);
          nose.position.y = 14.0 * scale;
          nose.castShadow = true;
          rGroup.add(nose);

          const engine = new THREE.Mesh(new THREE.CylinderGeometry(0.45 * scale, 0.75 * scale, 1.0 * scale, 20), matSteel);
          engine.position.y = 0.5 * scale;
          engine.castShadow = true;
          rGroup.add(engine);

          const plumeGroup = new THREE.Group();
          const pOuterMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false });
          const pInnerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
          const pOuter = new THREE.Mesh(new THREE.ConeGeometry(1.4 * scale, 5.2 * scale, 16), pOuterMat);
          pOuter.rotation.x = Math.PI;
          pOuter.position.y = -2.6 * scale;
          const pInner = new THREE.Mesh(new THREE.ConeGeometry(0.7 * scale, 3.0 * scale, 16), pInnerMat);
          pInner.rotation.x = Math.PI;
          pInner.position.y = -1.5 * scale;
          plumeGroup.add(pOuter, pInner);
          plumeGroup.position.y = 0;
          plumeGroup.visible = false;
          rGroup.add(plumeGroup);

          rGroup.scale.set(0.25, 0.25, 0.25);

          if (rocketId) {
            rGroup.userData = { id: rocketId, plume: plumeGroup, initialY: 0 };
          }
          return rGroup;
        };

        // 2024: Suborbital Pad & Leaf Space Tracking Dish
        const subPad = buildPadComplex(-35, 10, 0.65, false, {
          name: "Suborbital Launch Complex",
          shortTitle: "SUBORBITAL PAD",
          subLabel: "T-MINUS BARRACUDA",
          desc: "Operational hypersonic test pad & campaign staging area.",
          yearReq: 2024,
          accent: "#22d3ee"
        });
        p2024.add(subPad);

        const dishBase = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.9, 2.4, 16), matConcrete);
        dishBase.scale.set(0.25, 0.25, 0.25);
        dishBase.position.set(-40, getElevation(-40, 16) + 0.3, 16);
        const radome = new THREE.Mesh(new THREE.SphereGeometry(2.2, 20, 20), matRocketBody);
        radome.scale.set(0.25, 0.25, 0.25);
        radome.position.set(-40, getElevation(-40, 16) + 0.85, 16);
        radome.castShadow = true;
        p2024.add(dishBase, radome, buildRoadCorridor(-40, 45, -35, 10, 1.0));

        // 2026: Gatehouse & Utility Hub
        const gate = buildHIF(9, 7, {
          name: "Primary Security Gatehouse",
          desc: "Site access control, range safety command & communications.",
          yearReq: 2026,
          worldPos: new THREE.Vector3(-40, getElevation(-40, 45), 45)
        }); 
        gate.position.set(-40, getElevation(-40, 45), 45);
        gate.rotation.y = Math.PI / 4;
        p2026.add(gate);

        const hub = buildHIF(11, 14, {
          name: "Central Utility & Power Hub",
          desc: "Primary electrical substation, fiber telemetry & water storage.",
          yearReq: 2026,
          worldPos: new THREE.Vector3(-30, getElevation(-30, 40), 40)
        });
        hub.position.set(-30, getElevation(-30, 40), 40);
        p2026.add(hub, buildRoadCorridor(-40, 45, -20, 25, 1.3));

        // 2028: Pad 1 (Isar Spectrum) & Main HIF
        const pad1 = buildPadComplex(-5, 15, 1.05, true, {
          name: "Orbital Launch Complex 1 (Isar)",
          shortTitle: "PAD 1 • SPECTRUM",
          subLabel: "ISAR AEROSPACE",
          desc: "Dedicated orbital launch complex for Spectrum 2-stage vehicle.",
          rocketId: "spectrum-1",
          yearReq: 2028,
          accent: "#38bdf8"
        });
        const rocket1 = buildMapRocket(1.05, "medium", "spectrum-1");
        rocket1.position.set(-5, getElevation(-5, 15) + 0.3, 15);
        rocket1.userData.initialY = rocket1.position.y;
        p2028.add(pad1, rocket1);
        
        const hif1 = buildHIF(16, 13, {
          name: "Horizontal Integration Facility (HIF)",
          desc: "Primary orbital vehicle assembly & payload integration hangar.",
          yearReq: 2028,
          worldPos: new THREE.Vector3(-20, getElevation(-20, 25), 25)
        });
        hif1.position.set(-20, getElevation(-20, 25), 25);
        p2028.add(hif1, buildRoadCorridor(-20, 25, -5, 15, 1.4));

        // 2030: Pad 2 (RDX Aurora-8) & HIF Expansion
        const pad2 = buildPadComplex(5, 35, 1.2, true, {
          name: "Orbital Launch Complex 2 (RDX)",
          shortTitle: "PAD 2 • AURORA-8",
          subLabel: "REACTION DYNAMICS",
          desc: "Domestic hybrid-rocket orbital pad supporting polar SSO missions.",
          rocketId: "aurora-8",
          yearReq: 2030,
          accent: "#a855f7"
        }); 
        const rocket2 = buildMapRocket(1.2, "medium", "aurora-8");
        rocket2.position.set(5, getElevation(5, 35) + 0.3, 35);
        rocket2.userData.initialY = rocket2.position.y;
        p2030.add(pad2, rocket2);
        
        const hifExt = buildHIF(13, 11, {
          name: "Payload Processing & Cleanroom Facility",
          desc: "Satellite fueling, encapsulation & multi-customer staging.",
          yearReq: 2030,
          worldPos: new THREE.Vector3(-35, getElevation(-35, 26), 26)
        });
        hifExt.position.set(-35, getElevation(-35, 26), 26);
        p2030.add(hifExt, buildRoadCorridor(-20, 25, 5, 35, 1.4));

        // 2032: Pad 3 (Cyclone-4M Baseline) & Pad 4
        const pad3 = buildPadComplex(-20, 0, 1.5, true, {
          name: "Medium-Lift Launch Complex (LC-1)",
          shortTitle: "LC-1 • CYCLONE-4M",
          subLabel: "MEDIUM LIFT BASELINE",
          desc: "Maximum reference hazard envelope complex (5,000 kg LEO class).",
          rocketId: "c4m-baseline",
          yearReq: 2032,
          accent: "#f43f5e"
        }); 
        const rocket3 = buildMapRocket(1.5, "heavy", "c4m-baseline");
        rocket3.position.set(-20, getElevation(-20, 0) + 0.35, 0);
        rocket3.userData.initialY = rocket3.position.y;
        p2032.add(pad3, rocket3);
        
        const pad4 = buildPadComplex(0, 5, 1.15, true, {
          name: "Commercial Orbital Pad 4",
          shortTitle: "PAD 4 • MULTI-USER",
          subLabel: "EXPANSION COMPLEX",
          desc: "Fourth high-cadence commercial orbital pad completing master plan.",
          yearReq: 2032,
          accent: "#34d399"
        });
        p2032.add(pad4, buildRoadCorridor(-20, 25, -20, 0, 1.5), buildRoadCorridor(-20, 0, 0, 5, 1.3));

        scene.add(p2024, p2026, p2028, p2030, p2032);
        phasesRef.current = { p2024, p2026, p2028, p2030, p2032 };
        
        sceneRocketsRef.current = {
          'spectrum-1': rocket1,
          'aurora-8': rocket2,
          'c4m-baseline': rocket3
        };

        const hoverRingGeo = new THREE.RingGeometry(3.2, 3.8, 36);
        const hoverRingMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
        const hoverRing = new THREE.Mesh(hoverRingGeo, hoverRingMat);
        hoverRing.rotation.x = -Math.PI / 2;
        hoverRing.visible = false;
        scene.add(hoverRing);

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let downPos = { x: 0, y: 0 };

        const breakLerp = (e) => {
          cameraLerpRef.current = null;
          camPosLerpRef.current = null;
          if (e && e.clientX !== undefined) {
            downPos = { x: e.clientX, y: e.clientY };
          }
        };

        const onPointerMove = (e) => {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(interactables, false);
          const validHit = hits.find(h => h.object.userData && yearRef.current >= (h.object.userData.yearReq || 2024));

          if (validHit) {
            const data = validHit.object.userData;
            renderer.domElement.style.cursor = 'pointer';
            setHoveredFacility(data);
            if (data.worldPos) {
              hoverRing.position.set(data.worldPos.x, data.worldPos.y + 0.35, data.worldPos.z);
              hoverRing.visible = true;
            }
          } else {
            renderer.domElement.style.cursor = 'grab';
            setHoveredFacility(null);
            hoverRing.visible = false;
          }
        };

        const onPointerUp = (e) => {
          const distMoved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
          if (distMoved > 6) return;

          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(interactables, false);
          const validHit = hits.find(h => h.object.userData && yearRef.current >= (h.object.userData.yearReq || 2024));

          if (validHit) {
            const data = validHit.object.userData;
            if (data.rocketId) {
              setSelectedMission(data.rocketId);
            } else if (data.worldPos) {
              cameraLerpRef.current = data.worldPos.clone();
              camPosLerpRef.current = data.worldPos.clone().add(new THREE.Vector3(18, 14, 18));
              setActivePreset('custom');
            }
          }
        };

        renderer.domElement.addEventListener('pointerdown', breakLerp);
        renderer.domElement.addEventListener('pointermove', onPointerMove);
        renderer.domElement.addEventListener('pointerup', onPointerUp);
        renderer.domElement.addEventListener('wheel', breakLerp, { passive: true });
        renderer.domElement.addEventListener('touchstart', breakLerp, { passive: true });

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);

          controls.autoRotate = autoOrbitRef.current && !launchStateRef.current.active;
          controls.autoRotateSpeed = 0.75;
          controls.update();

          if (hoverRing.visible) {
            const s = 1 + Math.sin(Date.now() * 0.008) * 0.08;
            hoverRing.scale.set(s, s, 1);
          }

          // Smooth timeline scale transitions
          const curY = yearRef.current;
          const phasePairs = [
            [p2024, 2024], [p2026, 2026], [p2028, 2028], [p2030, 2030], [p2032, 2032]
          ];
          phasePairs.forEach(([group, reqYear]) => {
            if (!group) return;
            const active = curY >= reqYear;
            if (active) group.visible = true;
            const targetS = active ? 1 : 0.001;
            group.scale.lerp(new THREE.Vector3(1, targetS, 1), 0.12);
            if (!active && group.scale.y < 0.02) group.visible = false;
          });

          const ls = launchStateRef.current;
          if (ls.active && sceneRocketsRef.current) {
            const r = sceneRocketsRef.current[ls.rocketId];
            if (r) {
              ls.time += 0.015;
              const accel = ls.time * ls.time * 30; 
              r.position.y = r.userData.initialY + accel;
              r.userData.plume.visible = true;
              r.userData.plume.scale.setScalar(0.85 + Math.sin(Date.now() * 0.04) * 0.25);
              
              launchPointLight.position.set(r.position.x, r.position.y - 1.5, r.position.z);
              launchPointLight.intensity = 3.5 + Math.sin(Date.now() * 0.05) * 1.0;

              controls.target.lerp(r.position, 0.09);

              if (r.position.y > r.userData.initialY + 120) {
                 ls.active = false;
                 r.position.y = r.userData.initialY;
                 r.userData.plume.visible = false;
                 launchPointLight.intensity = 0;

                 controls.target.set(-10, 0, 15);
                 camera.position.set(55, 45, 60);

                 onHandoffRef.current(ls.rocketId);
              }
            }
          } else {
            launchPointLight.intensity = 0;
            if (cameraLerpRef.current) {
              controls.target.lerp(cameraLerpRef.current, 0.07);
              if (camPosLerpRef.current) {
                camera.position.lerp(camPosLerpRef.current, 0.06);
              }
              if (controls.target.distanceTo(cameraLerpRef.current) < 0.15) {
                 cameraLerpRef.current = null;
                 camPosLerpRef.current = null;
              }
            }
          }

          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!currentContainer) return;
          camera.aspect = currentContainer.clientWidth / currentContainer.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(currentContainer.clientWidth, currentContainer.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          renderer.domElement.removeEventListener('pointerdown', breakLerp);
          renderer.domElement.removeEventListener('pointermove', onPointerMove);
          renderer.domElement.removeEventListener('pointerup', onPointerUp);
          renderer.domElement.removeEventListener('wheel', breakLerp);
          renderer.domElement.removeEventListener('touchstart', breakLerp);
          
          if (currentContainer && currentContainer.contains(renderer.domElement)) {
            currentContainer.removeChild(renderer.domElement);
          }
          
          scene.traverse((object) => {
            if (object.geometry) object.geometry.dispose();
            if (object.material) {
              if (object.material.map) object.material.map.dispose();
              if (Array.isArray(object.material)) object.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
              else object.material.dispose();
            }
          });
          
          renderer.dispose();
        };
      }, []);

      return (
        <div className="relative w-full h-[550px]">
          {isLoading && (
            <div className="absolute inset-0 z-30 flex flex-col items-center justify-center bg-[#091321] rounded-xl pointer-events-none">
              <span className="text-cyan-400 font-mono text-xs font-bold tracking-[0.2em] mb-4 animate-pulse">LOADING SATELLITE DATA...</span>
              <div className="w-48 h-1 bg-slate-800 rounded-full overflow-hidden">
                <div className="w-full h-full bg-cyan-400 rounded-full animate-pulse"></div>
              </div>
            </div>
          )}

          {/* LEFT HUD: ORBITAL LAUNCH DEMO */}
          <div className="absolute top-4 left-4 p-4 bg-[#091321]/85 backdrop-blur-md rounded-xl border border-slate-600/30 shadow-2xl z-20 flex flex-col gap-3 min-w-[210px]">
            <div className="flex items-center justify-between">
              <span className="text-[10px] font-mono text-fuchsia-400 font-bold tracking-wider">ORBITAL LAUNCH DEMO</span>
              <span className="text-[9px] font-mono text-slate-400 bg-slate-800/80 px-1.5 py-0.5 rounded">CLICK PAD</span>
            </div>
            <select 
              value={selectedMission}
              onChange={(e) => {
                const rid = e.target.value;
                setSelectedMission(rid);
                if (rid === 'spectrum-1' && year < 2028) setBuildYear(2028);
                if (rid === 'aurora-8' && year < 2030) setBuildYear(2030);
                if (rid === 'c4m-baseline' && year < 2032) setBuildYear(2032);
              }}
              className="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none cursor-pointer focus:border-cyan-400"
            >
              {orbitalRockets.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
            </select>
            <button 
              onClick={() => {
                 if (selectedMission === 'spectrum-1' && year < 2028) setBuildYear(2028);
                 if (selectedMission === 'aurora-8' && year < 2030) setBuildYear(2030);
                 if (selectedMission === 'c4m-baseline' && year < 2032) setBuildYear(2032);

                 if (!launchStateRef.current.active) {
                   launchStateRef.current = { active: true, time: 0, rocketId: selectedMission };
                 }
              }}
              className="bg-fuchsia-600 hover:bg-fuchsia-500 text-white text-xs font-bold py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow-lg"
            >
              <IconPlay /> Launch To Orbit
            </button>
          </div>

          {/* HOVER INSPECTOR BADGE */}
          {hoveredFacility && (
            <div className="absolute bottom-44 left-4 z-20 max-w-xs bg-[#091321]/90 backdrop-blur-md border border-cyan-400/40 rounded-xl p-3 shadow-2xl pointer-events-none transition-all">
              <div className="flex items-center gap-2 mb-1">
                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping" />
                <span className="text-xs font-bold text-white font-mono">{hoveredFacility.name}</span>
              </div>
              <p className="text-[11px] text-slate-300 leading-snug">{hoveredFacility.desc}</p>
            </div>
          )}

          {/* BOTTOM HUD: TIMELINE SLIDER & CAMERA PRESETS */}
          <div className="absolute bottom-4 left-4 right-4 z-20 p-4 bg-[#091321]/75 backdrop-blur-md rounded-xl border border-slate-600/30 shadow-2xl">
            <div className="flex justify-between items-center mb-3">
              <span className="text-xs font-mono text-slate-300">Scrub Infrastructure Timeline</span>
              <span className="text-sm font-mono text-cyan-400 font-bold bg-slate-900 border border-slate-700 px-3 py-1 rounded-lg">Year: {year}</span>
            </div>
            <input 
              type="range" 
              min="2022" 
              max="2032" 
              step="1" 
              value={year}
              onChange={(e) => setBuildYear(parseInt(e.target.value))}
              className="w-full accent-cyan-400 h-2 bg-slate-800 rounded-lg cursor-pointer"
            />
            <div className="flex justify-between text-[10px] sm:text-xs font-mono text-slate-400 mt-3 px-1">
              <span className={year >= 2024 && year < 2028 ? "text-cyan-400" : ""}>2024 (Sub)</span>
              <span className={year >= 2028 && year < 2030 ? "text-cyan-400" : ""}>2028 (Pad 1)</span>
              <span className={year >= 2030 && year < 2032 ? "text-cyan-400" : ""}>2030 (Pad 2)</span>
              <span className={year === 2032 ? "text-cyan-400" : ""}>2032 (4-Pad Complex)</span>
            </div>

            <div className="mt-3 pt-3 border-t border-slate-700/50 flex flex-wrap items-center justify-center sm:justify-between gap-1.5">
              <span className="text-[10px] font-mono text-slate-400 hidden sm:inline">CAMERA VIEW</span>
              <div className="flex flex-wrap justify-center gap-1.5 w-full sm:w-auto">
                <button
                  onClick={() => applyCameraPreset('overview')}

    function TelemetryArcViewer2D({ rocket, progress, currentAlt, trajData }) {
      const isSuborbital = rocket.missionType === 'Suborbital';
      const maxX = isSuborbital ? 100 : 2000;
      const maxY = isSuborbital ? 100 : 500;
      
      const scrollRef = useRef(null);

      const mapX = (x) => 50 + (x / maxX) * 850;
      const mapY = (y) => 260 - (y / maxY) * 220; 

      const { curve, tMaxQ, tKarman, tMeco } = trajData;
      const curvePoints = curve.getPoints(100);
      const svgPath = curvePoints.map(p => `${mapX(p.x)},${mapY(p.y)}`).join(' ');

      const milestones = isSuborbital ? [
        { label: "MAX-Q", alt: "15 km", t: tMaxQ, align: "start", dx: 12, dy: 14 },
        { label: "APOGEE", alt: "100 km", t: 0.5, align: "middle", dx: 0, dy: -16 }
      ] : [
        { label: "MAX-Q", alt: "15 km", t: tMaxQ, align: "start", dx: 14, dy: 12 },
        { label: "KARMAN LINE", alt: "100 km", t: tKarman, align: "start", dx: 14, dy: 4 },
        { label: "MECO / SEP", alt: "150 km", t: tMeco, align: "start", dx: 14, dy: -12 },
        { label: "ORBIT", alt: "500 km", t: 1.0, align: "end", dx: -12, dy: -16 }
      ];

      const t = Math.max(0, Math.min(1, progress / 100));
      const currentPoint = curve.getPoint(t);
      const rocketPx = mapX(currentPoint.x);
      const rocketPy = mapY(currentPoint.y);
      
      let rotation = 0;
      if (t < 1) {
        const tangent = curve.getTangent(t).normalize();
        rotation = Math.atan2(-tangent.y, tangent.x) * (180 / Math.PI); 
      }

      const isMeco = t >= trajData.tMeco;
      const dt = isMeco ? t - trajData.tMeco : 0;
      const driftX = isMeco ? dt * 250 : 0;
      const driftY = isMeco ? dt * dt * 2000 : 0; 
      const boosterVisible = dt < 0.15; 
      const plumePulse = isMeco ? 0 : 0.8 + Math.sin(progress * 0.5) * 0.4;

      useEffect(() => {
        if (scrollRef.current) {
          const containerHalfWidth = scrollRef.current.clientWidth / 2;
          scrollRef.current.scrollLeft = rocketPx - containerHalfWidth;
        }
      }, [rocketPx]);

      return (
        <div ref={scrollRef} className="w-full h-[550px] bg-[#091321] relative overflow-x-auto overflow-y-hidden touch-pan-x flex justify-start md:justify-center no-scrollbar pointer-events-auto">
          <div className="min-w-[850px] w-full h-full relative flex items-center justify-center pointer-events-none">
            <svg viewBox="0 0 950 300" className="w-full h-full">
              <line x1="50" y1="260" x2="900" y2="260" stroke="#1e293b" strokeWidth="2" />
              <line x1="50" y1="40" x2="50" y2="260" stroke="#1e293b" strokeWidth="2" />
              <line x1="50" y1="150" x2="900" y2="150" stroke="#0f172a" strokeWidth="1" />
              
              {maxY >= 100 && (
                <g>
                  <line x1="50" y1={mapY(100)} x2="900" y2={mapY(100)} stroke="#334155" strokeDasharray="4 4" strokeWidth="1" />
                  <text x="900" y={mapY(100) - 6} fill="#64748b" fontSize="12" textAnchor="end" className="font-mono">KARMAN LINE (100km)</text>
                </g>
              )}
              
              <text x="40" y="265" fill="#475569" fontSize="12" textAnchor="end" className="font-mono">0km</text>
              <text x="40" y="45" fill="#475569" fontSize="12" textAnchor="end" className="font-mono">{maxY}km</text>
              <text x="900" y="280" fill="#475569" fontSize="12" textAnchor="end" className="font-mono">Downrange ({maxX}km)</text>

              <polyline points={svgPath} fill="none" stroke="#c026d3" strokeWidth="3" />

              {milestones.map((m, idx) => {
                const pt = curve.getPoint(m.t);
                const px = mapX(pt.x);
                const py = mapY(pt.y);
                return (
                  <g key={idx}>
                    <circle cx={px} cy={py} r="5" fill="#38bdf8" stroke="#091321" strokeWidth="2" />
                    <text 
                      x={px + m.dx} 
                      y={py + m.dy} 
                      fill="#94a3b8" 
                      fontSize="12" 
                      textAnchor={m.align} 
                      className="font-mono font-bold"
                    >
                      {m.label} ({m.alt})
                    </text>
                  </g>
                );
              })}

              <line x1={rocketPx} y1={rocketPy} x2={rocketPx} y2="260" stroke="#38bdf8" strokeDasharray="3 3" opacity="0.5" strokeWidth="1.5" />
              <ellipse cx={rocketPx} cy="260" rx="6" ry="2" fill="#38bdf8" opacity="0.8" />

              <g transform={`translate(${rocketPx}, ${rocketPy - 30})`}>
                <rect x="-32" y="-12" width="64" height="22" rx="4" fill="#091321" stroke="#38bdf8" strokeWidth="1" opacity="0.95" />
                <text x="0" y="4" fill="#38bdf8" fontSize="12" fontWeight="bold" textAnchor="middle" className="font-mono">{currentAlt} km</text>
              </g>
              
              <g transform={`translate(${rocketPx}, ${rocketPy}) rotate(${rotation})`}>
                <polygon points="5,-4 16,0 5,4" fill="#f8fafc" />
                {boosterVisible && (
                  <g transform={`translate(${-driftX}, ${driftY})`}>
                    <polygon points="-8,-4 5,-4 5,4 -8,4" fill="#94a3b8" />
                    <rect x="-11" y="-2" width="3" height="4" fill="#cbd5e1" />
                    {!isMeco && <polygon points="-11,-3 -20,0 -11,3" fill="#c026d3" opacity={0.6 * plumePulse} />}
                  </g>
                )}
              </g>
            </svg>
          </div>
        </div>
      );
    }

    function TelemetryArcViewer3D({ rocket, progress, trajData }) {
      const mountRef = useRef(null);
      const sceneRef = useRef({});
      const [camMode, setCamMode] = useState('follow');
      const camModeRef = useRef('follow');

      useEffect(() => { camModeRef.current = camMode; }, [camMode]);

      const resetOverview = () => {
        setCamMode('overview');
        const { camera, controls } = sceneRef.current;
        if (!camera || !controls) return;
        if (rocket.missionType === 'Suborbital') {
          camera.position.set(50, 65, 175);
          controls.target.set(50, 45, 0);
        } else {
          camera.position.set(1000, 340, 2100);
          controls.target.set(1000, 240, 0);
        }
        controls.update();
      };

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;
        const currentContainer = container;

        const w = currentContainer.clientWidth;
        const h = currentContainer.clientHeight || 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x091321);

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 12000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        currentContainer.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;

        const isSub = rocket.missionType === 'Suborbital';
        if (isSub) {
          camera.position.set(50, 65, 175);
          controls.target.set(50, 45, 0);
        } else {
          camera.position.set(1000, 340, 2100);
          controls.target.set(1000, 240, 0);
        }
        controls.update();

        const { curve, tMaxQ, tKarman, tMeco } = trajData;
        const markerScale = isSub ? 4 : 40; 

        // Volumetric Trajectory Tube instead of 1px line
        const tubeGeo = new THREE.TubeGeometry(curve, 120, markerScale * 0.14, 12, false);
        const tubeMat = new THREE.MeshBasicMaterial({ color: 0xc026d3, transparent: true, opacity: 0.65 });
        const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
        scene.add(tubeMesh);

        // Ground shadow track line
        const groundPts = curve.getPoints(100).map(p => new THREE.Vector3(p.x, 0.2, p.z));
        const groundGeo = new THREE.BufferGeometry().setFromPoints(groundPts);
        const groundMat = new THREE.LineDashedMaterial({ color: 0x334155, dashSize: markerScale * 0.6, gapSize: markerScale * 0.4 });
        const groundTrack = new THREE.Line(groundGeo, groundMat);
        groundTrack.computeLineDistances();
        scene.add(groundTrack);

        const { group: markerMesh, stage1, plume, s2Plume } = createTelemetryRocket(markerScale * 0.14, rocket.missionType === 'Medium Lift' ? 'heavy' : 'medium');
        markerMesh.rotation.x = Math.PI / 2;
        
        const markerGroup = new THREE.Group();
        markerGroup.add(markerMesh);
        scene.add(markerGroup);

        const gridScale = isSub ? 240 : 4400;
        const grid = new THREE.GridHelper(gridScale, 40, 0x1e293b, 0x0f172a);
        grid.position.x = isSub ? 50 : 1000;
        scene.add(grid);

        const plumbMat = new THREE.LineDashedMaterial({ color: 0x38bdf8, dashSize: markerScale * 0.8, gapSize: markerScale * 0.6, transparent: true, opacity: 0.7 });
        const plumbGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
        const plumbLine = new THREE.Line(plumbGeo, plumbMat);
        scene.add(plumbLine);

        const reticleGeo = new THREE.RingGeometry(markerScale * 0.8, markerScale * 1.25, 32);
        const reticleMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.65, side: THREE.DoubleSide });
        const groundReticle = new THREE.Mesh(reticleGeo, reticleMat);
        groundReticle.rotation.x = -Math.PI / 2;
        scene.add(groundReticle);

        const makeTextSprite = (text, color = '#38bdf8') => {
          const canvas = document.createElement('canvas');
          canvas.width = 512; canvas.height = 128;
          const ctx = canvas.getContext('2d');
          
          ctx.fillStyle = 'rgba(9, 19, 33, 0.88)';
          ctx.strokeStyle = color;
          ctx.lineWidth = 4;
          ctx.beginPath();
          const x = 12, y = 12, w = 488, h = 104, r = 20;
          ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
          ctx.fill(); ctx.stroke();

          ctx.fillStyle = color;
          ctx.font = 'bold 42px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(text, 256, 64);

          const texture = new THREE.CanvasTexture(canvas);
          const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
          const sprite = new THREE.Sprite(material);
          sprite.scale.set(markerScale * 5.8, markerScale * 1.45, 1);
          return sprite;
        };

        const gateGeo = new THREE.TorusGeometry(markerScale * 1.5, markerScale * 0.1, 14, 36);
        
        const posMaxQ = curve.getPoint(tMaxQ);
        const tanMaxQ = curve.getTangent(tMaxQ).normalize();
        const gateMaxQ = new THREE.Mesh(gateGeo, new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.45 }));
        gateMaxQ.position.copy(posMaxQ);
        gateMaxQ.lookAt(posMaxQ.clone().add(tanMaxQ));
        scene.add(gateMaxQ);
        const spriteMaxQ = makeTextSprite('MAX-Q: 15 km', '#22d3ee');
        spriteMaxQ.position.copy(posMaxQ.clone().add(new THREE.Vector3(0, markerScale * 2.3, 0)));
        scene.add(spriteMaxQ);

        const posKarman = curve.getPoint(tKarman);
        const tanKarman = curve.getTangent(tKarman).normalize();
        const gateKarman = new THREE.Mesh(gateGeo, new THREE.MeshBasicMaterial({ color: 0xc026d3, transparent: true, opacity: 0.45 }));
        gateKarman.position.copy(posKarman);
        gateKarman.lookAt(posKarman.clone().add(tanKarman));
        scene.add(gateKarman);
        const labelKarman = isSub ? 'APOGEE: 100 km' : 'KARMAN: 100 km';
        const spriteKarman = makeTextSprite(labelKarman, '#c026d3');
        spriteKarman.position.copy(posKarman.clone().add(new THREE.Vector3(0, markerScale * 2.3, 0)));
        scene.add(spriteKarman);

        if (!isSub) {
          const posMeco = curve.getPoint(tMeco);
          const tanMeco = curve.getTangent(tMeco).normalize();
          const gateMeco = new THREE.Mesh(gateGeo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.45 }));
          gateMeco.position.copy(posMeco);
          gateMeco.lookAt(posMeco.clone().add(tanMeco));
          scene.add(gateMeco);
          const spriteMeco = makeTextSprite('MECO: 150 km', '#38bdf8');
          spriteMeco.position.copy(posMeco.clone().add(new THREE.Vector3(0, markerScale * 2.3, 0)));
          scene.add(spriteMeco);
        }

        sceneRef.current = { curve, markerGroup, plumbLine, groundReticle, stage1, plume, s2Plume, tMeco, lastT: 0, camera, controls, markerScale };

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);

          if (sceneRef.current.plume) {
            const { plume, s2Plume, stage1, tMeco, lastT, markerGroup, controls } = sceneRef.current;
            if (lastT >= tMeco) {
              const dt = lastT - tMeco;
              plume.scale.setScalar(0.001); 
              if (s2Plume) {
                s2Plume.visible = !isSub && lastT < 1.0;
                s2Plume.scale.setScalar(0.8 + Math.sin(Date.now() * 0.025) * 0.25);
              }
              stage1.position.y = -dt * (isSub ? 80 : 300); 
              stage1.position.z = dt * dt * (isSub ? 400 : 1500); 
              stage1.visible = dt < 0.16; 
            } else {
              const p = 0.85 + Math.sin(Date.now() * 0.02) * 0.25; 
              plume.scale.setScalar(p);
              if (s2Plume) s2Plume.visible = false;
              stage1.position.set(0, 0, 0);
              stage1.visible = true;
            }

            if (camModeRef.current === 'follow' && markerGroup) {
              controls.target.lerp(markerGroup.position, 0.1);
            }
          }

          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!currentContainer) return;
          camera.aspect = currentContainer.clientWidth / currentContainer.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(currentContainer.clientWidth, currentContainer.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          if (currentContainer && currentContainer.contains(renderer.domElement)) {
            currentContainer.removeChild(renderer.domElement);
          }
          
          scene.traverse((object) => {
            if (object.geometry) object.geometry.dispose();
            if (object.material) {
              if (object.material.map) object.material.map.dispose();
              if (Array.isArray(object.material)) object.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
              else object.material.dispose();
            }
          });
          
          renderer.dispose();
        };
      }, [rocket.id]); 

      useEffect(() => {
        const { curve, markerGroup, plumbLine, groundReticle } = sceneRef.current;
        if (curve && markerGroup && plumbLine && groundReticle) {
          const t = Math.max(0, Math.min(1, progress / 100));
          sceneRef.current.lastT = t; 

          const position = curve.getPoint(t);
          
          const positions = plumbLine.geometry.attributes.position.array;
          positions[0] = position.x; positions[1] = position.y; positions[2] = position.z;
          positions[3] = position.x; positions[4] = 0.1;        positions[5] = position.z;
          plumbLine.geometry.attributes.position.needsUpdate = true;
          plumbLine.computeLineDistances(); 
          
          groundReticle.position.set(position.x, 0.25, position.z);
          
          if (t < 1) {
            const tangent = curve.getTangent(t).normalize();
            markerGroup.position.copy(position);
            const lookAtTarget = position.clone().add(tangent);
            markerGroup.lookAt(lookAtTarget);
          } else {
            markerGroup.position.copy(position);
          }
        }
      }, [progress]);

      return (
        <div className="relative w-full h-[550px]">
          <div className="absolute top-3 right-3 z-20 flex gap-1.5 bg-[#091321]/85 backdrop-blur-md p-1.5 rounded-xl border border-slate-600/30 shadow-2xl">
            <button
              onClick={() => setCamMode('follow')}
              className={`px-2.5 py-1.5 rounded-lg text-[10px] font-mono font-bold transition ${camMode === 'follow' ? 'bg-fuchsia-500/20 text-fuchsia-400 border border-fuchsia-500/30' : 'text-slate-400 hover:text-white'}`}
            >
              TRACK VEHICLE
            </button>
            <button
              onClick={resetOverview}
              className={`px-2.5 py-1.5 rounded-lg text-[10px] font-mono font-bold transition ${camMode === 'overview' ? 'bg-fuchsia-500/20 text-fuchsia-400 border border-fuchsia-500/30' : 'text-slate-400 hover:text-white'}`}
            >
              FULL ARC
            </button>
          </div>
          <div ref={mountRef} className="w-full h-full" />
        </div>
      );
    }

    function TelemetryOrbitViewer3D({ rocket, progress, isFlightPlaying }) {
      const mountRef = useRef(null);
      const sceneRef = useRef({});
      const progressRef = useRef(progress);
      const [globeCamMode, setGlobeCamMode] = useState('auto');
      const globeCamModeRef = useRef('auto');

      useEffect(() => { progressRef.current = progress; }, [progress]);
      useEffect(() => { sceneRef.current.isFlightPlaying = isFlightPlaying; }, [isFlightPlaying]);
      useEffect(() => { globeCamModeRef.current = globeCamMode; }, [globeCamMode]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;
        const currentContainer = container;

        const w = currentContainer.clientWidth;
        const h = currentContainer.clientHeight || 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x091321);

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.domElement.style.touchAction = 'none';
        currentContainer.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.enableRotate = true; 
        controls.enableZoom = true;
        controls.minDistance = 2; 
        controls.maxDistance = 250; 

        const dummyCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 10000);
        dummyCamera.position.set(0, 40, 0); 
        const dummyControls = new THREE.OrbitControls(dummyCamera, renderer.domElement);
        dummyControls.enableDamping = true;
        dummyControls.enablePan = false;
        dummyControls.minDistance = 2; 
        dummyControls.maxDistance = 250; 
        dummyControls.maxPolarAngle = Math.PI / 4; 

        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        const earthRadius = 25;
        const coreGeo = new THREE.SphereGeometry(earthRadius, 36, 36);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x07101c });
        earthGroup.add(new THREE.Mesh(coreGeo, coreMat));

        // Translucent 100 km Karman Atmospheric Shell
        const atmoGeo = new THREE.SphereGeometry(earthRadius + 0.65, 36, 36);
        const atmoMat = new THREE.MeshBasicMaterial({
          color: 0x38bdf8,
          transparent: true,
          opacity: 0.08,
          blending: THREE.AdditiveBlending,
          side: THREE.BackSide
        });
        earthGroup.add(new THREE.Mesh(atmoGeo, atmoMat));

        const wireMat = new THREE.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.75 });
        const wireGeo = new THREE.EdgesGeometry(new THREE.SphereGeometry(earthRadius, 18, 18));
        earthGroup.add(new THREE.LineSegments(wireGeo, wireMat));

        const texLoader = new THREE.TextureLoader();
        texLoader.crossOrigin = 'anonymous';
        texLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png', (texture) => {
          const mapMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, color: 0x38bdf8 });
          const mapMesh = new THREE.Mesh(new THREE.SphereGeometry(earthRadius + 0.02, 36, 36), mapMat);
          mapMesh.rotation.y = -Math.PI / 2; 
          earthGroup.add(mapMesh);
        });

        const eqGeo = new THREE.RingGeometry(earthRadius + 0.25, earthRadius + 0.45, 64);
        const eqMat = new THREE.MeshBasicMaterial({ color: 0x334155, side: THREE.DoubleSide });
        const equator = new THREE.Mesh(eqGeo, eqMat);
        equator.rotation.x = Math.PI / 2;
        earthGroup.add(equator);

        const latRad = 45.3056 * (Math.PI / 180);
        const lonRad = -60.9814 * (Math.PI / 180);
        const cx = earthRadius * Math.cos(latRad) * Math.sin(lonRad);
        const cy = earthRadius * Math.sin(latRad);
        const cz = earthRadius * Math.cos(latRad) * Math.cos(lonRad);
        const padPos = new THREE.Vector3(cx, cy, cz);
        
        const padMesh = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 12), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
        padMesh.position.copy(padPos);
        earthGroup.add(padMesh);

        let inc = 90;
        if (rocket.orbit.includes('98')) inc = 98.1;
        if (rocket.orbit.includes('87')) inc = 87.9;
        
        const orbitRadius = earthRadius + 3; 
        
        const orbitGroup = new THREE.Group();
        orbitGroup.lookAt(padPos);
        const azimuthTilt = (inc - 90) * (Math.PI / 180);
        orbitGroup.rotateZ(azimuthTilt);
        earthGroup.add(orbitGroup);

        const insertionAngle = 0.25;

        const ascentPoints = [];
        for (let i = 0; i <= 64; i++) {
          const t_val = i / 64;
          const alt = earthRadius + Math.sin(t_val * Math.PI / 2) * 3;
          const a = t_val * insertionAngle;
          ascentPoints.push(new THREE.Vector3(0, -alt * Math.sin(a), alt * Math.cos(a)));
        }
        const ascentCurve = new THREE.CatmullRomCurve3(ascentPoints);
        const ascentTube = new THREE.Mesh(
          new THREE.TubeGeometry(ascentCurve, 48, 0.08, 8, false),
          new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.85 })
        );
        orbitGroup.add(ascentTube);

        const pathPoints = [];
        for (let i = 0; i <= 128; i++) {
          const a = (i / 128) * Math.PI * 2;
          pathPoints.push(new THREE.Vector3(0, -orbitRadius * Math.sin(a), orbitRadius * Math.cos(a)));
        }
        const lineGeo = new THREE.BufferGeometry().setFromPoints(pathPoints);
        const lineMat = new THREE.LineDashedMaterial({ color: 0xc026d3, transparent: true, opacity: 0.55, dashSize: 0.5, gapSize: 0.4 });
        const orbitLine = new THREE.Line(lineGeo, lineMat);
        orbitLine.computeLineDistances();
        orbitGroup.add(orbitLine);

        const rocketPivot = new THREE.Group();
        orbitGroup.add(rocketPivot);

        const { group: rocketMesh, stage1, plume, s2Plume } = createTelemetryRocket(0.25, rocket.missionType === 'Medium Lift' ? 'heavy' : 'medium');
        rocketPivot.add(rocketMesh);

        const shadowGeo = new THREE.SphereGeometry(0.18, 10, 10);
        const shadowMat = new THREE.MeshBasicMaterial({ color: 0xf472b6 }); 
        const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
        shadowMesh.position.set(0, 0, earthRadius + 0.06); 
        rocketPivot.add(shadowMesh);

        camera.position.set(-50, 45, 35);
        controls.target.set(0, 0, 0);

        const tMeco = rocket.missionType === 'Suborbital' ? 0.5 : getTrajectoryData(false).tMeco;

        sceneRef.current = { 
          rocketPivot, 
          rocketMesh, 
          stage1, 
          plume, 
          s2Plume,
          tMeco,
          insertionAngle, 
          autoOrbitAngle: insertionAngle, 
          earthRadius,
          padPos,
          lastT: 0,
          isTransitioning: false,
          isFlightPlaying: isFlightPlaying,
          camera,
          controls
        };

        const breakTransition = () => { if (sceneRef.current) sceneRef.current.isTransitioning = false; };
        renderer.domElement.addEventListener('pointerdown', breakTransition);
        renderer.domElement.addEventListener('wheel', breakTransition, { passive: true });
        renderer.domElement.addEventListener('touchstart', breakTransition, { passive: true });

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          earthGroup.rotation.y += 0.0005; 
          
          if (sceneRef.current.rocketPivot) {
             const t = Math.max(0, Math.min(1, progressRef.current / 100));
             const { rocketPivot, rocketMesh, insertionAngle, earthRadius, padPos, plume, s2Plume, stage1, tMeco, lastT } = sceneRef.current;
             
             if (lastT >= tMeco) {
               const dt = lastT - tMeco;
               plume.scale.setScalar(0.001);
               if (s2Plume) {
                 s2Plume.visible = lastT < 1.0;
                 s2Plume.scale.setScalar(0.85 + Math.sin(Date.now() * 0.025) * 0.25);
               }
               stage1.position.y = -dt * 15; 
               stage1.position.z = -dt * dt * 100; 
               stage1.visible = dt < 0.12; 
             } else {
               const p = 0.85 + Math.sin(Date.now() * 0.018) * 0.25;
               plume.scale.setScalar(p);
               if (s2Plume) s2Plume.visible = false;
               stage1.position.set(0, 0, 0);
               stage1.visible = true;
             }

             if (t < 1) {
               rocketPivot.rotation.x = t * insertionAngle;
               const alt = earthRadius + Math.sin(t * Math.PI / 2) * 3;
               rocketMesh.position.set(0, 0, alt);
               rocketMesh.rotation.x = (Math.PI / 2) + (t * (Math.PI / 2));
               sceneRef.current.autoOrbitAngle = insertionAngle;
             } else {
               if (sceneRef.current.isFlightPlaying) {
                   sceneRef.current.autoOrbitAngle += 0.0025; 
               }
               rocketPivot.rotation.x = sceneRef.current.autoOrbitAngle;
               rocketMesh.position.set(0, 0, orbitRadius);
               rocketMesh.rotation.x = Math.PI; 
             }

             rocketPivot.updateMatrixWorld(true);
             rocketMesh.updateMatrixWorld(true);
             const currentRocketPos = new THREE.Vector3();
             rocketMesh.getWorldPosition(currentRocketPos);

             if (sceneRef.current.lastT < 1 && t >= 1) sceneRef.current.isTransitioning = true;
             if (sceneRef.current.lastT >= 1 && t < 1) sceneRef.current.isTransitioning = true;
             if (t === 0 && sceneRef.current.lastT > 0) sceneRef.current.isTransitioning = true;

             const mode = globeCamModeRef.current;
             const useChase = (mode === 'chase') || (mode === 'auto' && t >= 1);

             if (!useChase) {
                 controls.enabled = true;
                 dummyControls.enabled = false;
                 
                 camera.up.lerp(new THREE.Vector3(0, 1, 0), 0.1);
                 controls.maxPolarAngle = Math.PI;

                 if (sceneRef.current.isTransitioning) {
                     const relativeOffset = new THREE.Vector3(-50, 45, 35).sub(padPos);
                     relativeOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), earthGroup.rotation.y);
                     
                     camera.position.lerp(padPos.clone().add(relativeOffset), 0.05);
                     controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.05);
                     camera.lookAt(controls.target);
                     
                     if (controls.target.distanceTo(new THREE.Vector3(0, 0, 0)) < 0.5) sceneRef.current.isTransitioning = false;
                 } else {
                     controls.update(); 
                 }
             } else {
                 controls.enabled = false;
                 dummyControls.enabled = true;
                 dummyControls.update(); 
                 
                 const dummyPos = dummyCamera.position;
                 const localOffset = new THREE.Vector3(dummyPos.x, -dummyPos.z, dummyPos.y);
                 const targetCamWorld = rocketPivot.localToWorld(localOffset);
                 
                 const upVector = rocketPivot.localToWorld(new THREE.Vector3(0,0,1)).sub(rocketPivot.getWorldPosition(new THREE.Vector3())).normalize();

                 if (sceneRef.current.isTransitioning) {
                     camera.position.lerp(targetCamWorld, 0.05);
                     camera.up.lerp(upVector, 0.05);
                     
                     const lookTarget = controls.target.clone().lerp(currentRocketPos, 0.05);
                     controls.target.copy(lookTarget);
                     camera.lookAt(lookTarget);
                     
                     if (camera.position.distanceTo(targetCamWorld) < 1.0) sceneRef.current.isTransitioning = false;
                 } else {
                     camera.position.copy(targetCamWorld);
                     camera.up.copy(upVector);
                     controls.target.copy(currentRocketPos);
                     camera.lookAt(currentRocketPos);
                 }
             }
             sceneRef.current.lastT = t;
          }
          
          const minCamRadius = 25.6; 
          if (camera.position.length() < minCamRadius) {
              camera.position.copy(camera.position.clone().normalize().multiplyScalar(minCamRadius));
          }

          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!currentContainer) return;
          camera.aspect = currentContainer.clientWidth / currentContainer.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(currentContainer.clientWidth, currentContainer.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          renderer.domElement.removeEventListener('pointerdown', breakTransition);
          renderer.domElement.removeEventListener('wheel', breakTransition);
          renderer.domElement.removeEventListener('touchstart', breakTransition);

          if (currentContainer && currentContainer.contains(renderer.domElement)) {
            currentContainer.removeChild(renderer.domElement);
          }
          
          scene.traverse((object) => {
            if (object.geometry) object.geometry.dispose();
            if (object.material) {
              if (object.material.map) object.material.map.dispose();
              if (Array.isArray(object.material)) object.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
              else object.material.dispose();
            }
          });
          
          renderer.dispose();
        };
      }, [rocket.id]); 

      return (
        <div className="relative w-full h-[550px]">
          <div className="absolute top-3 right-3 z-20 flex gap-1.5 bg-[#091321]/85 backdrop-blur-md p-1.5 rounded-xl border border-slate-600/30 shadow-2xl">
            <button
              onClick={() => { setGlobeCamMode('auto'); if (sceneRef.current) sceneRef.current.isTransitioning = true; }}
              className={`px-2.5 py-1.5 rounded-lg text-[10px] font-mono font-bold transition ${globeCamMode === 'auto' ? 'bg-fuchsia-500/20 text-fuchsia-400 border border-fuchsia-500/30' : 'text-slate-400 hover:text-white'}`}
            >
              AUTO CAM
            </button>
            <button
              onClick={() => { setGlobeCamMode('chase'); if (sceneRef.current) sceneRef.current.isTransitioning = true; }}
              className={`px-2.5 py-1.5 rounded-lg text-[10px] font-mono font-bold transition ${globeCamMode === 'chase' ? 'bg-fuchsia-500/20 text-fuchsia-400 border border-fuchsia-500/30' : 'text-slate-400 hover:text-white'}`}
            >
              CHASE CAM
            </button>
            <button
              onClick={() => { setGlobeCamMode('globe'); if (sceneRef.current) sceneRef.current.isTransitioning = true; }}
              className={`px-2.5 py-1.5 rounded-lg text-[10px] font-mono font-bold transition ${globeCamMode === 'globe' ? 'bg-fuchsia-500/20 text-fuchsia-400 border border-fuchsia-500/30' : 'text-slate-400 hover:text-white'}`}
            >
              FREE GLOBE
            </button>
          </div>
          <div ref={mountRef} className="w-full h-full" />
        </div>
      );
    }
